<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scripts &amp; Tools | Your Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== 配色：浅瀬・深海・白の3色を軸にする ===== */
  :root {
    /* 深海（面・背景） */
    --abyss:    #06131d; /* 最深部の背景 */
    --trench:   #0c2435; /* モーダル・サムネイル下地 */
    --reef:     #1d4258; /* 罫線・枠 */
    --ink:      #0a2a3e; /* 明るい水面の上に置く文字 */

    /* 白（文字） */
    --foam:     #f2f8fa; /* 本文テキスト */
    --mist:     #c9dee7; /* 補足テキスト（説明文など） */
    --tide:     #9fc1cf; /* 注記テキスト（件数・キャプションなど） */

    /* 浅瀬（差し色） */
    --shallows: #7fd6ec; /* アクセント */
    --shallows-soft: #b9e8f4; /* コードの文字列など、浅瀬の淡い版 */

    --line:     rgba(242, 248, 250, .16); /* 深い背景の上に引く罫線 */

    --font: "Shippori Mincho", "Noto Serif JP", "Noto Serif CJK JP", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { overflow-x: hidden; } /* 背景の動く層がどの端末でも横スクロールを生まないように */
  @supports (overflow: clip) { html, body { overflow-x: clip; } }

  html.lock { overflow: hidden; }

  body {
    position: relative;
    margin: 0;
    background: var(--abyss);
    color: var(--foam);
    font-family: var(--font);
    font-size: 16px;
    font-weight: 500;
    line-height: 1.9; /* 明朝はゴシックより行間を広めに */
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* ===== 背景：上は明るい水面、下へ潜るほど深海になる =====
     水面と深海を別々の箱にせず、ページ全体を1枚の「海」として描く。
     --sh（水面エリアの高さ）は JS で実測して入れるので、どの画面幅でも境目が出ない */
  :root {
    --sh: 640px;   /* 水面エリアの高さ（JSで実測） */
    --dsc: 220px;  /* 見出しの下の「潜る余白」 */
    --ts: 1;
  }
  @media (max-width: 640px) { :root { --dsc: 140px; --ts: .6; } } /* --ts：模様の大きさの倍率。スマホでは画面に合わせて細かく */
  .ocean {
    position: absolute;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      #b4e4f2 0,
      #93d5ea calc(var(--sh) - var(--dsc) - 10px),
      #7cc4e2 calc(var(--sh) - var(--dsc) * .77),
      #519fcc calc(var(--sh) - var(--dsc) * .5),
      #2d75aa calc(var(--sh) - var(--dsc) * .23),
      #18537f calc(var(--sh) + 20px),
      #154b76 calc(var(--sh) + 260px),
      #0c2b44 calc(var(--sh) * .45 + 55%),
      var(--abyss) 100%
    ); /* ツールが増えてページが伸びても、最下部は必ず深海になる */
  }
  /* 模様の層：JSで作った小さなタイル画像を並べて敷く。
     以前のSVGフィルターはページ全体の大きさで描き直すため、スマホでは描画が追いつかずちらつきや黒抜けが出ていた */
  .ocean > .o-layer {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-repeat: repeat;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .ocean > .o-layer.ready { opacity: var(--op, 1); }

  /* --- 動き1：水面のゆらぎ ---
     白いまだら2枚と、水底に映る光の網（コースティクス）2枚を、それぞれ違う向き・速さで流す。
     模様は一度だけ描いて位置をずらすだけなので、毎フレーム描き直さず軽い */
  .ocean > .o-surface {
    left: -20%;
    width: 140%;
    height: var(--sh);
    will-change: transform;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - var(--dsc) - 60px), transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - var(--dsc) - 60px), transparent 100%);
  }
  .o-ripple   { animation: drift-a 24s ease-in-out infinite alternate; }
  .o-ripple2  { animation: drift-b 33s ease-in-out infinite alternate; --op: .75; }
  .o-caustic  { animation: drift-c 17s ease-in-out infinite alternate; --op: .38; }
  .o-caustic2 { animation: drift-d 23s ease-in-out infinite alternate; --op: .28; }
  @keyframes drift-a { from { transform: translate3d(-9%, 0, 0) scale(1); }      to { transform: translate3d(9%, -2%, 0) scale(1.06); } }
  @keyframes drift-b { from { transform: translate3d(8%, -1.5%, 0) scale(1.07); } to { transform: translate3d(-8%, 1%, 0) scale(1); } }
  @keyframes drift-c { from { transform: translate3d(-4%, -1%, 0) scale(1.02); }  to { transform: translate3d(4%, 1.5%, 0) scale(1.08); } }
  @keyframes drift-d { from { transform: translate3d(5%, 1%, 0) scale(1.08); }   to { transform: translate3d(-3%, -1%, 0) scale(1.01); } }

  /* 深いところのまだら：水面の模様と入れ替わるように、境目より上から少しずつ現れる */
  .ocean > .o-deep {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--sh) - var(--dsc) + 20px), #000 calc(var(--sh) + 160px));
            mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--sh) - var(--dsc) + 20px), #000 calc(var(--sh) + 160px));
  }
  .ocean > .o-glint {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--sh) + 60px), #000 calc(var(--sh) + 320px), transparent calc(var(--sh) + 1000px));
            mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--sh) + 60px), #000 calc(var(--sh) + 320px), transparent calc(var(--sh) + 1000px));
  }

  /* --- 動き2：光の筋 ---
     水面から斜めに差し込み、潜る余白で一番強く光り、その先も深海へ向かって細く長く伸びて消えていく */
  .rays {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: calc(var(--sh) + 760px);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom,
      rgba(0,0,0,.35) 0,
      #000 calc(var(--sh) - var(--dsc) * .73),
      rgba(0,0,0,.09) calc(var(--sh) + 10px),
      rgba(0,0,0,.1) calc(var(--sh) + 360px),
      transparent 100%);
            mask-image: linear-gradient(to bottom,
      rgba(0,0,0,.35) 0,
      #000 calc(var(--sh) - var(--dsc) * .73),
      rgba(0,0,0,.09) calc(var(--sh) + 10px),
      rgba(0,0,0,.1) calc(var(--sh) + 360px),
      transparent 100%);
  }
  .ray {
    position: absolute;
    top: -8%;
    left: var(--x);
    width: var(--w);
    height: 116%;
    /* 横方向に柔らかくぼかした帯（ぼかしフィルターを使わないので軽い）。縦の濃淡は .rays の mask が担当 */
    background: linear-gradient(to right,
      rgba(255,255,255,0) 0,
      rgba(255,255,255,calc(var(--a) * .55)) 30%,
      rgba(255,255,255,var(--a)) 50%,
      rgba(255,255,255,calc(var(--a) * .55)) 70%,
      rgba(255,255,255,0) 100%);
    transform-origin: 50% 0;
    transform: rotate(var(--r));
    will-change: transform, opacity;
    animation: sway var(--d) ease-in-out var(--delay, 0s) infinite alternate;
  }
  /* 水面が画面外にあるときと、詳細を開いている間は、背景の動きを止めて負荷を下げる */
  html.calm .o-surface,
  html.calm .ray { animation-play-state: paused; }

  @keyframes sway {
    from { transform: rotate(var(--r)) translateX(-24px); opacity: 1; }
    to   { transform: rotate(calc(var(--r) + 2.5deg)) translateX(28px); opacity: .35; }
  }

  /* --- 動き3（外側）：カードの外の水面にも広がる波紋。カードの下をくぐって広がる --- */
  .ocean-waves {
    position: absolute;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .wave {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(242, 248, 250, .42);
    box-shadow: 0 0 18px rgba(127, 214, 236, .18);
    transform: translate(-50%, -50%) scale(.15);
    animation: wave 2.4s cubic-bezier(.15, .6, .3, 1) both;
  }
  .wave.ring { border-color: rgba(242, 248, 250, .24); box-shadow: none; }
  @keyframes wave {
    from { transform: translate(-50%, -50%) scale(.15); opacity: .95; }
    to   { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  img, video { display: block; max-width: 100%; }

  :focus-visible {
    outline: 2px solid var(--shallows);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .wrap {
    max-width: 1520px;
    margin: 0 auto;
    padding: 0 clamp(1.25rem, 5vw, 4.5rem);
  }

  /* ===== ヘッダー ===== */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 1.5rem 0;
  }
  .surface { color: var(--ink); }
  .topbar-name { font-weight: 700; letter-spacing: .04em; line-height: 48px; }
  .topbar a { color: var(--ink); text-decoration: none; font-size: .95rem; }
  .topbar a:hover { text-decoration: underline; text-underline-offset: 4px; }

  .intro { padding: clamp(3rem, 8vw, 6rem) 0 var(--dsc); }
  .depths main { padding-top: 2rem; }
  .intro h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(2.4rem, 6vw, 4.4rem);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .intro p { margin: 0; max-width: 34em; font-size: 1.05rem; line-height: 2; }

  /* ===== タブ ===== */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0 1.75rem;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    appearance: none;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: .6rem 0 .7rem;
    color: var(--mist);
    font: inherit;
    font-size: 1rem;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .tab:hover { color: var(--foam); }
  .tab[aria-pressed="true"] { color: var(--foam); border-bottom-color: var(--shallows); }
  .tab-count { margin-left: .4em; font-size: .8rem; color: inherit; opacity: .75; }

  /* ===== カードグリッド ===== */
  .grid {
    list-style: none;
    margin: 2.75rem 0 0;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 2.5rem 1.75rem;
  }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1440px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 3rem 2rem; } }

  .card-link { display: block; text-decoration: none; }
  .card-thumb {
    position: relative;
    display: block;
    aspect-ratio: 16 / 10;
    border: 1px solid var(--reef);
    border-radius: 6px;
    overflow: hidden;
    background: var(--trench);
    transition: border-color .15s;
  }
  .card-thumb img, .card-thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(.93) saturate(.9); /* 通常時は深海のトーンに少しだけ馴染ませる */
    transition: filter .2s ease;
  }
  .card-name {
    display: block;
    margin-top: 1rem;
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.5;
    transition: color .15s;
  }
  .card-desc { display: block; margin-top: .3rem; color: var(--mist); font-size: .94rem; line-height: 1.75; }
  .card-link:hover .card-thumb, .card-link:focus-visible .card-thumb { border-color: var(--shallows); }
  .card-link:hover .card-thumb :is(img, video),
  .card-link:focus-visible .card-thumb :is(img, video),
  .card-link.is-inview .card-thumb :is(img, video) { filter: none; }
  .card-link:hover .card-name, .card-link:focus-visible .card-name { color: var(--shallows); }
  .card-link:focus-visible { outline-offset: 6px; }

  .is-latin { letter-spacing: .01em; }

  /* 指で操作する端末では、押せるものを指先の大きさ（44px）以上にする */
  @media (pointer: coarse) {
    .tab { min-height: 44px; }
    .btn { min-height: 44px; padding-inline: 1.1rem; }
    .related a { display: inline-block; padding: .35rem 0; }
  }
  /* スマホ：一覧のカード間を少し詰め、明朝の小さな文字は少し大きく */
  @media (max-width: 640px) {
    .grid { gap: 2.25rem; }
    .card-name { font-size: 1.2rem; }
    .card-desc { font-size: .98rem; }
    .tabs { gap: 0 1.4rem; }
    .block p, .points span, .proc ol { font-size: 1rem; }
  }

  /* --- 動き3：サムネイルに触れると、そこを水面に波紋が広がる --- */
  .ripple {
    position: absolute;
    z-index: 1;
    border-radius: 50%;
    border: 1.5px solid rgba(242, 248, 250, .7);
    box-shadow: 0 0 14px rgba(127, 214, 236, .25), inset 0 0 14px rgba(127, 214, 236, .2);
    background: radial-gradient(circle, rgba(127, 214, 236, .2) 0, rgba(127, 214, 236, .06) 45%, transparent 70%);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    animation: ripple 1.3s cubic-bezier(.2, .6, .3, 1) both;
  }
  .ripple.ring { border-width: 1px; border-color: rgba(242, 248, 250, .45); background: none; box-shadow: none; }
  @keyframes ripple {
    from { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    to   { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* ===== バッジ ===== */
  .badges { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }
  .badge {
    font-family: var(--mono);
    font-size: .75rem;
    line-height: 1.6;
    padding: .05rem .55rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: rgba(6, 19, 29, .35);
    color: var(--mist);
  }
  /* ソフトごとの色分け。各ソフトを連想させる色を、海の配色に馴染む明るさに調整 */
  .badge[data-sw] {
    color: var(--sw);
    border-color: color-mix(in srgb, var(--sw) 50%, transparent);
    background: color-mix(in srgb, var(--sw) 12%, rgba(6, 19, 29, .55));
  }
  .badge[data-sw="houdini"] { --sw: #f4a97c; } /* 珊瑚のオレンジ */
  .badge[data-sw="maya"]    { --sw: #6fd8c6; } /* 青緑 */
  .badge[data-sw="python"]  { --sw: #f0d47e; } /* 砂浜の黄 */
  .badge[data-sw="windows"] { --sw: #9cc2ff; } /* 澄んだ青 */

  /* ===== 画像未設定時のプレースホルダー ===== */
  .ph {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    padding: 1rem 1.5rem;
    color: var(--tide);
    font-size: .8rem;
    line-height: 1.7;
    text-align: center;
  }
  .ph.alt { background: #15384f; }
  /* 画像が無いときの、文字だけのサムネイル */
  .ph-name { position: relative; display: grid; place-items: center; width: 100%; height: 100%; padding: 1rem 1.2rem 1.6rem; text-align: center; font-family: var(--font); font-weight: 600; font-size: clamp(1.1rem, 2vw, 1.5rem); line-height: 1.35; color: var(--foam); overflow-wrap: anywhere; }
  .ph-name::after { content: ""; position: absolute; left: 1.2rem; right: 1.2rem; bottom: 1rem; height: 2px; background: var(--sw, var(--reef)); opacity: .85; }
  .ph-name[data-sw="houdini"] { --sw: #f4a97c; } .ph-name[data-sw="maya"] { --sw: #6fd8c6; } .ph-name[data-sw="python"] { --sw: #f0d47e; } .ph-name[data-sw="windows"] { --sw: #9cc2ff; }

  /* ===== プロフィール（ページ下部） ===== */
  .profile {
    margin-top: 6rem;
    padding: 3rem 0 4rem;
    border-top: 1px solid var(--line);
  }
  .profile h2 { margin: 0 0 .75rem; font-size: 1.2rem; }
  .profile p { margin: 0; max-width: 38em; color: var(--mist); }
  .profile small { display: block; margin-top: 2.5rem; color: var(--tide); font-size: .8rem; }

  /* ===== モーダル ===== */
  dialog {
    padding: 0;
    width: min(960px, calc(100% - 2rem));
    max-width: none;
    max-height: calc(100% - 2rem);
    border: 1px solid var(--reef);
    border-radius: 10px;
    background: linear-gradient(180deg, #0e293d 0%, var(--trench) 45%, #081a28 100%) local;
    color: var(--foam);
    overflow: auto;
    overscroll-behavior: contain;
  }
  dialog::backdrop { background: rgba(3, 10, 16, .84); }
  dialog[open] { animation: sheet-in .22s ease-out; }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (max-width: 640px) {
    dialog { width: 100%; height: 100%; max-height: 100%; border: 0; border-radius: 0; }
  }

  .sheet-bar {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    justify-content: flex-end;
    padding: .75rem clamp(1.25rem, 4vw, 2.5rem);
    background: rgba(12, 36, 53, .75);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .btn {
    appearance: none;
    background: none;
    border: 1px solid var(--reef);
    border-radius: 6px;
    padding: .4rem .9rem;
    color: var(--foam);
    font: inherit;
    font-size: .875rem;
    cursor: pointer;
    transition: border-color .15s;
  }
  .btn:hover { border-color: var(--shallows); }

  .sheet { padding: 0 clamp(1.25rem, 4vw, 3rem) clamp(1.5rem, 4vw, 3rem); }

  .hero .badges { margin: 0 0 1rem; }
  .hero h2 {
    margin: 0;
    font-size: clamp(1.9rem, 4.5vw, 2.9rem);
    line-height: 1.3;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  .hero h2:not(.is-latin) { font-weight: 700; font-size: clamp(1.4rem, 3.5vw, 2rem); }
  .hero-alias { margin: .35rem 0 0; color: var(--tide); font-size: .9rem; }
  .hero-summary { margin: 1rem 0 0; max-width: 40em; font-size: 1.05rem; }
  .hero-env { margin: .9rem 0 0; color: var(--tide); font-size: .9rem; }
  .hero-env span { margin-right: .9em; color: var(--mist); }
  .hero-env code { font-family: var(--mono); font-size: .85rem; color: var(--mist); }

  .media {
    aspect-ratio: 16 / 9;
    border: 1px solid var(--reef);
    border-radius: 6px;
    overflow: hidden;
    background: var(--abyss);
  }
  .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
  /* ツールの画面（静止画）は、縦横比がまちまちなので、切り取らずに全体を見せる。高さは画面の高さまで */
  .demo.media:has(> img) { aspect-ratio: auto; }
  .demo.media > img { height: auto; max-height: min(86vh, 920px); object-fit: contain; display: block; }
  .demo { margin: 2rem 0 0; }

  .block { margin-top: 3.75rem; }
  .block h3 { margin: 0 0 1.1rem; font-size: 1.25rem; font-weight: 700; letter-spacing: .03em; color: var(--foam); }
  .block p { margin: 0; max-width: 40em; }

  .pair { display: grid; gap: 2.75rem; margin-top: 3.75rem; }
  .pair .block { margin-top: 0; }
  @media (min-width: 760px) { .pair { grid-template-columns: 1fr 1fr; } }

  /* 比較：パターン1（工程の対比） */
  .proc-grid { display: grid; gap: 1rem; }
  @media (min-width: 640px) { .proc-grid { grid-template-columns: 1fr 1fr; } }
  .proc { border: 1px solid var(--reef); border-radius: 6px; padding: 1.1rem 1.25rem 1.25rem; }
  .proc.after { border-color: rgba(127, 214, 236, .55); }
  .proc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .proc-label { font-weight: 700; }
  .proc-meta { color: var(--tide); font-size: .85rem; white-space: nowrap; }
  .proc.after .proc-meta { color: var(--shallows); }
  .proc ol { margin: .6rem 0 0; padding-left: 1.3em; color: var(--tide); font-size: .925rem; }
  .proc.after ol { color: var(--foam); }

  /* 比較：パターン2（並列GIF） */
  .gif-grid { display: grid; gap: 1rem; }
  @media (min-width: 640px) { .gif-grid { grid-template-columns: 1fr 1fr; } }
  .gif-grid figure { margin: 0; }
  .gif-grid figcaption { margin-top: .5rem; color: var(--tide); font-size: .875rem; }
  .gif-grid figure.after figcaption { color: var(--foam); }

  /* 比較：パターン3（スライダー） */
  .slider { position: relative; --pos: 50%; }
  .slider-layer { position: absolute; inset: 0; }
  .slider-after { clip-path: inset(0 0 0 var(--pos)); }
  .slider-handle {
    position: absolute;
    top: 0; bottom: 0;
    left: var(--pos);
    width: 2px;
    margin-left: -1px;
    background: var(--foam);
    pointer-events: none;
  }
  /* 左右に動かせることが一目でわかるつまみ */
  .slider-handle::after {
    content: "‹ ›";
    position: absolute;
    top: 50%; left: 50%;
    width: 32px; height: 32px;
    margin: -16px 0 0 -16px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--foam);
    color: var(--ink);
    font-family: var(--mono);
    font-size: .85rem;
    font-weight: 500;
    letter-spacing: .1em;
    line-height: 1;
    box-shadow: 0 0 0 4px rgba(6, 19, 29, .35);
  }
  .slider:focus-within .slider-handle,
  .slider:focus-within .slider-handle::after { background: var(--shallows); }
  .slider-tag {
    position: absolute;
    top: .6rem;
    padding: .1rem .5rem;
    border-radius: 4px;
    background: rgba(6, 19, 29, .75);
    font-size: .8rem;
    pointer-events: none;
  }
  .slider-tag.left { left: .6rem; }
  .slider-tag.right { right: .6rem; }
  .slider { touch-action: pan-y; } /* 画像の上で縦に指を動かしたらページがスクロールする */
  /* キーボード操作用の入力欄（見えないが、Tabで選んで矢印キーで動かせる） */
  .slider input {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    margin: 0;
    opacity: 0;
    pointer-events: none;
  }
  /* 指やマウスでつかむ範囲：つまみの線の左右だけ */
  .slider-grip {
    position: absolute;
    top: 0; bottom: 0;
    left: var(--pos);
    width: 56px;
    margin-left: -28px;
    cursor: ew-resize;
    touch-action: none;
  }
  @media (hover: hover) { .slider { cursor: ew-resize; } } /* マウスなら画像のどこを押しても動かせる */

  /* 技術解説 */
  .points { margin: 0; padding-left: 1.2em; max-width: 40em; }
  .points li { margin-bottom: .9rem; }
  .points li::marker { color: var(--shallows); }
  .points strong { display: block; font-weight: 700; }
  .points span { color: var(--mist); font-size: .95rem; }

  pre.code {
    margin: 1.5rem 0 0;
    padding: 1.25rem 1.4rem;
    background: var(--abyss);
    border: 1px solid var(--reef);
    border-radius: 6px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: .84rem;
    line-height: 1.7;
    tab-size: 4;
    color: #c3d7e0;
    font-weight: 400;
  }
  .tk-k { color: var(--shallows); }
  .tk-s { color: var(--shallows-soft); }
  .tk-c { color: #6f95a6; font-style: italic; }
  .tk-n, .tk-d { color: var(--foam); font-weight: 500; }

  /* モーダル下部ナビ */
  .sheet-foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1.5rem;
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--reef);
  }
  .related h4 { margin: 0 0 .4rem; font-size: .875rem; font-weight: 500; color: var(--tide); }
  .related ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .3rem 1.25rem; }
  .related a { text-decoration: none; color: var(--shallows); font-size: .95rem; }
  .related a:hover { text-decoration: underline; text-underline-offset: 3px; }


  /* =========================================================
     2つの見せ方：潜って見る（演出版）／一覧で見る
     ========================================================= */
  .view { position: relative; }

  /* --- 右上のメニュー（どちらの見せ方でも共通） --- */
  .menu {
    position: fixed;
    top: 1rem;
    right: clamp(1rem, 4vw, 3.5rem);
    z-index: 50;
  }
  .menu-btn {
    appearance: none;
    display: grid;
    place-content: center;
    gap: 5px;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 1px solid rgba(242, 248, 250, .28);
    border-radius: 50%;
    background: rgba(6, 19, 29, .42);
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    cursor: pointer;
  }
  .menu-btn span {
    display: block;
    width: 18px;
    height: 1.5px;
    border-radius: 1px;
    background: var(--foam);
    transition: transform .25s ease, opacity .2s ease;
  }
  .menu-btn[aria-expanded="true"] span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .menu-btn[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .menu-btn[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
  .menu-panel {
    position: absolute;
    top: calc(100% + .6rem);
    right: 0;
    min-width: 13rem;
    padding: .5rem;
    border: 1px solid rgba(242, 248, 250, .18);
    border-radius: 10px;
    background: rgba(8, 26, 40, .82);
    -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
    animation: menu-in .2s ease-out;
  }
  @keyframes menu-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .menu-panel a {
    display: block;
    padding: .7rem 1rem;
    border-radius: 6px;
    color: var(--foam);
    text-decoration: none;
    font-size: 1rem;
  }
  .menu-panel a:hover { background: rgba(242, 248, 250, .08); }
  .menu-panel a[aria-current="page"] { color: var(--shallows); }

  /* 演出版では、水面の層は絵の下に隠れるので止めて描かない */
  html.v-dive .ocean > .o-surface { display: none; }
  /* 演出版では、光の筋は絵の下端から深海へ差し込む */
  html.v-dive .rays {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--sh) - 40px), rgba(0,0,0,.55) calc(var(--sh) + 120px), rgba(0,0,0,.18) calc(var(--sh) + 600px), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--sh) - 40px), rgba(0,0,0,.55) calc(var(--sh) + 120px), rgba(0,0,0,.18) calc(var(--sh) + 600px), transparent 100%);
  }

  /* --- 演出版：最初の絵 --- */
  .hero-dive {
    position: relative;
    height: 100vh;
    height: 100svh;
    min-height: 520px;
    overflow: hidden;
    color: var(--ink);                                                /* 写真が無くなり、背景は明るい浅瀬なので、文字は紺 */
  }
  /* 最初の画面の魚（キャンバスに描く）。スクロールで潜ると少し近づく */
  .hero-img {
    position: absolute;
    inset: 0;
    transform-origin: 50% 40%;
    will-change: transform;
  }
  .hero-img canvas { display: block; width: 100%; height: 100%; }
  .hero-inner {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-top: 1.6rem;
    padding-bottom: clamp(4rem, 18vh, 11rem);                       /* 下端の、深みへ変わり始める帯にかからない高さ */
  }
  .hero-name { font-weight: 700; letter-spacing: .04em; line-height: 48px; }
  .hero-title { will-change: transform, opacity; }
  .hero-title h1 {
    margin: 0;
    font-size: clamp(2.8rem, 8vw, 6rem);
    line-height: 1.1;
    font-weight: 600;
  }
  .hero-title p {
    margin: .9rem 0 0;
    font-size: clamp(1rem, 1.6vw, 1.2rem);
  }
  .hero-scroll {
    display: flex;
    align-items: center;
    gap: .8rem;
    margin-top: 2rem;
    font-size: .9rem;
    color: var(--ink);
  }
  .hero-scroll::before {
    content: "";
    width: 1px;
    height: 44px;
    background: linear-gradient(to bottom, transparent, var(--ink));
    animation: scroll-hint 2.4s ease-in-out infinite;
    transform-origin: top;
  }
  /* 和紙の質感：紙の繊維をごく薄く重ねる。下へいくほど消えて、深みとの境目は出さない */
  .hero-washi {
    position: absolute;
    inset: 0;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
  }
  /* 初めて開いたときは、魚が止まってから名前とタイトルが現れる */
  html.intro-on .hero-name, html.intro-on .hero-title > * {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.2s ease, transform 1.4s cubic-bezier(.2, .7, .2, 1);
  }
  html.intro-on .hero-title > p { transition-delay: .15s; }
  html.intro-on .hero-title > .hero-scroll { transition-delay: .45s; }
  html.intro-on.intro-done .hero-name, html.intro-on.intro-done .hero-title > * { opacity: 1; transform: none; }
  @keyframes scroll-hint {
    0%   { transform: scaleY(0); opacity: 0; }
    40%  { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(1) translateY(20px); opacity: 0; }
  }

  /* --- 演出版：潜りながら出会う言葉とツール --- */
  .dive-intro, .dive-list, .dive-end { position: relative; z-index: 1; }
  .dive-intro { padding-top: clamp(6rem, 18vh, 11rem); padding-bottom: clamp(4rem, 12vh, 8rem); }
  .dive-lines { margin: 0; font-size: clamp(1.45rem, 3vw, 2.2rem); line-height: 2.1; font-weight: 600; }
  .dive-lines span { display: block; }
  .dive-sub { margin: 2.2rem 0 0; color: var(--mist); max-width: 34em; }
  .dive-sub a { color: var(--shallows); }

  .dive-list > .dive-zone:first-child { margin-top: clamp(7rem, 20vh, 12rem); }
  .dive-zone {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin: clamp(5rem, 14vh, 9rem) 0 clamp(2.5rem, 6vh, 4rem);
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--line);
  }
  .dive-zone .zone-name { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 600; line-height: 1.2; }
  .dive-zone .zone-count { color: var(--tide); }

  .dive-item {
    display: grid;
    gap: 1.6rem;
    align-items: center;
    margin-bottom: clamp(5rem, 16vh, 10rem);
  }
  @media (min-width: 860px) {
    .dive-item { grid-template-columns: 1.3fr 1fr; gap: clamp(2.5rem, 5vw, 5rem); }
    .dive-item.flip .dive-media { order: 2; }
  }
  .dive-media .card-thumb { aspect-ratio: 16 / 10; }
  .dive-text h3 { margin: .9rem 0 0; font-size: clamp(1.8rem, 3.4vw, 2.6rem); line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
  .dive-text h3:not(.is-latin) { font-size: clamp(1.4rem, 2.6vw, 1.9rem); }
  .dive-text p { margin: 1rem 0 0; color: var(--mist); max-width: 28em; font-size: 1.05rem; }
  .dive-text .btn { display: inline-block; margin-top: 1.6rem; text-decoration: none; }

  .dive-end { padding: clamp(4rem, 12vh, 8rem) 0 2rem; text-align: center; }
  .dive-end p { margin: 0 0 1.8rem; font-size: clamp(1.2rem, 2.4vw, 1.6rem); }
  .btn-big { display: inline-block; padding: .9rem 1.8rem; font-size: 1.05rem; text-decoration: none; border-color: rgba(127, 214, 236, .55); }

  /* 視界の奥から、ぼやけた状態でふわっと現れる */
  .reveal {
    opacity: 0;
    filter: blur(14px);
    transform: translateY(48px) scale(.95);
    transition: opacity 1.4s ease, filter 1.4s ease, transform 1.6s cubic-bezier(.2, .7, .2, 1);
  }
  .reveal.is-in { opacity: 1; filter: none; transform: none; }
  .dive-text.reveal, .dive-tool-head.reveal { transition-delay: .18s; }
  .dive-lines .reveal:nth-child(2) { transition-delay: .25s; }
  .dive-lines .reveal:nth-child(3) { transition-delay: .5s; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; filter: none; transform: none; }
  }

  /* --- 演出版：立ちのぼる泡 --- */
  .bubbles {
    position: absolute;
    top: 100svh;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bubble {
    position: absolute;
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%,
      rgba(255, 255, 255, .42) 0,
      rgba(255, 255, 255, .09) 18%,
      rgba(127, 214, 236, .05) 48%,
      rgba(242, 248, 250, .2) 68%,
      transparent 71%);
    animation: bubble-rise var(--d) linear var(--delay) infinite;
    animation-play-state: paused;
  }
  .bubble-group { position: absolute; left: 0; right: 0; }
  .bubble-group[data-run="1"] .bubble { animation-play-state: running; will-change: transform, opacity; }   /* 画面の近くのまとまりだけ動かす */
  html.lock .bubble-group[data-run="1"] .bubble { animation-play-state: paused; }
  @keyframes bubble-rise {
    0%   { transform: translate3d(0, 80px, 0); opacity: 0; }
    15%  { opacity: var(--o); }
    50%  { transform: translate3d(var(--w), -90px, 0); }
    85%  { opacity: var(--o); }
    100% { transform: translate3d(0, -260px, 0); opacity: 0; }
  }
  html.lock .bubble { animation-play-state: paused; }

  .shared-foot .profile { margin-top: 2rem; }


  /* =========================================================
     仕組みデモ
     ========================================================= */
  .sim-note { margin: 0 0 1rem; color: var(--tide); font-size: .9rem; }
  .sim-stage { position: relative; border: 1px solid var(--reef); border-radius: 6px; overflow: hidden; background: var(--abyss); }
  .sim-stage[data-kind="canvas"] { aspect-ratio: 16 / 10; }
  .sim-stage canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }
  .sim-stage canvas:focus-visible { outline: 2px solid var(--shallows); outline-offset: -2px; }
  .dive-sim-stage-wrap[data-play="1"] { cursor: default; }
  @media (max-width: 640px) { .sim-stage[data-kind="canvas"] { aspect-ratio: 4 / 5; } }
  .sim-hint { margin: .7rem 0 0; color: var(--tide); font-size: .9rem; }
  .sim-steps, .sim-steps-row { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0 0; padding: 0; list-style: none; }
  .sim-step { text-align: left; }
  .sim-step[aria-current="step"] { border-color: var(--shallows); }
  .sim-step[data-done="true"] { color: var(--mist); }
  .sim-step:disabled { opacity: .5; cursor: default; }
  .sim-step:disabled:hover { border-color: var(--reef); }
  .sim-status { min-height: 3.6em; margin: .9rem 0 0; color: var(--mist); max-width: 40em; line-height: 1.8; }
  .sim-controls { display: grid; gap: .9rem 1.6rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); margin-top: 1.2rem; }
  .sim-ctl { display: grid; grid-template-columns: 1fr auto; gap: .2rem .8rem; color: var(--mist); font-size: .95rem; }
  .sim-ctl input { grid-column: 1 / -1; width: 100%; accent-color: var(--shallows); }
  .sim-ctl output { font-family: var(--mono); font-size: .85rem; color: var(--tide); }
  .sim-ctl-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .8rem 1.2rem; align-items: center; }
  .sim-toggle { display: inline-flex; gap: .5rem; align-items: center; color: var(--mist); font-size: .95rem; cursor: pointer; }
  .sim-toggle input { accent-color: var(--shallows); width: 1.1rem; height: 1.1rem; }

  /* --- 潜って見る：舞台が留まる --- */
  .dive-sim { position: relative; height: var(--track, 260svh); margin-bottom: clamp(2rem, 8vh, 5rem); }
  @media (max-width: 640px) { .dive-sim { --track: 240svh; } }
  .dive-sim-pin {
    position: sticky; top: 0;
    height: 100svh; min-height: 520px;
    padding-top: 5rem;                         /* 右上の固定メニューと重ならないように */
    display: flex; align-items: center;
  }
  .dive-sim-inner { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.1rem 3rem; align-items: center; will-change: transform, opacity; }
  .dive-sim-head h3 { margin: .9rem 0 0; font-size: clamp(1.7rem, 3.4vw, 2.6rem); line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
  .dive-sim-summary { margin: 1rem 0 0; color: var(--mist); max-width: 28em; font-size: 1.05rem; }
  .dive-sim-ctl .sim-steps { margin-top: 1.4rem; flex-direction: column; align-items: flex-start; }
  .dive-sim-ctl .sim-status { min-height: 5.4em; }
  .dive-sim-ctl .sim-note { margin: .8rem 0 0; font-size: .82rem; }
  .dive-sim-actions { display: flex; gap: .7rem; flex-wrap: wrap; margin-top: 1rem; }
  .dive-sim-actions .btn { text-decoration: none; display: inline-block; }
  .dive-sim-stage-wrap[data-kind="canvas"] { width: min(100%, calc((100svh - 9rem) * 1.6)); justify-self: center; }
  .dive-sim-stage-wrap[data-kind="dom"] .sim-stage { max-height: calc(100svh - 9rem); overflow: hidden; }
  @media (min-width: 860px) {
    .dive-sim-inner { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); grid-template-areas: "head stage" "ctl stage"; align-content: center; }
    .dive-sim-head { grid-area: head; align-self: end; }
    .dive-sim-stage-wrap { grid-area: stage; }
    .dive-sim-ctl { grid-area: ctl; align-self: start; }
  }
  @media (max-width: 859px) {
    .dive-sim-ctl .sim-steps { flex-direction: row; margin-top: .3rem; }
  }
  @media (max-width: 640px) {
    .dive-sim-pin { padding-top: 4.3rem; }
    .dive-sim-inner { gap: .7rem; }
    .dive-sim-summary { display: none; }
    .dive-sim-head h3 { margin-top: .5rem; font-size: 1.5rem; }
    .dive-sim-stage-wrap[data-kind="canvas"] { width: min(100%, calc(44svh * .8)); }
    .dive-sim-stage-wrap[data-play="1"][data-kind="canvas"] { width: min(100%, calc(56svh * .8)); }
    .dive-sim-stage-wrap[data-kind="dom"] .sim-stage { max-height: 46svh; }
    .dive-sim-ctl .sim-status { min-height: 4em; margin-top: .5rem; font-size: .92rem; line-height: 1.7; }
    .dive-sim-ctl .sim-step { padding: .3rem .5rem; font-size: .8rem; }
    .dive-sim-ctl .sim-steps { gap: .4rem; }
    .dive-sim-ctl .sim-note { font-size: .74rem; margin-top: .4rem; }
    .dive-sim-actions { margin-top: .5rem; }
  }
  .dive-sim-inline { margin: 0; }
  .dive-tool { display: grid; gap: 1.4rem 3rem; align-items: start; margin-bottom: clamp(4rem, 12vh, 8rem); }
  @media (min-width: 960px) {
    .dive-tool { grid-template-columns: minmax(0, 1fr) minmax(0, 1.9fr); }
    /* ツールの名前と説明は、追従させず、置かれた位置のまま（スクロールに合わせて動かさない） */
  }
  .dive-tool-head h3 { margin: .9rem 0 0; font-size: clamp(1.7rem, 3.4vw, 2.6rem); line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
  .dive-tool-head p { margin: 1rem 0 0; color: var(--mist); max-width: 28em; font-size: 1.05rem; }
  .dive-tool-head .btn { margin-top: 1.4rem; display: inline-block; text-decoration: none; }
  .dive-tool .block.sim { margin-top: 0; }

  /* --- path_manager の表 --- */
  .pm { padding: .8rem 1rem 1rem; font-size: .88rem; line-height: 1.45; color: var(--foam); }
  .pm-top { display: flex; gap: .6rem; align-items: baseline; margin-bottom: .6rem; color: var(--mist); }
  .pm-top code, .pm-file, .pm-node, .pm-place, .pm-target, .pm-m, .pm-sub { font-family: var(--mono); font-size: .7rem; }
  .pm-skip { margin-left: auto; color: var(--tide); font-size: .8rem; }
  .pm-head, .pm-row { display: grid; grid-template-columns: 5.6em minmax(0, 1.25fr) minmax(0, 1.45fr) minmax(0, 1.25fr) minmax(0, 2fr); gap: .25rem .6rem; align-items: center; }
  .pm-head { padding: .3rem .5rem; color: var(--tide); border-bottom: 1px solid var(--line); font-size: .8rem; }
  .pm-row { padding: .45rem .5rem; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; transition: background .25s; }
  .pm-row.is-sel { background: rgba(127, 214, 236, .08); }
  .pm-row[data-st="ok"] .pm-st { color: #7fbf7f; }
  .pm-row[data-st="cand"] .pm-st { color: #e0b050; }
  .pm-row[data-st="miss"] .pm-st { color: #ee8080; }
  .pm-sub, .pm-m { display: none; color: var(--tide); }

const $ = (sel, root = document) => root.querySelector(sel);

function esc(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

const isLatin = (s) => /^[\x00-\x7F]+$/.test(s);

/* バッジ：名前を小文字にしたものが CSS の data-sw になり、色が決まる */
function badgesHTML(list) {
  return list.map((b) => `<span class="badge" data-sw="${esc(b.toLowerCase())}">${esc(b)}</span>`).join("");
}

/* 画像や動画が無いところに、空きを知らせる文字を出すか。見る人には出さない。作者が確かめたいときだけ true にする */
const SHOW_PLACEHOLDERS = false;
function media(src, placeholder, alt = "", altTone = false) {
  if (!src) return SHOW_PLACEHOLDERS ? `<div class="ph${altTone ? " alt" : ""}"><span>${esc(placeholder)}</span></div>` : "";
  if (/\.(mp4|webm|mov)$/i.test(src)) {
    return `<video src="${esc(src)}" autoplay muted loop playsinline aria-label="${esc(alt)}"></video>`;
  }
  return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`;
}

/* Python用の簡易シンタックスハイライト */
function highlightPython(src) {
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|[rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*')|\b(def|class|return|for|in|if|elif|else|import|from|as|with|try|except|finally|raise|not|and|or|is|None|True|False|while|lambda|yield|pass|break|continue|global)\b|(@\w+)|\b(\d+(?:\.\d+)?)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : m[4] ? "d" : "n";
    out += `<span class="tk-${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function cardThumb(t) {

const POSTER_SIMS = new Set(["ivy", "colormura", "bridge", "seeyou", "timeto"]);
const POSTERS = {};
async function makePoster(t) {                                          // 仕組みデモを、完成した状態（p = 1）で 1 回だけ描いて、画像にする
  const W = 640, H = 400, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d"), def = SIM_DEFS[t.sim]();
  const api = { manual: false, C: simColors(), size: { w: W, h: H, dpr: 1 }, now: () => 0, mobile: () => false, setStatus() {}, frame() {}, playOverride() {}, goToP() {}, isHold: () => true, redraw() {} };
  try {
    def.prepare(api);
    if (def.ready) await def.ready;                                      // 区切りながら作る計算が、終わるのを待つ
    g.fillStyle = api.C.abyss; g.fillRect(0, 0, W, H);
    def.draw(g, W, H, 1, 0, api);
    let url = c.toDataURL("image/webp", 0.86); if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/png");
    return url;
  } catch (e) { return ""; } finally { def.destroy && def.destroy(); }
}
let posterIO = null;
function watchPosters() {                                                // カードが画面に近づいたときに、1 枚ずつ小分けに作る

  const load = (img) => {

    POSTERS[id].then((url) => { if (url) img.src = url; });
  };
  if (!posterIO && "IntersectionObserver" in window) posterIO = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { posterIO.unobserve(e.target); load(e.target); } }), { rootMargin: "300px" });
  imgs.forEach((img) => { img.dataset.w = "1"; if (posterIO) posterIO.observe(img); else load(img); });
}

/* --- 動き4：絞り込み時、残るカードは今の位置から新しい位置へ滑り、現れるカードは浮かび上がる --- */
function applyFilter(animate = false) {
  const items = [...document.querySelectorAll("#grid > li")];
  const canAnimate = animate && !REDUCED.matches && typeof Element.prototype.animate === "function";
  const grid = $("#grid");
  const before = new Map();
  const fromHeight = grid.offsetHeight;
  if (canAnimate) items.forEach((li) => { if (!li.hidden) before.set(li, li.getBoundingClientRect()); });

  items.forEach((li) => {
    li.hidden = !(currentCat === "all" || li.dataset.cat === currentCat);
  });
  document.querySelectorAll(".tab").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.cat === currentCat));
  });

  if (!canAnimate) return;
  const ease = "cubic-bezier(.2, .7, .2, 1)";
  // 一覧の高さも同じ速さで伸び縮みさせ、下のプロフィール欄がカードに重ならないようにする
  const toHeight = grid.offsetHeight;
  if (fromHeight !== toHeight) {
    grid.animate([{ height: `${fromHeight}px` }, { height: `${toHeight}px` }], { duration: 460, easing: ease });
  }
  items.forEach((li) => {
    if (li.hidden) return;
    const from = before.get(li);
    const to = li.getBoundingClientRect();
    if (from) {
      const dx = from.left - to.left, dy = from.top - to.top;
      if (dx || dy) {
        li.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
                   { duration: 460, easing: ease });
      }
    } else {
      li.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }],
                 { duration: 420, easing: "ease-out" });
    }
  });
}

$("#tabs").addEventListener("click", (e) => {

});

/* =========================================================
   背景の模様：つなぎ目なく並べられるノイズ画像を、起動時に一度だけ作る
   ========================================================= */
function makeRandom(seed) {
  let t = seed >>> 0;
  return () => {
    t += 0x6D2B79F5;
    let x = Math.imul(t ^ (t >>> 15), 1 | t);
    x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
/* 重い計算を、6ms ずつに区切って、ほかの操作の合間に進める（読み込み直後のスクロールを引っかからせない） */
const nextSlot = (fn) => (window.requestIdleCallback ? requestIdleCallback(fn, { timeout: 300 }) : setTimeout(fn, 16));
function runSliced(gen) {
  return new Promise((resolve) => {
    const step = () => {
      const until = performance.now() + 6; let r;
      do { r = gen.next(); } while (!r.done && performance.now() < until);
      if (r.done) resolve(r.value); else nextSlot(step);
    };
    nextSlot(step);
  });
}
// 端どうしがつながるバリューノイズ（cells は1辺のマス数。オクターブごとに倍になる）。1 行ごとに yield して、区切れるようにしてある
function* tileNoiseGen(size, cells, octaves, seed) {
  const out = new Float32Array(size * size);
  const rand = makeRandom(seed);
  let amp = 1, total = 0;
  for (let o = 0; o < octaves; o++) {
    const n = cells << o;
    const grid = new Float32Array(n * n).map(() => rand());
    const step = n / size;
    for (let y = 0; y < size; y++) {
      const gy = y * step, y0 = Math.floor(gy), fy = gy - y0;
      const sy = fy * fy * (3 - 2 * fy);
      const r0 = (y0 % n) * n, r1 = ((y0 + 1) % n) * n;
      for (let x = 0; x < size; x++) {
        const gx = x * step, x0 = Math.floor(gx), fx = gx - x0;
        const sx = fx * fx * (3 - 2 * fx);
        const c0 = x0 % n, c1 = (x0 + 1) % n;
        const top = grid[r0 + c0] + (grid[r0 + c1] - grid[r0 + c0]) * sx;
        const bot = grid[r1 + c0] + (grid[r1 + c1] - grid[r1 + c0]) * sx;
        out[y * size + x] += (top + (bot - top) * sy) * amp;
      }
      yield;
    }
    total += amp;
    amp *= 0.5;
  }
  for (let i = 0; i < out.length; i++) out[i] /= total;
  return out;
}
// ノイズの値を、色と透明度に置き換えて画像にする（これも 1 行ごとに区切る）
function* noiseToURLGen(size, values, [r, g, b], lo, hi, maxA, shape = (v) => v) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = y * size + x, v = shape(values[i]);
      const a = Math.min(1, Math.max(0, (v - lo) / (hi - lo)));
      img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b;
      img.data[i * 4 + 3] = a * a * (3 - 2 * a) * maxA * 255;
    }
    yield;
  }
  ctx.putImageData(img, 0, 0);
  // 公開ページでは blob: の画像が許可されない場合があるため、data: URL で返す
  return canvas.toDataURL("image/png");
}
const ridge = (v) => 1 - Math.abs(v * 2 - 1); // 値が真ん中付近のところだけ細い線になる（光の網）

const mkTex = (size, cells, oct, seed, rgb, lo, hi, maxA, shape) => () => runSliced((function* () { const v = yield* tileNoiseGen(size, cells, oct, seed); return yield* noiseToURLGen(size, v, rgb, lo, hi, maxA, shape); })());
const TEXTURES = {
  ripple:   { make: mkTex(256, 4, 4, 23, [255, 255, 255], .55, .82, .85), size: [1300, 820] },
  ripple2:  { make: mkTex(256, 5, 3, 57, [255, 255, 255], .6, .86, .8),  size: [1000, 640] },
  caustic:  { make: mkTex(256, 6, 2, 5,  [255, 255, 255], .9, .995, .8, ridge), size: [900, 600] },     // 元は 384px。拡大して敷くので、256px で見た目はほぼ変わらない
  caustic2: { make: mkTex(256, 8, 2, 19, [255, 255, 255], .92, .995, .7, ridge), size: [700, 470] },
  deep:     { make: mkTex(256, 4, 4, 7,  [5, 18, 46], .46, .78, .85), size: [1500, 980] },
  glint:    { make: mkTex(256, 4, 4, 31, [77, 158, 224], .58, .9, .32), size: [1300, 880] },
  grain:    { make: () => runSliced((function* () { const v = new Float32Array(128 * 128).map(makeRandom(3)); return yield* noiseToURLGen(128, v, [255, 255, 255], 0, 1, .035); })()), size: [128, 128] },
};

let oceanBusy = false, oceanAgain = false;
function paintOcean() {
  // 1 枚ずつ順に作る。「潜って見る」では見えない水面の 4 枚は、「一覧で見る」に切り替えたときに作る
  if (oceanBusy) { oceanAgain = true; return; }
  const layers = [...document.querySelectorAll(".ocean [data-tex]")].filter((l) => !l.dataset.built && !(l.classList.contains("o-surface") && currentView === "dive"));
  let i = 0; oceanBusy = true;
  const next = () => {
    const layer = layers[i++];
    if (!layer) { oceanBusy = false; if (oceanAgain) { oceanAgain = false; paintOcean(); } return; }
    const tex = TEXTURES[layer.dataset.tex];
    if (!tex) { next(); return; }
    layer.dataset.built = "1";
    tex.make().then((url) => {
      layer.style.backgroundImage = `url("${url}")`;
      const [w, h] = tex.size;
      layer.style.backgroundSize = `calc(${w}px * var(--ts)) calc(${h}px * var(--ts))`;
      requestAnimationFrame(() => layer.classList.add("ready"));
      next();
    });
  };
  next();
}

/* 水面エリアの実際の高さを背景に伝える（画面幅で文字の折り返しが変わっても境目がずれない） */
let currentView = "dive";
const surfaceOf = () => (currentView === "dive" ? $("#hero") : $("#surface"));

  document.documentElement.style.setProperty("--sh", `${surfaceOf().offsetHeight}px`);
}
if ("ResizeObserver" in window) {

/* カードの外の水面に広がる大きな波紋 */
function spawnWaves(thumb, pageX, pageY) {
  const box = thumb.getBoundingClientRect();
  const size = Math.max(900, box.width * 3.2);
  const layer = $("#waves");
  [[0, ""], [260, " ring"], [560, " ring"]].forEach(([delay, cls]) => {
    const el = document.createElement("span");
    el.className = "wave" + cls;
    el.style.cssText = `left:${pageX}px; top:${pageY}px; width:${size}px; height:${size}px; animation-delay:${delay}ms;`;
    el.addEventListener("animationend", () => el.remove(), { once: true });
    layer.appendChild(el);
  });
}

/* サムネイルに触れた位置から波紋を広げる（マウスは入ったとき、タッチ・クリックは押したとき）
   サムネイルの中の波紋と、カードの外へ広がる波紋を同時に出す */
function spawnRipple(thumb, clientX, clientY) {
  if (REDUCED.matches) return;
  spawnWaves(thumb, clientX + scrollX, clientY + scrollY);
  const box = thumb.getBoundingClientRect();
  const x = clientX - box.left, y = clientY - box.top;
  const size = Math.hypot(Math.max(x, box.width - x), Math.max(y, box.height - y)) * 2.2;
  [[0, ""], [180, " ring"], [380, " ring"]].forEach(([delay, cls]) => {
    const el = document.createElement("span");
    el.className = "ripple" + cls;
    el.style.cssText = `left:${x}px; top:${y}px; width:${size}px; height:${size}px; animation-delay:${delay}ms;`;
    el.addEventListener("animationend", () => el.remove(), { once: true });
    thumb.appendChild(el);
  });
}
const lastRipple = new WeakMap();
document.addEventListener("pointerover", (e) => {
  const thumb = e.target.closest(".card-thumb");
  if (!thumb || e.pointerType !== "mouse" || thumb.contains(e.relatedTarget)) return;
  const now = performance.now();
  if (now - (lastRipple.get(thumb) || 0) < 500) return; // 出入りを繰り返しても波紋が溢れないように
  lastRipple.set(thumb, now);
  spawnRipple(thumb, e.clientX, e.clientY);
});
let lastPointerType = "mouse";
document.addEventListener("pointerdown", (e) => {
  lastPointerType = e.pointerType;
  const thumb = e.target.closest(".card-thumb");
  if (thumb) spawnRipple(thumb, e.clientX, e.clientY);
});
/* 指でタップしたときは、波紋が広がり始めるのを0.3秒だけ見せてから詳細を開く。
   予約は 1 つだけ持つ。もう一度タップしたら、すぐに開く。スクロールしたり、ほかの場所を押したりしたら、取り消す */
let pendingOpen = null;
function cancelPendingOpen() { if (pendingOpen) { clearTimeout(pendingOpen.timer); pendingOpen = null; } }
function scheduleOpen(id) {
  cancelPendingOpen();
  pendingOpen = { id, sy: scrollY, timer: setTimeout(() => { const p = pendingOpen; pendingOpen = null; if (p && !dialog.open) goToTool(p.id); }, 300) };
}
window.addEventListener("scroll", () => { if (pendingOpen && Math.abs(scrollY - pendingOpen.sy) > 10) cancelPendingOpen(); }, { passive: true });
document.addEventListener("pointerdown", (e) => { if (pendingOpen && !(e.target.closest && e.target.closest(`.card-link[href="#${pendingOpen.id}"]`))) cancelPendingOpen(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cancelPendingOpen(); });

/* ホバーでGIFプレビューに切り替え */
function swapGif(e, play) {
  const link = e.target.closest?.(".card-link");
  if (!link) return;
  const img = link.querySelector("img[data-gif]");
  if (img) img.src = play ? img.dataset.gif : img.dataset.still;
}
document.addEventListener("mouseover", (e) => swapGif(e, true));
document.addEventListener("mouseout",  (e) => {
  if (!e.relatedTarget || !e.target.closest(".card-link")?.contains(e.relatedTarget)) swapGif(e, false);
});
document.addEventListener("focusin",  (e) => swapGif(e, true));
document.addEventListener("focusout", (e) => swapGif(e, false));

/* タッチ端末ではホバーできないため、画面に大きく映っているカードを本来の色に戻し、GIFがあれば再生する */
function watchCardsOnTouch() {
  if (!matchMedia("(hover: none)").matches || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver((entries) => {
    entries.forEach(({ target, isIntersecting }) => {
      target.classList.toggle("is-inview", isIntersecting);
      const img = target.querySelector("img[data-gif]");
      if (img) img.src = isIntersecting ? img.dataset.gif : img.dataset.still;
    });
  }, { threshold: 0.65 });
  document.querySelectorAll(".card-link").forEach((link) => io.observe(link));
}

/* =========================================================
   詳細モーダル
   ========================================================= */
const dialog = $("#detail");

function renderCompare(c, t) {
  if (!c) return "";
  if ((c.type === "gif" || c.type === "slider") && !c.before.src && !c.after.src && !SHOW_PLACEHOLDERS) return "";   // 画像が両方とも無いときは、節ごと出さない
  let body = "";

  if (c.type === "process") {
    const col = (side, cls) => `
      <div class="proc ${cls}">
        <div class="proc-head">
          <span class="proc-label">${esc(side.label)}</span>
          <span class="proc-meta">${esc(side.time || `${side.steps.length}工程`)}</span>
        </div>
        <ol>${side.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>
      </div>`;
    body = `<div class="proc-grid">${col(c.before, "before")}${col(c.after, "after")}</div>`;
  }

  if (c.type === "gif") {
    const fig = (side, cls) => `
      <figure class="${cls}">
        <div class="media">${media(side.src, `${side.label}（GIF）`, side.label, cls === "after")}</div>
        <figcaption>${esc(side.label)}</figcaption>
      </figure>`;

/* 比較スライダー：指はつまみの周りだけ、マウスは画像のどこでもつかめる。キーボードは矢印キー */
function setupSlider(s) {
  const input = s.querySelector("input");
  const grip = s.querySelector(".slider-grip");
  const setPos = (v) => {
    const pos = Math.min(100, Math.max(0, v));
    s.style.setProperty("--pos", `${pos}%`);
    input.value = pos;
  };
  input.addEventListener("input", () => setPos(Number(input.value)));

  const fromPointer = (e) => {
    const box = s.getBoundingClientRect();
    setPos(((e.clientX - box.left) / box.width) * 100);
  };
  const start = (e) => {
    e.preventDefault();
    s.setPointerCapture(e.pointerId);
    fromPointer(e);
    const move = (ev) => fromPointer(ev);
    const end = () => {
      s.removeEventListener("pointermove", move);
      s.removeEventListener("pointerup", end);
      s.removeEventListener("pointercancel", end);
    };
    s.addEventListener("pointermove", move);
    s.addEventListener("pointerup", end);
    s.addEventListener("pointercancel", end);
  };
  grip.addEventListener("pointerdown", start);
  s.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.target !== grip) start(e);
  });
}

/* 背景の動きを止めるかどうか（水面が見えていない、または詳細を開いている） */
const surfaceSeen = { hero: true, surface: true };

  const seen = surfaceSeen[surfaceOf().id];

}
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { surfaceSeen[e.target.id] = e.isIntersecting; });
    updateCalm();

}

function openTool(id) {

function replaceHash(name) {
  try {
    history.replaceState(null, "", `${location.href.split("#")[0]}#${name}`);
  } catch {

}

/* URL末尾の #ツールID を消す。
   Claudeアプリのプレビューのような埋め込み環境（about:srcdoc）では履歴の書き換えが禁止されているので、
   失敗したら # だけを空にする方法に切り替える */
function clearHash() {
  try {
    history.replaceState(null, "", location.href.split("#")[0]);
  } catch {
    location.hash = "";
  }
}

let downOutside = false;
const outsideDialog = (e) => { const r = dialog.getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; };
dialog.addEventListener("pointerdown", (e) => { downOutside = e.target === dialog && outsideDialog(e); });   // スクロールバーや、スライダーのドラッグの終わりでは閉じない
dialog.addEventListener("click", (e) => {
  if (e.target.closest("[data-close]")) { closeTool(); return; }
  if (downOutside && e.target === dialog && outsideDialog(e)) closeTool();
  downOutside = false;
});

/* URLの #ツールID で詳細を開く（リンク共有・ブラウザの戻る操作に対応） */
function syncFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === "list" || id === "dive") { closeTool(); showView(id); return; }
  if (openTool(id)) return;
  closeTool();
  if (!id) showView("dive");
}
window.addEventListener("hashchange", syncFromHash);

/* ページ内リンク（#〜）は自前で処理する。
   Claudeアプリのプレビューのような埋め込み環境では、普通の #リンク がページ自体を読み込み直してしまうため */
document.addEventListener("click", (e) => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const link = e.target.closest('a[href^="#"]');
  if (!link) return;
  e.preventDefault();
  const id = decodeURIComponent(link.getAttribute("href").slice(1));
  closeMenu();
  if (TOOLS.some((t) => t.id === id)) {
    const touch = (e.pointerType || lastPointerType) !== "mouse";
    if (link.classList.contains("card-link") && e.detail !== 0 && touch && !REDUCED.matches && !(pendingOpen && pendingOpen.id === id)) scheduleOpen(id);   // キーボードとマウスは待たせない
    else { cancelPendingOpen(); goToTool(id); }
  } else if (id === "list" || id === "dive") {
    goToView(id);
  } else {
    if (dialog.open) closeTool();
    document.getElementById(id)?.scrollIntoView({ behavior: REDUCED.matches ? "auto" : "smooth" });
  }
});
function goToView(name) {
  try { location.hash = name; } catch { /* URLを変えられない環境 */ }
  if (location.hash !== `#${name}`) showView(name);
}
function goToTool(id) {
  try { location.hash = id; } catch { /* URLを変えられない環境 */ }
  if (location.hash !== `#${id}`) openTool(id); // ハッシュが変えられなかったときは直接開く
}

function showView(name) {
  if (name !== "dive" && name !== "list") name = "dive";
  cancelPendingOpen();
  const changed = name !== currentView;
  currentView = name;
  $("#view-dive").hidden = name !== "dive";

    if (a.dataset.viewLink === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");

  syncSurfaceHeight();

}

/* --- 演出版：画面に入ったものから、奥からふわっと現れる --- */
function watchReveals() {
  const items = [...document.querySelectorAll(".reveal:not([data-w])")];
  items.forEach((el) => { el.dataset.w = "1"; });
  if (REDUCED.matches || !("IntersectionObserver" in window)) {
    items.forEach((el) => el.classList.add("is-in"));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
    });
  }, { threshold: 0.2, rootMargin: "0px 0px -8% 0px" });
  items.forEach((el) => io.observe(el));
}

/* --- 演出版：最初の画面に潜っていく（スクロールに合わせて魚が近づき、タイトルが遠ざかる） --- */
let heroTicking = false;
function updateHero() {
  heroTicking = false;
  if (currentView !== "dive" || REDUCED.matches) return;
  const h = $("#hero").offsetHeight;
  const p = Math.min(1, Math.max(0, scrollY / h));
  $("#hero-img").style.transform = `scale(${1 + p * 0.14})`;
  $("#hero-title").style.transform = `translateY(${(-p * 70).toFixed(1)}px)`;
  $("#hero-title").style.opacity = Math.max(0, 1 - p * 1.4).toFixed(3);
}
window.addEventListener("scroll", () => {
  if (!heroTicking && currentView === "dive" && scrollY < innerHeight * 1.2) {
    heroTicking = true;
    requestAnimationFrame(updateHero);
  }
}, { passive: true });

/* --- 演出版：最初の画面の魚 ---
   真上から見た 2 匹（白と紺）が左右から泳いできて、互いを追うように輪を描いて舞い、減速しながら近づいて、鼻先を向け合って止まる。
   ・2 匹の道すじは、出会う点 M を中心に点対称（片方を 180° 回すと、もう片方）。止まった姿が巴の形になる
   ・体は「頭が通った道すじ」に沿って並べるだけ。曲がるときの体のしなりは、それで自然に出る
   ・すべて開始からの時間で決めるので、フレームの間隔に左右されない
   ・同じタブで 2 回目以降に開いたとき、動きを減らす設定のときは、止まった姿から始める
   背景は水墨画の池：右下から立ちのぼる水草、右上の浮き葉、ときどき広がる筆の波紋。
   色は増やさず、サイトの紺を薄く重ねた「淡墨」の濃淡だけで描く。中央とタイトルのまわりは余白として空ける */
function heroFish() {
  const cv = $("#hero-fish");
  if (!cv) return;
  const g = cv.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const cssv = (n, fb) => css.getPropertyValue(n).trim() || fb;
  const WHITE = cssv("--foam", "#f2f8fa"), NAVY = cssv("--trench", "#0c2435");
  const T = 7.0;                                   // 止まるまでの秒数
  const SETTLE = T - 0.6;                          // タイトルを出し始める時刻
  const html = document.documentElement;
  let seen = false;
  try { seen = sessionStorage.getItem("intro-seen") === "1"; } catch (e) {}
  const still = seen || REDUCED.matches;
  const t0 = performance.now() - (still ? (T + 6) * 1000 : 0);
  const showTitle = () => {
    if (html.classList.contains("intro-done")) return;
    html.classList.add("intro-done");
    try { sessionStorage.setItem("intro-seen", "1"); } catch (e) {}
  };
  if (still) showTitle();
  // 泳いでいる途中で触れたりスクロールしたら、タイトルはすぐに出す（魚はそのまま泳ぐ）
  ["scroll", "pointerdown", "keydown"].forEach((ev) => addEventListener(ev, showTitle, { once: true, passive: true }));

  // 白い魚の道すじ（M からの相対位置、S 単位、y は下向き）。紺の魚は、これを M のまわりに 180° 回したもの
  // 止まる位置は、真正面から向き合わず、少しだけ上下にずらす（鼻先が一直線上で合わない）
  const A_REL = [[-0.95, 0.42], [-0.40, -0.30], [0.30, -0.50], [0.72, -0.02], [0.32, 0.46], [-0.36, 0.40], [-0.42, 0.15], [-0.06, 0.06]];
  const A_END = [0.14, -0.05];                     // 止まるときの向き：相手の頭のほうへ少し向くが、顔ではなく頬の横あたりを向く
  const FISH = [
    { body: WHITE, mark: NAVY, ph: 0, off: 0, style: "paper" },
    { body: NAVY, mark: WHITE, ph: 1.1, off: 0.5, style: "ink",
      // かすれの筋：[体の幅に対する位置, 始まり, 終わり, 濃さ, 明るい筋か]（毎フレーム同じにして、ちらつかせない）
      streaks: [[-0.62, 0.16, 0.86, 0.14, 1], [-0.3, 0.1, 0.62, 0.1, 1], [0.24, 0.22, 0.9, 0.12, 1], [0.55, 0.14, 0.58, 0.09, 1], [0.02, 0.34, 0.95, 0.2, 0], [-0.08, 0.06, 0.4, 0.18, 0]] },
  ];

  let W = 0, H = 0, dpr = 1, M = [0, 0], S = 1, Lf = 1;
  let WEEDS = [], PADS = [], SPOTS = [], UNIT = 1;

  function layoutScene(wide) {
    const rnd = makeRandom(7);
    UNIT = Math.min(W, H);
    // 水草：根元は画面の下の外。葉ごとに長さ・傾き・濃さを変える（重なりが墨の濃淡になる）
    const clusters = wide
      ? [{ x: W * 0.9, n: 7, h: H * 0.62 }, { x: W * 0.62, n: 3, h: H * 0.3 }]
      : [{ x: W * 0.9, n: 5, h: H * 0.46 }];
    WEEDS = [];
    clusters.forEach((c) => {
      for (let i = 0; i < c.n; i++) {
        WEEDS.push({
          x: c.x + (rnd() - 0.5) * UNIT * 0.1, len: c.h * (0.5 + 0.5 * rnd()),
          lean: (rnd() - 0.5) * 0.55, w: UNIT * (0.009 + 0.008 * rnd()), a: 0.1 + 0.16 * rnd(),
          sway: UNIT * (0.018 + 0.022 * rnd()), ph: rnd() * 6.28, twist: 2 + rnd() * 3, tph: rnd() * 6.28,
          curl: (rnd() - 0.5) * 0.7,
        });
      }
    });
    WEEDS.sort((p, q) => p.a - q.a);                                // 薄い葉から先に描く
    // 浮き葉（睡蓮の葉）：右上の隅に寄せ、一部は画面の外にかける
    PADS = (wide
      ? [[0.935, 0.11, 0.13], [0.8, -0.015, 0.085], [0.99, 0.31, 0.075], [0.015, 0.34, 0.07]]
      : [[0.9, 0.06, 0.15], [0.66, -0.02, 0.09], [0.02, 0.5, 0.08]]
    ).map(([x, y, r], i) => ({ x: x * W, y: y * H, r: r * UNIT, rot: rnd() * 6.28, ph: rnd() * 6.28, a: 0.11 + 0.05 * rnd(), veins: 5 + (i % 3) }));
    // 波紋が広がる場所（魚とタイトルを避ける）
    SPOTS = (wide ? [[0.84, 0.62], [0.47, 0.17], [0.93, 0.47], [0.58, 0.08]] : [[0.78, 0.13], [0.2, 0.18], [0.84, 0.56]])
      .map(([x, y]) => [x * W, y * H]);
  }

  // 求心 Catmull-Rom で点をつなぎ、細かい折れ線と、頭からの距離の表にする
  function buildPath(pts, endDir) {
    const P = [[2 * pts[0][0] - pts[1][0], 2 * pts[0][1] - pts[1][1]], ...pts,
      [pts[pts.length - 1][0] + endDir[0], pts[pts.length - 1][1] + endDir[1]]];
    const xs = [], ys = [], ss = [];
    const knot = (a, b) => Math.sqrt(Math.hypot(b[0] - a[0], b[1] - a[1])) || 1e-4;
    let acc = 0;
    const push = (x, y) => {
      if (xs.length) acc += Math.hypot(x - xs[xs.length - 1], y - ys[ys.length - 1]);
      xs.push(x); ys.push(y); ss.push(acc);
    };
    for (let i = 1; i < P.length - 2; i++) {
      const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
      const k1 = knot(p0, p1), k2 = k1 + knot(p1, p2), k3 = k2 + knot(p2, p3);
      const L = (a, b, ta, tb, t) => { const w = (t - ta) / (tb - ta); return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w]; };
      for (let k = 0; k < 48; k++) {
        const t = k1 + (k2 - k1) * (k / 48);
        const a1 = L(p0, p1, 0, k1, t), a2 = L(p1, p2, k1, k2, t), a3 = L(p2, p3, k2, k3, t);
        const b1 = L(a1, a2, 0, k2, t), b2 = L(a2, a3, k1, k3, t);
        const c = L(b1, b2, k1, k2, t);
        push(c[0], c[1]);
      }
    }
    const last = pts[pts.length - 1];
    push(last[0], last[1]);
    return { xs, ys, ss, L: acc };
  }
  function at(path, s) {
    const { xs, ys, ss } = path, n = xs.length;
    if (s <= 0) {                                   // 道すじの始まりより後ろ（画面の外）は、まっすぐ延ばす
      const dx = xs[1] - xs[0], dy = ys[1] - ys[0], l = Math.hypot(dx, dy) || 1;
      return { x: xs[0] + (dx / l) * s, y: ys[0] + (dy / l) * s, a: Math.atan2(dy, dx) };
    }
    if (s >= path.L) return { x: xs[n - 1], y: ys[n - 1], a: Math.atan2(ys[n - 1] - ys[n - 2], xs[n - 1] - xs[n - 2]) };
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (ss[mid] <= s) lo = mid; else hi = mid; }
    const w = (s - ss[lo]) / (ss[hi] - ss[lo] || 1);
    return { x: xs[lo] + (xs[hi] - xs[lo]) * w, y: ys[lo] + (ys[hi] - ys[lo]) * w, a: Math.atan2(ys[hi] - ys[lo], xs[hi] - xs[lo]) };
  }

  // ---- 泳ぎのリズム（魚の泳ぎの研究にもとづく） ----
  // ・掻いては滑る（burst-and-coast）。1 周期の長さはほぼ一定で、掻く割合で速さが決まる。滑るあいだ、体と尾はまっすぐ
  // ・速さは、尾を振る回数で変わる（振り幅はほとんど変えない）
  // ・最後のひと掻きのあとは、胸びれを広げて減速しながら滑り、止まる
  const smoother = (x) => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10); };
  const CYCLE = 1.35, BURST = 0.56, F_BURST = 2.1, F_COAST = 0.4, LAST = T - 2.1;
  const activity = (t, off) => {                                    // 掻いている度合い（0 = 滑っている、1 = 掻いている）
    if (t >= LAST + 0.35) return 0;
    const c = (((t + off) % CYCLE) + CYCLE) % CYCLE, b = BURST * CYCLE;
    return smooth(c / 0.16) * (1 - smooth((c - (b - 0.14)) / 0.22)) * (1 - smooth((t - LAST) / 0.35));
  };
  const STEPS = 840, DT = T / STEPS;
  FISH.forEach((f) => {
    const D = new Float32Array(STEPS + 1), V = new Float32Array(STEPS + 1), P = new Float32Array(STEPS + 1);
    const A = new Float32Array(STEPS + 1), B = new Float32Array(STEPS + 1);
    let v = 1.15, lag = activity(0, f.off), br = 0, vPrev = v, vmax = 0;
    A[0] = lag; P[0] = f.ph * 3;
    for (let i = 1; i <= STEPS; i++) {
      const t = i * DT, a = activity(t, f.off), brake = smooth((t - LAST) / 0.9);
      v = Math.max(0, v + (2.4 * a - (0.9 + 1.0 * brake) * v) * DT); // 掻けば進み、水の抵抗と胸びれのブレーキで減る（抵抗が弱いので、掻いたあと長く滑る）
      const env = 1 - smoother((t - (T - 1.3)) / 1.3);              // 最後は、ちょうど T で止まるように
      V[i] = v * env;
      D[i] = D[i - 1] + (V[i] + V[i - 1]) * 0.5 * DT;
      lag += (a - lag) * Math.min(1, DT / 0.18);                     // 掻き終わっても、尾はしばらく振れ続ける（フォロースルー）
      A[i] = lag;
      P[i] = P[i - 1] + 2 * Math.PI * (F_COAST + (F_BURST - F_COAST) * lag) * DT;
      const dec = Math.max(0, (vPrev - V[i]) / DT); vPrev = V[i];
      br += (dec - br) * Math.min(1, DT / 0.25); B[i] = br;
      vmax = Math.max(vmax, V[i]);
    }
    const total = D[STEPS], bmax = Math.max(...B) || 1;
    const look = (arr, t) => { const x = clamp(t / T) * STEPS, i = Math.min(STEPS - 1, Math.floor(x)); return arr[i] + (arr[i + 1] - arr[i]) * (x - i); };
    f.frac = (t) => (t <= 0 ? 0 : t >= T ? 1 : look(D, t) / total);
    f.vnAt = (t) => (t >= T ? 0 : look(V, t) / vmax);
    f.actAt = (t) => (t >= T ? 0 : look(A, t));
    f.brakeAt = (t) => (t >= T ? 0 : look(B, t) / bmax);
    f.phAt = (t) => (t <= T ? look(P, t) : P[STEPS] + 2 * Math.PI * 0.5 * (t - T));   // 止まったあとも、尾はゆっくり揺れる
  });
  // 向きの変わる速さ（ラジアン / 秒）。少し前の時刻で見て、尾が遅れて外へ振られる（ドラッグ）のに使う
  const turnRate = (f, t) => {
    if (t <= 0.5 || t >= T) return 0;
    const a1 = at(f.path, f.frac(t - 0.25) * f.path.L).a, a0 = at(f.path, f.frac(t - 0.45) * f.path.L).a;
    let d = a1 - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    return d / 0.2;
  };

  function layout() {
    W = cv.offsetWidth; H = cv.offsetHeight;
    if (!W || !H) return false;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const wide = W >= H * 1.05;
    M = wide ? [W * 0.71, H * 0.33] : [W * 0.5, H * 0.34];        // 出会う点（横長は右寄り、縦長は上寄り。タイトルと重ならない所）
    S = wide ? Math.min(W * 0.30, H * 0.42) : Math.min(W * 0.44, H * 0.30);
    Lf = S * 0.62;                                                  // 魚の体の長さ（尾びれを除く）
    const A = [[-1.02 * Lf - 0.04 * S, M[1] + 0.62 * S], ...A_REL.map(([x, y]) => [M[0] + x * S, M[1] + y * S])];
    const B = A.map(([x, y]) => [2 * M[0] - x, 2 * M[1] - y]);
    FISH[0].path = buildPath(A, [A_END[0] * S, A_END[1] * S]);
    FISH[1].path = buildPath(B, [-A_END[0] * S, -A_END[1] * S]);
    layoutScene(wide);
    return true;
  }

  const rot = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a)];
  const add = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k];
  const unit = (v) => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
  const K = 18;
  const WNORM = Math.pow(0.2857, 0.42) * Math.pow(0.7143, 1.05);  // 体の幅の曲線の最大値

  function leaf(base, dir, len, wid) {                              // ひれ：根元から先へ、片側だけふくらむ葉の形
    const tip = add(base, dir, len), side = [-dir[1], dir[0]];
    g.moveTo(base[0], base[1]);
    g.quadraticCurveTo(...add(add(base, dir, len * 0.45), side, wid), tip[0], tip[1]);
    g.quadraticCurveTo(...add(add(base, dir, len * 0.5), side, -wid * 0.35), base[0], base[1]);
  }

  function drawWeeds(t) {                                           // 水草：ねじれながら揺れる、細長いリボン
    g.fillStyle = NAVY;
    WEEDS.forEach((wd) => {
      const n = 22, left = [], right = [];
      let prev = null;
      for (let k = 0; k <= n; k++) {
        const v = k / n;
        const x = wd.x + wd.lean * wd.len * Math.pow(v, 1.5)
          + wd.curl * wd.len * v * v * (1 - v) * 1.8                   // 途中でしなって、先が戻る
          + wd.sway * v * v * Math.sin(0.45 * t + wd.ph + v * 2.2);
        const y = H + 8 - wd.len * v;
        const pt = [x, y];
        const d = prev ? unit([pt[0] - prev[0], pt[1] - prev[1]]) : [0, -1];
        const nn = [-d[1], d[0]];
        const w = wd.w * (1 - Math.pow(v, 2.2)) * (0.55 + 0.45 * Math.min(1, v * 5)) * (0.3 + 0.7 * Math.abs(Math.cos(v * wd.twist + wd.tph)));
        left.push(add(pt, nn, w)); right.push(add(pt, nn, -w));
        prev = pt;
      }
      const o = [...left, ...right.reverse()];
      g.globalAlpha = wd.a;
      g.beginPath(); g.moveTo(o[0][0], o[0][1]);
      for (let i = 1; i < o.length - 1; i++) g.quadraticCurveTo(o[i][0], o[i][1], (o[i][0] + o[i + 1][0]) / 2, (o[i][1] + o[i + 1][1]) / 2);
      g.closePath(); g.fill();
    });
    g.globalAlpha = 1;
  }
  function drawPads(t) {                                            // 浮き葉：縁の揺らいだ丸い葉に、細い切れ込みと、曲がった葉脈。ほんの少し漂う
    PADS.forEach((pd) => {
      const cx = pd.x + Math.sin(0.13 * t + pd.ph) * UNIT * 0.006, cy = pd.y + Math.cos(0.11 * t + pd.ph) * UNIT * 0.004;
      const rot = pd.rot + 0.03 * Math.sin(0.17 * t + pd.ph), gap = 0.07, n = 64;
      const R = (a) => pd.r * (1 + 0.03 * Math.sin(3 * a + pd.ph) + 0.018 * Math.sin(7 * a + pd.ph * 2));
      g.fillStyle = NAVY; g.globalAlpha = pd.a;
      g.beginPath();
      g.moveTo(cx + Math.cos(rot) * pd.r * 0.04, cy + Math.sin(rot) * pd.r * 0.04);   // 切れ込みの奥（葉の中心）
      for (let i = 0; i <= n; i++) {
        const a = rot + gap + ((Math.PI * 2 - gap * 2) * i) / n;
        g.lineTo(cx + Math.cos(a) * R(a - rot), cy + Math.sin(a) * R(a - rot));
      }
      g.closePath(); g.fill();
      // 葉脈：中心からゆるく曲がって、縁の手前で消える
      g.strokeStyle = NAVY; g.globalAlpha = pd.a * 0.55; g.lineWidth = Math.max(0.8, pd.r * 0.01); g.lineCap = "round";
      g.beginPath();
      for (let i = 1; i <= pd.veins; i++) {
        const a = rot + gap + ((Math.PI * 2 - gap * 2) * i) / (pd.veins + 1), bend = 0.18 * (i % 2 ? 1 : -1);
        const L = pd.r * (0.62 + 0.12 * Math.sin(i * 2.1 + pd.ph));
        g.moveTo(cx, cy);
        g.quadraticCurveTo(cx + Math.cos(a + bend) * L * 0.55, cy + Math.sin(a + bend) * L * 0.55, cx + Math.cos(a) * L, cy + Math.sin(a) * L);
      }
      g.stroke();
    });
    g.globalAlpha = 1;
  }
  function brushRing(cx, cy, r, lw, color, alpha, ph) {             // 筆で描いた輪：場所によって線の太さが変わる
    const n = 72, outer = [], inner = [];
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2, w = lw * (0.22 + 0.78 * Math.pow(Math.sin(a * 0.5 + ph), 2));
      outer.push([cx + Math.cos(a) * (r + w / 2), cy + Math.sin(a) * (r + w / 2)]);
      inner.push([cx + Math.cos(a) * (r - w / 2), cy + Math.sin(a) * (r - w / 2)]);
    }
    g.fillStyle = color; g.globalAlpha = alpha;
    g.beginPath(); g.moveTo(outer[0][0], outer[0][1]);
    outer.forEach((p) => g.lineTo(p[0], p[1]));
    inner.reverse().forEach((p) => g.lineTo(p[0], p[1]));
    g.closePath(); g.fill();
    g.globalAlpha = 1;
  }
  function drawRipples(t) {                                         // 止まったあと、ときどき水面に広がる波紋（二重の輪）
    if (REDUCED.matches) return;
    const start = T + 1.2, every = 5.5, dur = 3.4;
    if (t < start) return;
    const i = Math.floor((t - start) / every), local = t - start - i * every;
    const [cx, cy] = SPOTS[i % SPOTS.length];
    [0, 0.45].forEach((delay, j) => {
      const k = (local - delay) / dur;
      if (k <= 0 || k >= 1) return;
      const e = 1 - Math.pow(1 - k, 3);
      brushRing(cx, cy, UNIT * (0.015 + 0.15 * e) * (j ? 0.7 : 1), Math.max(1.4, UNIT * 0.007) * (1 - k * 0.5), NAVY, 0.24 * Math.pow(1 - k, 1.6), i * 1.7 + j);
    });
  }

  function drawTrail(f, sH, t) {                                   // 尾の後ろに流れる、泳いだ軌跡の線
    const fade = 1 - smooth((t - T + 0.3) / 1.6);
    if (fade <= 0) return;
    const start = sH - Lf * 1.72, len = Lf * 1.4, n = 26;
    g.lineCap = "round"; g.strokeStyle = f.body;
    const lw0 = Math.max(1.6, Lf * 0.012);
    for (let j = 0; j < n; j++) {
      const a = at(f.path, start - (len * j) / n), b = at(f.path, start - (len * (j + 1)) / n);
      g.globalAlpha = 0.5 * fade * Math.pow(1 - j / n, 1.4);
      g.lineWidth = Math.max(0.6, lw0 * Math.pow(1 - j / n, 1.2));
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
    g.globalAlpha = 1;
  }

  // 体（背骨の左右に幅をとった形）の輪郭を作る。scale(k) で幅を変え、k0〜k1 の範囲だけにもできる
  function bodyPath(pts, nrm, wid, scale, k0 = 0, k1 = K - 1) {
    const L = [], R = [];
    for (let k = k0; k <= k1; k++) { const w = wid[k] * scale(k); L.push(add(pts[k], nrm[k], w)); R.push(add(pts[k], nrm[k], -w)); }
    const o = [...L, ...R.reverse()];
    g.beginPath(); g.moveTo(o[0][0], o[0][1]);
    for (let i = 1; i < o.length - 1; i++) g.quadraticCurveTo(o[i][0], o[i][1], (o[i][0] + o[i + 1][0]) / 2, (o[i][1] + o[i + 1][1]) / 2);
    g.closePath();
  }
  // 筆の線：点の列に沿って、両端が細く、途中が太いリボンを塗る
  function brushLine(line, lw, taperTail = 0.55) {
    if (line.length < 3) return;
    const L = [], R = [], n = line.length - 1;
    for (let i = 0; i <= n; i++) {
      const a = line[Math.max(0, i - 1)], b = line[Math.min(n, i + 1)], d = unit([b[0] - a[0], b[1] - a[1]]), nn = [-d[1], d[0]];
      const w = lw * (Math.pow(Math.sin((Math.PI * i) / n), 0.6) * (1 - taperTail * (i / n)) + 0.12) * 0.5;
      L.push(add(line[i], nn, w)); R.push(add(line[i], nn, -w));
    }
    const o = [...L, ...R.reverse()];
    g.beginPath(); g.moveTo(o[0][0], o[0][1]);
    for (let i = 1; i < o.length - 1; i++) g.quadraticCurveTo(o[i][0], o[i][1], (o[i][0] + o[i + 1][0]) / 2, (o[i][1] + o[i + 1][1]) / 2);
    g.closePath(); g.fill();
  }

  function drawFish(f, t) {
    const rest = smooth((t - (T - 0.6)) / 1.4);
    const sH = f.frac(t) * f.path.L;
    const vn = f.vnAt(t), act = f.actAt(t), brake = f.brakeAt(t), phase = f.phAt(t), turn = turnRate(f, t);
    const ampK = 0.1 + 0.9 * act;                                     // 滑るあいだ、体はほぼまっすぐ
    // 体の波：Δy = A(x)·sin(φ − 2πx/λ)、波長 λ = 体の長さ。A は頭で少し振れ、0.25 あたりで最も小さく、尾で最大（尾の振れ幅は全長の 0.2）
    const E = (u) => 0.02 - 0.08 * u + 0.16 * u * u;
    const pts = [];
    for (let k = 0; k < K; k++) {
      const u = k / (K - 1), b = at(f.path, sH - u * Lf);
      const off = Lf * ampK * E(u) * Math.sin(phase - 2 * Math.PI * u);
      pts.push([b.x - Math.sin(b.a) * off, b.y + Math.cos(b.a) * off]);
    }
    const nrm = pts.map((p, k) => { const d = unit([pts[Math.max(0, k - 1)][0] - pts[Math.min(K - 1, k + 1)][0], pts[Math.max(0, k - 1)][1] - pts[Math.min(K - 1, k + 1)][1]]); return [-d[1], d[0]]; });
    const wid = pts.map((p, k) => { const u = k / (K - 1); return (Lf * 0.12 * Math.pow(u, 0.42) * Math.pow(1 - u, 1.05)) / WNORM; });
    const toTail = (k) => unit([pts[Math.min(K - 1, k + 1)][0] - pts[k][0], pts[Math.min(K - 1, k + 1)][1] - pts[k][1]]);
    const ink = f.style === "ink";

    // ---- 尾びれ：金魚のように長く、ひらひらと流れる二股の尾 ----
    // 体の後ろの道すじに沿わせて伸ばし、体の波を、遅れて大きく尾へ伝える。縁はゆるく波打つ
    const Lt = Lf * 0.78, nT = 16, tc = [];
    for (let i = 0; i <= nT; i++) {
      const v = i / nT, b = at(f.path, sH - Lf - v * Lt);
      const off = Lf * ampK * (E(1) + 0.13 * v) * Math.sin(phase - 2 * Math.PI - 2 * Math.PI * 0.85 * v)   // 体の波の続き（先ほど遅れる）
        + Lf * 0.03 * v * v * Math.sin(2 * Math.PI * 0.55 * t + f.ph) * (0.6 + 0.4 * (1 - act))          // 水になびく、ゆるい揺れ
        - turn * Lt * 0.07 * Math.pow(v, 1.4);                                                           // 曲がると、外へ振られる
      tc.push([b.x - Math.sin(b.a) * off, b.y + Math.cos(b.a) * off]);
    }
    const tn = tc.map((p, i) => { const d = unit([tc[Math.max(0, i - 1)][0] - tc[Math.min(nT, i + 1)][0], tc[Math.max(0, i - 1)][1] - tc[Math.min(nT, i + 1)][1]]); return [-d[1], d[0]]; });
    const billow = 1 + 0.16 * brake + 0.1 * rest - 0.08 * act;        // 掻くと細く流れ、減速すると、ふわっと広がる
    const spread = (i, sc) => { const v = i / nT; return Lt * (0.05 + 0.4 * Math.pow(v, 0.85)) * (1 + 0.07 * Math.sin(v * 14 + phase * 0.7)) * sc * billow; };
    const fanPath = (sc) => {                                       // 扇形に広がり、先が二股に分かれる
      const up = tc.map((p, i) => add(p, tn[i], spread(i, sc))), dn = tc.map((p, i) => add(p, tn[i], -spread(i, sc)));
      const notch = tc[Math.round(nT * 0.6)];
      g.beginPath(); g.moveTo(tc[0][0], tc[0][1]);
      for (let i = 0; i < nT; i++) g.quadraticCurveTo(up[i][0], up[i][1], (up[i][0] + up[i + 1][0]) / 2, (up[i][1] + up[i + 1][1]) / 2);
      g.lineTo(up[nT][0], up[nT][1]);
      g.quadraticCurveTo(...add(tc[nT], tn[nT], spread(nT, sc) * 0.25), notch[0], notch[1]);
      g.quadraticCurveTo(...add(tc[nT], tn[nT], -spread(nT, sc) * 0.25), dn[nT][0], dn[nT][1]);
      for (let i = nT; i > 0; i--) g.quadraticCurveTo(dn[i][0], dn[i][1], (dn[i][0] + dn[i - 1][0]) / 2, (dn[i][1] + dn[i - 1][1]) / 2);
      g.closePath();
    };
    g.fillStyle = ink ? NAVY : WHITE;
    g.globalAlpha = ink ? 0.17 : 0.62; fanPath(1); g.fill();
    if (ink) { g.globalAlpha = 0.2; fanPath(0.5); g.fill(); }       // 根元ほど濃く、先は透ける
    g.fillStyle = NAVY; g.globalAlpha = ink ? 0.38 : 0.28;           // 尾の筋
    [-0.86, -0.52, -0.2, 0.2, 0.52, 0.86].forEach((c) => {
      const end = Math.round(nT * (1 - 0.36 * (1 - Math.abs(c)))), line = [];
      for (let i = 0; i <= end; i++) line.push(add(tc[i], tn[i], spread(i, 1) * c * 0.92));
      brushLine(line, Math.max(1, Lf * 0.008), 0.8);
    });
    if (!ink) {                                                     // 白い魚は、尾の外側の縁を細い筆でなぞる
      g.globalAlpha = 0.42;
      [1, -1].forEach((side) => { const line = []; for (let i = 1; i <= nT; i++) line.push(add(tc[i], tn[i], spread(i, 1) * side)); brushLine(line, Math.max(1, Lf * 0.009), 0.4); });
    }
    // ---- 胸びれ・腹びれ ----
    // 速く泳ぐあいだは体に沿わせてたたみ、滑るとき・曲がるとき・止まるときに広げる。止まったら、左右交互にゆっくり掻いてとどまる
    const open = clamp(Math.max(1 - vn * 1.15, brake * 1.4, Math.abs(turn) * 0.35));
    const scull = Math.sin(2 * Math.PI * 0.8 * t + f.ph) * (0.06 + 0.08 * rest);
    g.fillStyle = ink ? NAVY : WHITE; g.globalAlpha = ink ? 0.32 : 0.78;
    g.beginPath();
    const fins = [[Math.round(0.26 * (K - 1)), Lf * 0.2, Lf * 0.075, 0.28 + 0.97 * open, 1], [Math.round(0.56 * (K - 1)), Lf * 0.12, Lf * 0.045, 0.35 + 0.45 * open, 0.4]];
    fins.forEach(([k, len, w, spread, sk]) => {
      const td = toTail(k);
      [1, -1].forEach((side) => leaf(add(pts[k], nrm[k], wid[k] * 0.8 * side), rot(td, -side * (spread + scull * sk * side)), len, w * side));
    });
    g.fill();
    if (!ink) { g.strokeStyle = NAVY; g.globalAlpha = 0.4; g.lineWidth = Math.max(0.8, Lf * 0.004); g.stroke(); }

    if (ink) {
