    // 下：状態パネル（判定）とタスク
    const by = r2.y + r2.h + 26, pw = portrait ? w - 16 : (w - 26) * 0.5, sp = { x: 8, y: by, w: pw, h: portrait ? 118 : h - by - 8 }, tp = portrait ? { x: 8, y: by + sp.h + 8, w: w - 16, h: h - (by + sp.h + 8) - 8 } : { x: 18 + pw, y: by, w: pw, h: h - by - 8 };
    const box = (r) => { g.fillStyle = "#0a1b29"; g.fillRect(r.x, r.y, r.w, r.h); g.strokeStyle = C.reef; g.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1); };
    box(sp); box(tp);
    const mm = Math.min(m, SPAN - 0.01), st = stateAt(mm), cur = q3 > 0.5 ? null : st;
    const stateName = cur ? (cur.comp ? "計算中" : cur.act ? "操作中" : "待機中") : "";
    const fg = cur && cur.act ? cur.act.app : cur && cur.comp && !cur.act ? "（ほかのアプリ）" : "";
    if (cur) {
      g.textAlign = "left"; g.font = `${fs + 1}px ${SERIF}`; g.fillStyle = cur.comp ? "#e0a060" : cur.act ? "#ff9a40" : C.tide; g.fillText(stateName, sp.x + 10, sp.y + 16);
      g.font = `${fs - 1}px ${MONO}`; g.fillStyle = C.mist; g.fillText(`${clock(mm)}   前面: ${fg || "—"}`, sp.x + 10 + fs * 5.2, sp.y + 16);
      // 負荷のグラフ（直近 60 分）。開始と終了のしきい値を引く
      const gx = sp.x + 10, gy = sp.y + 30, gw = sp.w - 20, gh = sp.h - 42, vmax = 14, Y = (v) => gy + gh - (v / vmax) * gh;
      g.strokeStyle = "rgba(242,248,250,.28)"; g.setLineDash([4, 4]); [ENTER, EXIT].forEach((v) => { g.beginPath(); g.moveTo(gx, Y(v)); g.lineTo(gx + gw, Y(v)); g.stroke(); }); g.setLineDash([]);
      g.font = `${fs - 3}px ${SERIF}`; g.fillStyle = C.tide; g.textAlign = "right"; g.fillText("計算とみなす", gx + gw, Y(ENTER) - 6); g.fillText("やめたとみなす", gx + gw, Y(EXIT) + 8);
      g.strokeStyle = "#7fd6ec"; g.lineWidth = 1.5; g.beginPath(); let first = true;
      for (let k = 0; k <= 60; k += 0.5) { const x = mm - 60 + k; if (x < 0) continue; const px = gx + (k / 60) * gw, py = Y(cores(x)); if (first) { g.moveTo(px, py); first = false; } else g.lineTo(px, py); } g.stroke();
      g.font = `${fs - 2}px ${MONO}`; g.textAlign = "left"; g.fillStyle = C.tide; g.fillText("CPU コア", gx, gy + 2);
    } else { g.textAlign = "left"; g.font = `${fs}px ${SERIF}`; g.fillStyle = C.mist; g.fillText("1 日のログ", sp.x + 10, sp.y + 16); g.font = `${fs - 1}px ${MONO}`; g.fillStyle = C.tide; g.fillText(`${SEG.filter((s) => s.t === "act").length} 区間の操作、${SEG.filter((s) => s.t === "comp").length} 回の計算`, sp.x + 10, sp.y + 38); }
    // タスク
    g.textAlign = "left"; g.font = `${fs}px ${SERIF}`; g.fillStyle = C.mist; g.fillText("タスク", tp.x + 10, tp.y + 16);
    const rh = Math.min(30, (tp.h - 34) / 3);
    TASKS.forEach((tk, i) => {
      const y = tp.y + 28 + i * rh; hits.push({ x: tp.x, y, w: tp.w, h: rh, task: i });
      if (q3 > 0 && sel >= 0) { g.fillStyle = "rgba(127,214,236,.08)"; g.fillRect(tp.x + 2, y, tp.w - 4, rh); }
      g.fillStyle = tk.color; g.beginPath(); g.arc(tp.x + 16, y + rh / 2, 4.5, 0, 6.283); g.fill();
      g.fillStyle = C.foam; g.font = `${fs - 1}px ${MONO}`; const nm = tk.name.length > (portrait ? 16 : 20) ? tk.name.slice(0, portrait ? 15 : 19) + "…" : tk.name; g.fillText(nm, tp.x + 28, y + rh / 2);
      let cx = tp.x + 28 + g.measureText(nm).width + 8; if (tk.label) { g.fillStyle = tk.lc; g.fillRect(cx, y + rh / 2 - 8, g.measureText(tk.label).width + 10, 16); g.fillStyle = "#fff"; g.fillText(tk.label, cx + 5, y + rh / 2); }
      g.textAlign = "right"; g.fillStyle = C.mist; g.fillText(q3 > 0 ? fmt(T.per[i]) : "—", tp.x + tp.w - 10, y + rh / 2); g.textAlign = "left";
    });
    // 計算が終わった通知（手順 2 の終わり）
    if (!U_inStep3() && ((m > 118 && m < 134) || (m > 180 && m < 196)) && q2 > 0) {
      const app = m < 150 ? "Houdini" : "Maya", nx = w - Math.min(w * 0.62, 250) - 10, nw = Math.min(w * 0.62, 250);
      g.fillStyle = "rgba(10,27,41,.96)"; g.fillRect(nx, r1.y + 6, nw, 34); g.strokeStyle = "#ffcf5a"; g.strokeRect(nx + 0.5, r1.y + 6.5, nw - 1, 33);
      g.fillStyle = C.foam; g.font = `${fs - 1}px ${SERIF}`; g.textAlign = "left"; g.fillText(`[${app}] 計算が終わりました`, nx + 10, r1.y + 23);
    }
    function U_inStep3() { return q3 > 0; }
  }

  return {
    id: "timeto", kind: "canvas", idle: false,
    label: "作業の記録を、操作中・計算中・待機中に分けて、タスクに割り当てる仕組みの図",
    steps: ["操作を記録する", "計算を見分ける", "タスクに割り当てる"],
    prepare() {},
    draw,
    status(i) {
      return [
        "前面のアプリと無操作の時間から、操作中と待機中を分けて記録します。",
        "アプリの負荷が一定の間しきい値を超えたら、計算中として記録します。操作していなくても、別のアプリを見ていても記録されます。終わったときは、通知で知らせることもできます。",
        "記録をタスクに割り当てて、タスクごとの時間を出します。タイムラインの帯をタスクへ入れ直して、あとから割り当てることもできます。",
      ][i];
    },
    tap(x, y, w, h, api) {
      const hit = hits.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h); if (!hit) return;
      if (hit.task != null) {
        if (sel < 0) return "先にタイムラインの帯を選んでから、タスクを選びます。";
        const sg = SEG[sel]; assign[sel] = hit.task; const msg = `${sg.app} の ${clock(sg.a)}〜${clock(sg.b)} を、${TASKS[hit.task].name} に割り当てました。`; sel = -1; return msg;
      }
      sel = sel === hit.i ? -1 : hit.i;
      return sel < 0 ? "選びを外しました。" : `${SEG[hit.i].app} の ${clock(SEG[hit.i].a)}〜${clock(SEG[hit.i].b)} を選びました。入れるタスクを選んでください。`;
    },
    onLeaveHold() { sel = -1; SEG.forEach((s, i) => { assign[i] = s.app === "Houdini" ? 0 : s.app === "Maya" ? 1 : -1; }); },
    hint: { mouse: "時間の帯を選び、次にタスクを選ぶと、割り当てを入れ直せます。", touch: "時間の帯をタップし、次にタスクをタップすると、割り当てを入れ直せます。" },
  };
}

/* =========================================================
   仕組みデモを、画面に出す・消す
   ・「潜って見る」：スクロールで舞台が留まり、スクロール量 p で絵が決まる（scroll モード）
   ・詳細画面：ボタンで順に進める（manual モード）
   ========================================================= */
const SIM_DEFS = { ivy: defIvy, colormura: defColormura, autoimport: defAutoImport, pathmanager: defPathManager, arnold: defArnold, bridge: defBridge, seeyou: defSeeYou, timeto: defTimeTo };
const SIM_NOTE = "実際のツールの出力ではなく、仕組みを再現したデモです。";
const toolOf = (id) => TOOLS.find((t) => t.id === id);

function canPin() {
  return typeof CSS !== "undefined" && CSS.supports("position", "sticky") && CSS.supports("overflow", "clip")
    && "IntersectionObserver" in window && !REDUCED.matches && innerHeight >= 480;
}
function gatherEls(root) {
  return {
    stage: root.querySelector(".sim-stage"),
    stepBtns: [...root.querySelectorAll(".sim-step")],
    reset: root.querySelector(".sim-reset"),
    status: root.querySelector(".sim-status"),
    hint: root.querySelector(".sim-hint"),
    controls: root.querySelector(".sim-controls"),
  };
}
const stepBtnsHTML = (def) => def.playground ? "" : def.steps.map((s, i) => `<button class="btn sim-step" type="button" data-step="${i}">${i + 1} ${esc(s)}</button>`).join("");
function manualSimHTML(def, id) {
  return `<section class="block sim" aria-labelledby="sim-title-${id}">
    <h3 id="sim-title-${id}">仕組みを触る</h3>
    <p class="sim-note">${SIM_NOTE}</p>
    <div class="sim-stage" data-kind="${def.kind}"></div>
    <p class="sim-hint" hidden></p>
    ${def.playground ? "" : `<div class="sim-steps-row" role="group" aria-label="手順">${stepBtnsHTML(def)}<button class="btn sim-reset" type="button">最初から</button></div>`}
    <p class="sim-status" aria-live="polite"></p>
    <div class="sim-controls" hidden></div>
  </section>`;
}

/* ---- 詳細画面（manual） ---- */
let modalSim = null;
function destroyModalSim() { if (modalSim) { modalSim.destroy(); modalSim = null; } }
function mountModalSim(t) {
  const host = $("#sheet .sim-host");
  if (!host || !t.sim) return;
  const def = SIM_DEFS[t.sim]();
  host.innerHTML = manualSimHTML(def, t.id);
  modalSim = SimCore(def, gatherEls(host), "manual");
}

/* ---- 潜って見る（scroll） ---- */
const diveSims = [];        // { article, pin, inner, tool, sim, active }
let diveMode = "";          // "pin" か "inline"
let diveIO = null, scrollTick = false;

function diveSimHTML(t) {
  const def = SIM_DEFS[t.sim]();
  return `<article class="dive-sim" data-tool="${t.id}">
    <div class="dive-sim-pin"><div class="dive-sim-inner" style="opacity:0">
      <div class="dive-sim-head">
        <div class="badges">${badgesHTML(t.badges)}</div>
        <h3 class="${isLatin(t.name) ? "is-latin" : ""}">${esc(t.name)}</h3>
        <p class="dive-sim-summary">${esc(t.summary)}</p>
      </div>
      <div class="dive-sim-stage-wrap" data-kind="${def.kind}"${def.playground ? ' data-play="1"' : ""}><div class="sim-stage" data-kind="${def.kind}"></div></div>
      <div class="dive-sim-ctl">
        ${def.playground ? "" : `<div class="sim-steps" role="group" aria-label="手順">${stepBtnsHTML(def)}</div>`}
        <p class="sim-status" aria-live="polite"></p>
        <p class="sim-hint" hidden></p>
        <p class="sim-note">${SIM_NOTE}</p>
        <div class="dive-sim-actions"><a class="btn" href="#${t.id}">詳しく見る</a>${def.playground ? "" : `<button class="btn sim-reset" type="button">最初から</button>`}</div>
      </div>
    </div></div>
  </article>`;
}
function diveInlineHTML(t, i) {
  return `<article class="dive-item${i % 2 ? " flip" : ""}">
      <a class="card-link dive-media reveal" href="#${t.id}" aria-label="${esc(t.name)}の詳細を見る"><span class="card-thumb">${cardThumb(t)}</span></a>
      <div class="dive-text reveal">
        <div class="badges">${badgesHTML(t.badges)}</div>
        <h3 class="${isLatin(t.name) ? "is-latin" : ""}">${esc(t.name)}</h3>
        <p>${esc(t.summary)}</p>
        <a class="btn" href="#${t.id}">詳しく見る</a>
      </div>
    </article>
    <div class="dive-sim-inline" data-inline-tool="${t.id}"></div>`;
}

function renderDive() {
  diveSims.forEach((s) => s.sim && s.sim.destroy()); diveSims.length = 0;
  if (diveIO) { diveIO.disconnect(); diveIO = null; }
  diveMode = canPin() ? "pin" : "inline";
  const label = Object.fromEntries(CATEGORIES.map((c) => [c.id, c.label]));
  let html = "", lastCat = "";
  TOOLS.forEach((t, i) => {
    if (t.category !== lastCat) {
      lastCat = t.category;
      html += `<h2 class="dive-zone reveal"><span class="zone-name">${esc(label[t.category])}</span></h2>`;
    }
    if (t.sim && diveMode === "pin") { html += diveSimHTML(t); return; }
    if (t.sim) { html += diveInlineHTML(t, i); return; }
    html += `
      <article class="dive-item${i % 2 ? " flip" : ""}">
        <a class="card-link dive-media reveal" href="#${t.id}" aria-label="${esc(t.name)}の詳細を見る">
          <span class="card-thumb">${cardThumb(t)}</span>
        </a>
        <div class="dive-text reveal">
          <div class="badges">${badgesHTML(t.badges)}</div>
          <h3 class="${isLatin(t.name) ? "is-latin" : ""}">${esc(t.name)}</h3>
          <p>${esc(t.summary)}</p>
          <a class="btn" href="#${t.id}">詳しく見る</a>
        </div>
      </article>`;
  });
  $("#dive-list").innerHTML = html;
  if (!("IntersectionObserver" in window)) return;
  if (diveMode === "pin") {
    diveIO = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        const s = diveSims.find((x) => x.article === e.target); if (!s) return;
        s.active = e.isIntersecting;
        if (e.isIntersecting && !s.sim) mountScrollSim(s);
        if (s.sim) s.sim.setActive(e.isIntersecting && !simSuspended());
      });
      runScroll();
    }, { rootMargin: "100% 0px 100% 0px" });
    document.querySelectorAll(".dive-sim").forEach((article) => {
      const s = { article, pin: article.querySelector(".dive-sim-pin"), inner: article.querySelector(".dive-sim-inner"), tool: toolOf(article.dataset.tool), sim: null, active: false };
      diveSims.push(s); diveIO.observe(article);
    });
    // 計算（ivy は約 50ms）で、スクロールの途中が引っかからないように、読み込みが落ち着いてから 1 本ずつ先に作っておく
    const idle = window.requestIdleCallback ? (f) => requestIdleCallback(f, { timeout: 2000 }) : (f) => setTimeout(f, 0);
    diveSims.forEach((s, k) => setTimeout(() => idle(() => { if (!s.sim && diveSims.includes(s)) mountScrollSim(s); }), 900 + k * 500));
  } else {
    diveIO = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting || e.target._mounted) return;
        e.target._mounted = true;
        const t = toolOf(e.target.dataset.inlineTool), def = SIM_DEFS[t.sim]();
        e.target.innerHTML = manualSimHTML(def, t.id);
        diveSims.push({ article: e.target, tool: t, sim: SimCore(def, gatherEls(e.target), "manual"), active: true });
        syncSimSuspend();
      });
    }, { rootMargin: "50% 0px 50% 0px" });
    document.querySelectorAll(".dive-sim-inline").forEach((el) => diveIO.observe(el));
  }
}
function mountScrollSim(s) {
  const def = SIM_DEFS[s.tool.sim](), els = gatherEls(s.article);
  els.enter = s.inner;
  s.sim = SimCore(def, els, "scroll", { scrollToStep: (i) => scrollDiveTo(s, i) });
  s.sim.setEnter(0);
  s.sim.setActive(s.active && !simSuspended());
  syncSimSuspend();
}
function scrollDiveTo(s, i) {
  const range = s.article.offsetHeight - s.pin.offsetHeight;
  const p = i < 0 ? 0 : PHASE.steps[i][1];
  const top = s.article.getBoundingClientRect().top + scrollY + range * p + 1;
  window.scrollTo({ top, behavior: REDUCED.matches ? "auto" : "smooth" });
}
function runScroll() {
  scrollTick = false;
  if (currentView !== "dive" || diveMode !== "pin") return;
  const vh = innerHeight;
  for (const s of diveSims) {
    if (!s.active || !s.sim) continue;
    const r = s.article.getBoundingClientRect();
    const range = s.article.offsetHeight - s.pin.offsetHeight;
    s.sim.setEnter(clamp((vh * 0.9 - r.top) / (vh * 0.8)));              // 近づくあいだに、深いところから浮かび上がる
    s.sim.setProgress(range <= 0 ? 1 : clamp(-r.top / range));
  }
}
window.addEventListener("scroll", () => { if (!scrollTick && diveMode === "pin") { scrollTick = true; requestAnimationFrame(runScroll); } }, { passive: true });
let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if ((canPin() ? "pin" : "inline") !== diveMode) { renderDive(); watchReveals(); syncSimSuspend(); }
    else runScroll();
  }, 200);
});
const simSuspended = () => dialog.open || currentView !== "dive";
function syncSimSuspend() {
  const f = simSuspended();
  diveSims.forEach((s) => s.sim && s.sim.suspend(f));
  if (!f) runScroll();
}


/* =========================================================
   初期化
   ========================================================= */
$("#year").textContent = new Date().getFullYear();
paintOcean();
renderTabs();
renderGrid();
renderDive();
makeBubbles();
watchCardsOnTouch();
watchReveals();
showView(location.hash === "#list" ? "list" : "dive");
if (location.hash && location.hash !== "#list" && location.hash !== "#dive") syncFromHash();
</script>
