      g.fillStyle = NAVY;
      [[1.12, 0.07], [1.05, 0.12], [1.0, 0.28]].forEach(([sc, a]) => { g.globalAlpha = a; bodyPath(pts, nrm, wid, () => sc); g.fill(); });
      g.globalAlpha = 0.34; bodyPath(pts, nrm, wid, (k) => 0.7 * (1 - 0.25 * (k / (K - 1)))); g.fill();
      g.globalAlpha = 0.42; bodyPath(pts, nrm, wid, (k) => 0.36 * (1 - 0.6 * (k / (K - 1)))); g.fill();
      const kh = Math.round(0.22 * (K - 1));                         // 頭は濃墨
      g.globalAlpha = 0.4; bodyPath(pts, nrm, wid, (k) => 0.95 * Math.pow(Math.max(0, 1 - k / kh), 0.35), 0, kh); g.fill();
      g.lineCap = "round"; g.lineWidth = Math.max(0.7, Lf * 0.006);
      f.streaks.forEach(([off, u0, u1, a, light]) => {
        g.strokeStyle = light ? WHITE : NAVY; g.globalAlpha = a;
        const k0 = Math.round(u0 * (K - 1)), k1 = Math.round(u1 * (K - 1));
        g.beginPath();
        for (let k = k0; k <= k1; k++) { const p = add(pts[k], nrm[k], wid[k] * off); k === k0 ? g.moveTo(p[0], p[1]) : g.lineTo(p[0], p[1]); }
        g.stroke();
      });
    } else {
      // ---- 紙の白の魚：白い体を、太さの変わる筆の輪郭で描き起こす。所々で筆が途切れる。背と頭に薄く墨をはく ----
      g.fillStyle = WHITE; g.globalAlpha = 0.94; bodyPath(pts, nrm, wid, () => 1); g.fill();
      g.fillStyle = NAVY;
      g.globalAlpha = 0.055; bodyPath(pts, nrm, wid, (k) => 0.36 * (1 - 0.5 * (k / (K - 1)))); g.fill();
      const kh = Math.round(0.2 * (K - 1));
      g.globalAlpha = 0.08; bodyPath(pts, nrm, wid, (k) => 0.9 * Math.pow(Math.max(0, 1 - k / kh), 0.35), 0, kh); g.fill();
      g.globalAlpha = 0.72;
      const lw = Math.max(1.3, Lf * 0.014);
      [[1, [[0, 0.42], [0.5, 0.97]]], [-1, [[0, 0.62], [0.69, 0.97]]]].forEach(([side, runs]) => {
        runs.forEach(([u0, u1]) => {
          const k0 = Math.round(u0 * (K - 1)), k1 = Math.round(u1 * (K - 1)), line = [];
          for (let k = k0; k <= k1; k++) line.push(add(pts[k], nrm[k], wid[k] * side));
          brushLine(line, lw * (u0 === 0 ? 1 : 0.7));
        });
      });
    }
    // ---- 目 ----
    const er = Math.max(1.4, Lf * 0.016);
    [1, -1].forEach((side) => {
      const e = add(pts[1], nrm[1], wid[1] * 0.55 * side);
      g.globalAlpha = 1; g.fillStyle = ink ? WHITE : NAVY;
      g.beginPath(); g.arc(e[0], e[1], er, 0, Math.PI * 2); g.fill();
      if (ink) { g.fillStyle = NAVY; g.beginPath(); g.arc(e[0], e[1], er * 0.45, 0, Math.PI * 2); g.fill(); }
    });
    g.globalAlpha = 1;
    return sH;
  }

  function draw(t) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const heads = FISH.map((f) => f.frac(t) * f.path.L);
    drawWeeds(t);
    FISH.forEach((f, i) => drawTrail(f, heads[i], t));
    // 止まった瞬間に、出会った所から一度だけ広がる輪
    const k = (t - (T - 0.2)) / 2.0;
    if (k > 0 && k < 1) {
      brushRing(M[0], M[1], S * (0.16 + 0.9 * (1 - Math.pow(1 - k, 3))), Math.max(1.6, S * 0.012) * (1 - k * 0.4), WHITE, 0.55 * Math.pow(1 - k, 1.5), 0.6);
    }
    FISH.slice().reverse().forEach((f) => drawFish(f, t));
    drawPads(t);
    drawRipples(t);
    if (t >= SETTLE) showTitle();
  }

  let raf = 0, visible = true, last = 0;
  function frame(now) {
    raf = 0;
    const t = (now - t0) / 1000;
    const idle = t > T + 2.5;                       // 止まったあとは、ひれが揺れるだけなので 30fps で十分
    if (!idle || now - last > 33) { draw(t); last = now; }
    if (!REDUCED.matches) kick();
  }
  function kick() {
    if (!raf && visible && !document.hidden && currentView === "dive") raf = requestAnimationFrame(frame);
  }
  if (!layout()) { requestAnimationFrame(() => { layout(); draw((performance.now() - t0) / 1000); kick(); }); }
  else { draw((performance.now() - t0) / 1000); kick(); }
  if ("ResizeObserver" in window) new ResizeObserver(() => { if (layout()) draw((performance.now() - t0) / 1000); }).observe(cv);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver((es) => { visible = es[0].isIntersecting; if (visible) kick(); }).observe($("#hero"));
  }
  document.addEventListener("visibilitychange", kick);
}

/* --- 演出版：最初の画面の和紙。紙の繊維を 1 枚だけ描いて、敷き詰める（継ぎ目が出ないよう、端をまたぐ繊維は反対側にも描く） --- */
function makeWashi() {
  const el = $("#hero-washi");
  if (!el) return;
  const css = getComputedStyle(document.documentElement);
  const WHITE = css.getPropertyValue("--foam").trim() || "#f2f8fa", NAVY = css.getPropertyValue("--trench").trim() || "#0c2435";
  const SZ = 480, R = 2, c = document.createElement("canvas");
  c.width = c.height = SZ * R;
  const x = c.getContext("2d");
  x.scale(R, R); x.lineCap = "round";
  const rnd = makeRandom(21);
  const fibers = (col, a, n, lmin, lmax, wmin, wmax) => {
    for (let i = 0; i < n; i++) {
      const px = rnd() * SZ, py = rnd() * SZ, len = lmin + rnd() * (lmax - lmin), ang = rnd() * Math.PI * 2;
      const bend = (rnd() - 0.5) * len * 0.6, w = wmin + rnd() * (wmax - wmin), alpha = a * (0.4 + 0.6 * rnd());
      const xs = px < lmax ? [0, SZ] : px > SZ - lmax ? [0, -SZ] : [0], ys = py < lmax ? [0, SZ] : py > SZ - lmax ? [0, -SZ] : [0];
      x.globalAlpha = alpha; x.strokeStyle = col; x.lineWidth = w;
      xs.forEach((ox) => ys.forEach((oy) => {
        const sx = px + ox, sy = py + oy, ex = sx + Math.cos(ang) * len, ey = sy + Math.sin(ang) * len;
        x.beginPath(); x.moveTo(sx, sy);
        x.quadraticCurveTo((sx + ex) / 2 - Math.sin(ang) * bend, (sy + ey) / 2 + Math.cos(ang) * bend, ex, ey);
        x.stroke();
      }));
    }
  };
  fibers(WHITE, 0.16, 900, 6, 36, 0.4, 1.0);                         // 長い繊維（白）
  fibers(NAVY, 0.06, 260, 4, 20, 0.3, 0.7);                          // 細かい繊維の影（紺）
  fibers(WHITE, 0.12, 500, 1, 3, 0.8, 1.6);                          // 漉きむらの小さな粒
  el.style.backgroundImage = `url(${c.toDataURL()})`;
  el.style.backgroundSize = `${SZ}px ${SZ}px`;
}

/* --- 演出版：立ちのぼる泡 --- */
function makeBubbles() {

    grp.style.cssText = `top:${gi * vh}px;height:${vh}px`;

      b.className = "bubble";

        `--s:${size.toFixed(1)}px`, `--d:${dur.toFixed(1)}s`, `--delay:${(-rand() * dur).toFixed(1)}s`,
        `--w:${((rand() - 0.5) * 40).toFixed(1)}px`, `--o:${(0.3 + rand() * 0.4).toFixed(2)}`,

/* =========================================================
   仕組みデモ（ivy_system / colormura_tool / auto_import / path_manager）
   元スクリプトの方式を、ブラウザの上で同じ考え方で組み直したもの。実際のツールの出力ではない。
   ・「潜って見る」ではスクロール量 p（0〜1）から絵を決める（scroll モード）
   ・詳細画面ではボタンで p を時間で動かす（manual モード）
   どちらも同じ draw(p) / update(p) を使う
   ========================================================= */
const PHASE = { steps: [[0.10, 0.34], [0.34, 0.60], [0.60, 0.86]], hold: 0.86 };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOut3 = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const stepQ = (p, i) => clamp((p - PHASE.steps[i][0]) / (PHASE.steps[i][1] - PHASE.steps[i][0]));
const toSRGB = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
const to255 = (lin) => Math.round(clamp(toSRGB(clamp(lin))) * 255);

/* 値を順位に直して 0〜1 に均す（両スクリプト共通の考え方） */
function rank01(a) {
  const n = a.length, r = new Float64Array(n);
  if (n <= 1) return r;
  const o = Array.from({ length: n }, (_, i) => i).sort((i, j) => a[i] - a[j] || i - j);
  o.forEach((idx, k) => { r[idx] = k / (n - 1); });
  return r;
}

/* ---- colormura_tool のノイズ（_core の mix32 / lattice / vnoise をそのまま移植） ---- */
function mix32(h) {
  h >>>= 0;
  h ^= h >>> 16; h = Math.imul(h, 0x7feb352d);
  h ^= h >>> 15; h = Math.imul(h, 0x846ca68b);
  h ^= h >>> 16;
  return h >>> 0;
}
function cmLattice(ix, iy, iz, seed) {
  const h = mix32((ix >>> 0) ^ mix32((iy >>> 0) ^ mix32((iz >>> 0) ^ (seed >>> 0))));
  return (h >>> 8) / 16777216;
}
function cmNoise(x, y, z, seed) {   // 0〜1。位置にはあらかじめ freq を掛けて渡す
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
  const c = (dx, dy, dz) => cmLattice(ix + dx, iy + dy, iz + dz, seed);
  const x00 = lerp(c(0, 0, 0), c(1, 0, 0), ux), x10 = lerp(c(0, 1, 0), c(1, 1, 0), ux);
  const x01 = lerp(c(0, 0, 1), c(1, 0, 1), ux), x11 = lerp(c(0, 1, 1), c(1, 1, 1), ux);
  return lerp(lerp(x00, x10, uy), lerp(x01, x11, uy), uz);
}
/* ---- ivy_system のノイズ（_hash3 / vnoise を移植。colormura とは別のハッシュ） ---- */
function ivyHash(ix, iy, iz, seed) {
  let h = Math.imul(ix, 73856093) ^ Math.imul(iy, 19349663) ^ Math.imul(iz, 83492791) ^ Math.imul(seed, 2654435761 | 0);
  h >>>= 0;
  h = ((h >>> 13) ^ h) >>> 0;
  h = Math.imul(h, 1274126177) >>> 0;
  h = ((h >>> 16) ^ h) >>> 0;
  return (h & 0xffffff) / 0x1000000;
}
function ivyNoise(x, y, z, freq, seed) {
  const qx = x * freq, qy = y * freq, qz = z * freq;
  const ix = Math.floor(qx), iy = Math.floor(qy), iz = Math.floor(qz);
  const fx = qx - ix, fy = qy - iy, fz = qz - iz;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy), uz = fz * fz * (3 - 2 * fz);
  const h = (dx, dy, dz) => ivyHash(ix + dx, iy + dy, iz + dz, seed);
  const x00 = h(0, 0, 0) + (h(1, 0, 0) - h(0, 0, 0)) * ux, x10 = h(0, 1, 0) + (h(1, 1, 0) - h(0, 1, 0)) * ux;
  const x01 = h(0, 0, 1) + (h(1, 0, 1) - h(0, 0, 1)) * ux, x11 = h(0, 1, 1) + (h(1, 1, 1) - h(0, 1, 1)) * ux;
  const y0 = x00 + (x10 - x00) * uy, y1 = x01 + (x11 - x01) * uy;
  return y0 + (y1 - y0) * uz;
}

/* 最短経路用の二分ヒープ */
function MinHeap() {
  const a = [];
  return {
    get size() { return a.length; },
    push(d, v) {
      a.push([d, v]);
      let i = a.length - 1;
      while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; }
    },
    pop() {
      const top = a[0], last = a.pop();
      if (a.length) {
        a[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1; let m = i;
          if (l < a.length && a[l][0] < a[m][0]) m = l;
          if (r < a.length && a[r][0] < a[m][0]) m = r;
          if (m === i) break;
          [a[m], a[i]] = [a[i], a[m]]; i = m;
        }
      }
      return top;
    },
  };
}

function simColors() {
  const cs = getComputedStyle(document.documentElement);
  const v = (n) => cs.getPropertyValue(n).trim();
  return { abyss: v("--abyss"), trench: v("--trench"), reef: v("--reef"), foam: v("--foam"), mist: v("--mist"), tide: v("--tide"), shallows: v("--shallows") };
}

/* =========================================================
   共通の土台：舞台・手順ボタン・状態文・タップ・時間で進める p
   ========================================================= */
function SimCore(def, els, mode, hooks = {}) {
  const manual = mode === "manual";
  const S = { p: manual ? (def.playground ? PHASE.hold : PHASE.steps[0][0]) : 0, ovr: null, anim: null, active: true, suspended: false, destroyed: false, shownStep: -2, lastDraw: 0 };
  const t0 = performance.now();
  const size = { w: 0, h: 0, dpr: 1 };
  const C = simColors();
  const mobile = () => matchMedia("(max-width: 640px)").matches;
  const coarse = () => matchMedia("(pointer: coarse)").matches;
  let raf = 0, canvas = null, g = null, ro = null;
  const cleanups = [];
  const on = (el, ev, fn, opt) => { el.addEventListener(ev, fn, opt); cleanups.push(() => el.removeEventListener(ev, fn, opt)); };

  const api = {
    manual, C, size,
    now: () => (performance.now() - t0) / 1000,
    frame: () => schedule(),
    mobile,
    setStatus(text) { if (els.status) els.status.textContent = text; },
    playOverride(from, to, ms) {
      if (REDUCED.matches) { render(); return; }
      S.ovr = { from, to, t0: performance.now(), dur: ms };
      schedule();
    },
    goToP(to, ms, done) {
      if (REDUCED.matches) { S.anim = null; S.p = to; updateUI(); render(); done && done(); return; }
      S.anim = { from: S.p, to, t0: performance.now(), dur: ms, done };
      updateUI(); schedule();
    },
    isHold: () => S.p >= PHASE.hold - 0.0005,
    redraw: () => { render(); },
  };

  /* ---------- 舞台 ---------- */
  def.prepare(api);
  if (def.kind === "canvas") {
    canvas = document.createElement("canvas");
    canvas.setAttribute("role", "img");
    if (def.key) canvas.tabIndex = 0;                                // キーボードでも触れる
    els.stage.appendChild(canvas);
    g = canvas.getContext("2d");
  } else {
    def.buildDom(els.stage, api);
  }
  function measure() {
    const w = els.stage.offsetWidth, h = els.stage.offsetHeight;      // getBoundingClientRect だと、ふわっと現れる最中（95% の大きさ）に測ったとき、小さいまま固定されてしまう
    if (def.kind === "canvas") {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (w !== size.w || h !== size.h || dpr !== size.dpr) {
        size.w = w; size.h = h; size.dpr = dpr;
        canvas.width = Math.max(1, Math.round(w * dpr)); canvas.height = Math.max(1, Math.round(h * dpr));
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        def.resize && def.resize(w, h, api);
      }
    } else {
      size.w = w; size.h = h;
      def.resize && def.resize(w, h, api);
    }
  }
  let roRaf = 0;
  if ("ResizeObserver" in window) {
    ro = new ResizeObserver(() => { if (!roRaf) roRaf = requestAnimationFrame(() => { roRaf = 0; if (!S.destroyed) { measure(); render(); } }); });   // 通知の最中ではなく、次のフレームで描く
    ro.observe(els.stage);
  }
  measure();

  /* ---------- 描画ループ ---------- */
  function effP(now) {
    if (S.ovr) {
      const k = clamp((now - S.ovr.t0) / S.ovr.dur);
      if (k >= 1) { S.ovr = null; return S.p; }
      return lerp(S.ovr.from, S.ovr.to, 1 - Math.pow(1 - k, 2));
    }
    return S.p;
  }
  function render(now = performance.now()) {
    if (S.destroyed) return;
    const p = effP(now), t = (now - t0) / 1000;
    if (def.kind === "canvas") {
      if (!size.w || !size.h) return;
      g.clearRect(0, 0, size.w, size.h);
      def.draw(g, size.w, size.h, p, t, api);
    } else {
      def.update(p, t, api);
    }
  }
  const idleOn = () => !!def.idle && S.p >= PHASE.hold - 0.0005 && !REDUCED.matches;
  function schedule() { if (!raf && !S.destroyed && !S.suspended && S.active) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    if (S.destroyed || S.suspended || !S.active) return;
    let busy = false;
    if (S.anim) {
      const k = clamp((now - S.anim.t0) / S.anim.dur);
      S.p = lerp(S.anim.from, S.anim.to, easeInOut(k));
      if (k >= 1) { const d = S.anim.done; S.anim = null; updateUI(); d && d(); } else { updateUI(); busy = true; }
    }
    const fx = (def.animating && def.animating(api.now())) || !!S.ovr;
    if (!busy && !fx && idleOn() && now - S.lastDraw < 33) { schedule(); return; }  // 揺れだけのときは 30fps
    S.lastDraw = now;
    render(now);
    if (busy || fx || S.anim || idleOn()) schedule();
  }

  /* ---------- 手順ボタン・状態文 ---------- */
  function updateUI() {
    const p = S.p;
    const done = [0, 1, 2].map((i) => stepQ(p, i) >= 0.999);
    const cur = p < PHASE.steps[1][0] ? (p > PHASE.steps[0][0] ? 0 : -1) : p < PHASE.steps[2][0] ? 1 : 2;
    let idx = -1;
    for (let i = 2; i >= 0; i--) {
      const th = S.shownStep >= i ? 0.34 : 0.40;   // しきい値の前後でちらつかない
      if (stepQ(p, i) >= th) { idx = i; break; }
    }
    const reached = done.lastIndexOf(true);
    (els.stepBtns || []).forEach((b, i) => {
      b.dataset.done = String(done[i]);
      if (i === cur && !done[i]) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      if (manual) b.disabled = !!S.anim || i > reached + 1;
    });
    if (idx !== S.shownStep) {
      S.shownStep = idx;
      const text = idx >= 0 ? def.status(idx, api) : "";
      api.setStatus(text);
      if (canvas) canvas.setAttribute("aria-label", text || def.label);
    }
    const hold = p >= PHASE.hold - 0.0005;
    if (els.hint) { els.hint.hidden = !hold; els.hint.textContent = def.hint ? (coarse() ? def.hint.touch : def.hint.mouse) : (coarse() ? "タップすると動きます。" : "触れると動きます。"); }
    if (els.controls) els.controls.hidden = !(manual && hold);
    if (!hold) def.onLeaveHold && def.onLeaveHold(api);
  }

  function goToStep(i) {
    const [s, e] = PHASE.steps[i];
    const dur = [1500, 2600, 2600][i];
    if (REDUCED.matches) { S.p = e; updateUI(); render(); return; }
    if (S.p < s - 0.0005 || S.p >= e - 0.0005) S.p = s;   // 戻る・やり直しはその手順の始めから
    api.goToP(e, dur);
  }
  (els.stepBtns || []).forEach((b, i) => on(b, "click", () => { manual ? goToStep(i) : hooks.scrollToStep && hooks.scrollToStep(i); }));
  if (els.reset) on(els.reset, "click", () => { manual ? api.goToP(PHASE.steps[0][0], 600) : hooks.scrollToStep && hooks.scrollToStep(-1); });

  /* ---------- 触る（タップ） ---------- */
  if (def.tap || def.hover || def.drag) {
    let down = null, dragging = false;
    const local = (e) => { const r = els.stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top, r.width, r.height]; };
    const isHold = () => S.p >= PHASE.hold - 0.0005;
    on(els.stage, "pointerdown", (e) => {
      if (e.target.closest && e.target.closest("input, textarea, select, label, button, [data-no-gesture]")) { down = null; return; }
      down = { x: e.clientX, y: e.clientY, t: performance.now(), lx: e.clientX, ly: e.clientY }; dragging = false;
    });
    on(els.stage, "pointercancel", () => { down = null; dragging = false; });
    on(els.stage, "pointermove", (e) => {
      if (down && def.drag && isHold()) {
        if (!dragging && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) {
          if (e.pointerType !== "mouse" && Math.abs(e.clientY - down.y) > Math.abs(e.clientX - down.x)) { down = null; return; }   // 縦の動きは、ページのスクロールに任せる
          dragging = true; try { els.stage.setPointerCapture(e.pointerId); } catch (err) { /* 取れなくても動く */ }
        }
        if (dragging) { const [x, y] = local(e); def.drag(e.clientX - down.lx, e.clientY - down.ly, x, y, api, e); down.lx = e.clientX; down.ly = e.clientY; schedule(); return; }
      }
      if (def.hover && e.pointerType === "mouse" && isHold()) { const [x, y, w, h] = local(e); def.hover(x, y, w, h, api); schedule(); }
    });
    on(els.stage, "pointerleave", () => { if (def.hover) { def.hover(-1, -1, 0, 0, api); schedule(); } });
    on(els.stage, "pointerup", (e) => {
      if (dragging) { dragging = false; down = null; return; }
      if (!down) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
      down = null;
      if (moved >= 8 || dt > 400 || !isHold() || !def.tap) return;
      const [x, y, w, h] = local(e);
      const msg = def.tap(x, y, w, h, api, e);
      if (msg) api.setStatus(msg);
      schedule();
    });
    if (def.key && canvas) on(canvas, "keydown", (e) => { if (isHold() && def.key(e, api)) { e.preventDefault(); schedule(); } });
  }

  /* ---------- 操作パネル（詳細画面のモードだけ） ---------- */
  if (manual && els.controls) {
    const box = els.controls;
    let html = "";
    (def.controls || []).forEach((c) => {
      html += `<label class="sim-ctl"><span>${esc(c.label)}</span><output data-out="${c.id}">${c.fmt(c.value)}</output>
        <input type="range" data-ctl="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}"></label>`;
    });
    const extra = (def.buttons || []).map((b) => `<button class="btn" type="button" data-btn="${b.id}">${esc(b.label)}</button>`).join("")
      + (def.toggles || []).map((t) => `<label class="sim-toggle"><input type="checkbox" data-tog="${t.id}"${t.on ? " checked" : ""}> <span>${esc(t.label)}</span></label>`).join("");
    box.innerHTML = html + (extra ? `<div class="sim-ctl-row">${extra}</div>` : "");
    let pending = null;
    on(box, "input", (e) => {
      const id = e.target.dataset && e.target.dataset.ctl;
      if (!id) return;
      const c = def.controls.find((x) => x.id === id);
      const v = Number(e.target.value);
      box.querySelector(`[data-out="${id}"]`).textContent = c.fmt(v);
      pending = [id, v];
      if (!box._raf) box._raf = requestAnimationFrame(() => { box._raf = 0; if (pending) { def.onControl(pending[0], pending[1], api, box); pending = null; render(); } });
    });
    on(box, "click", (e) => { const b = e.target.closest("[data-btn]"); if (b) { def.onButton(b.dataset.btn, api, box); render(); } });
    on(box, "change", (e) => { const t = e.target.dataset && e.target.dataset.tog; if (t) { def.onToggle(t, e.target.checked, api); render(); } });
  }

  updateUI();
  if (!ro) render();                                    // 大きさを見張る処理があれば、最初の描画はそちらで 1 回だけ行う

  return {
    def, api,
    setProgress(p) {
      if (S.destroyed) return;
      if (S.anim) return;
      if (Math.abs(p - S.p) < 0.0004 && S.shownStep !== -2) return;
      S.p = p;
      if (S.ovr && p < PHASE.hold) S.ovr = null;
      updateUI();
      if (S.active && !S.suspended) render();
      if (idleOn()) schedule();
    },
    setEnter(e) {
      if (!els.enter) return;
      const k = easeOut3(e);
      els.enter.style.opacity = String(k);
      els.enter.style.transform = k >= 0.999 ? "none" : `translate3d(0, ${((1 - k) * 40).toFixed(1)}px, 0) scale(${(0.96 + 0.04 * k).toFixed(3)})`;
    },
    goToStep,
    reflow() { measure(); render(); },
    setActive(a) { S.active = a; if (a) { render(); schedule(); } else if (raf) { cancelAnimationFrame(raf); raf = 0; } },
    suspend(f) { if (S.suspended === f) return; S.suspended = f; if (!f) { measure(); render(); schedule(); } else if (raf) { cancelAnimationFrame(raf); raf = 0; } },
    get p() { return S.p; },
    destroy() {
      S.destroyed = true;
      if (raf) cancelAnimationFrame(raf);
      if (roRaf) cancelAnimationFrame(roRaf);
      if (ro) ro.disconnect();
      cleanups.forEach((f) => f());
      if (els.controls && els.controls._raf) cancelAnimationFrame(els.controls._raf);
      def.destroy && def.destroy();
    },
  };
}

/* =========================================================
   ivy_system（ツタ）
   元の方式：表面に点を撒く → 近い点どうしをつなぐ → 根から最短経路（ダイクストラ法）
            → ゴールごとに経路を束ねる → 枝ごとに平滑化・等間隔化・表面に吸着 → 太さは「その枝の先のゴールの数」
            → 葉は曲線に沿って左右交互に置き、ノイズと年齢で 生 / 枯れかけ / 枯れ に分ける
   デモでは点の数・パッチあたりの枝の数・曲線の間隔だけ減らしてある（コメントの「デモ」の所）
   ========================================================= */
function defIvy() {
  const WALL = { w: 6, h: 4 };                                   // テスト用の壁と同じ 6m × 4m
  const HOLE = { x0: 3.6, x1: 4.8, y0: 1.6, y1: 3.0 };          // 窓の穴（デモ用に足したもの。経路が回り込む）
  const BAND = 0.4;                                              // 根を決め直せる下の帯 [m]
  const P = {
    seed: 0, wander: 1.0, wander_scale: 0.6, root_band: 0.15, root_count: 3,
    cluster_count: 4, cluster_radius: 1.2, goals_per_cluster: 25 /* 元は 40 */, max_reach: 20, max_height: 8,
    area_keep: 0.8, mask_scale: 2.0, smooth: 6, step: 0.05 /* 元は 0.03 */,
    thick_base: 0.0025, thick_pow: 0.4, thick_max: 0.03, tip_radius: 0.0008,
    leaf_spacing: 0.09 /* 元は 0.05 */, leaf_size: 0.08, leaf_size_rand: 0.2,
    dead_ratio: 0.15, dying_ratio: 0.20, dead_scale: 1.0, dead_age_bias: 0.4,
    max_samples: 1800 /* 元は大きい */,
  };
  const THICK_VIS = 6, LEAF_VIS = 2;                              // 実寸だと細すぎて見えないので、描くときだけ拡大
  const STATE_SHRINK = [1.0, 0.9, 0.78];
  const COL_LIN = [[0.12, 0.35, 0.08], [0.45, 0.40, 0.10], [0.30, 0.18, 0.08]];   // 生 / 枯れかけ / 枯れ（元の Cd。線形）
  const COL = COL_LIN.map((c) => `rgb(${to255(c[0])},${to255(c[1])},${to255(c[2])})`);
  const STEM = "#4f6a34";

  const leafPath = new Path2D();            // ツタの葉：付け根がハート形、先が浅く 3 つに裂ける（長さ 1、+x が葉先）
  leafPath.moveTo(0, 0);
  leafPath.quadraticCurveTo(0.02, -0.26, 0.26, -0.30);
  leafPath.quadraticCurveTo(0.44, -0.32, 0.50, -0.44);
  leafPath.quadraticCurveTo(0.60, -0.30, 0.58, -0.17);
  leafPath.quadraticCurveTo(0.80, -0.14, 1.0, 0);
  leafPath.quadraticCurveTo(0.80, 0.14, 0.58, 0.17);
  leafPath.quadraticCurveTo(0.60, 0.30, 0.50, 0.44);
  leafPath.quadraticCurveTo(0.44, 0.32, 0.26, 0.30);
  leafPath.quadraticCurveTo(0.02, 0.26, 0, 0);
  leafPath.closePath();

  let D = null, view = { ox: 0, oy: 0, sc: 1 }, lastForced = null;
  const fx = { gusts: [], hover: null };

  function inHole(x, y) { return x > HOLE.x0 && x < HOLE.x1 && y > HOLE.y0 && y < HOLE.y1; }
  function snap(x, y) {                     // 窓の穴に入った点は、いちばん近い縁へ（表面への吸着の代わり）
    x = clamp(x, 0, WALL.w); y = clamp(y, 0, WALL.h);
    if (!inHole(x, y)) return [x, y];
    const dl = x - HOLE.x0, dr = HOLE.x1 - x, db = y - HOLE.y0, dt = HOLE.y1 - y, m = Math.min(dl, dr, db, dt);
    if (m === dl) return [HOLE.x0, y]; if (m === dr) return [HOLE.x1, y]; if (m === db) return [x, HOLE.y0]; return [x, HOLE.y1];
  }

  /* ---- 手順 1〜3 の計算を、最初に全部まとめて行う ---- */
  function compute(forced) { const gen = computeGen(forced); while (!gen.next().done); }      // 続けて一気に計算する（操作への反応用）
  function* computeGen(forced) {                                        // 段階ごとに区切れる版（読み込み直後を重くしない）
    lastForced = forced || null;
    const rng = makeRandom(7001 + P.seed * 131 + (forced ? 17 : 0));
    const area = WALL.w * WALL.h - (HOLE.x1 - HOLE.x0) * (HOLE.y1 - HOLE.y0);
    const n = P.max_samples;
    const spacing = Math.sqrt(area / n);                         // area / spacing² が上限を超えるので、元と同じく間隔を広げる
    const px = new Float64Array(n), py = new Float64Array(n);
    for (let i = 0; i < n;) { const x = rng() * WALL.w, y = rng() * WALL.h; if (inHole(x, y)) continue; px[i] = x; py[i] = y; i++; }
    const order = Array.from({ length: n }, (_, i) => i);        // 点が現れる順
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const ptRank = new Float64Array(n); order.forEach((id, k) => { ptRank[id] = k / n; });

    yield;
    // 近道グラフ（build_graph）：半径 R = 2.2 × spacing 以内をつなぐ。重み = d × (1 + wander × 0.5 × (n_i + n_j))
    const R = 2.2 * spacing, R2 = R * R;
    const gx = Math.ceil(WALL.w / R) + 1, gy = Math.ceil(WALL.h / R) + 1;
    const cells = Array.from({ length: gx * gy }, () => []);
    for (let i = 0; i < n; i++) cells[Math.floor(px[i] / R) + Math.floor(py[i] / R) * gx].push(i);
    const nz = new Float64Array(n);
    for (let i = 0; i < n; i++) nz[i] = ivyNoise(px[i], py[i], 0, 1 / Math.max(P.wander_scale, 1e-3), P.seed);
    const adj = Array.from({ length: n }, () => []);
    for (let i = 0; i < n; i++) {
      const cx = Math.floor(px[i] / R), cy = Math.floor(py[i] / R);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const X = cx + dx, Y = cy + dy; if (X < 0 || Y < 0 || X >= gx || Y >= gy) continue;
        for (const j of cells[X + Y * gx]) {
          if (j <= i) continue;
          const ddx = px[i] - px[j], ddy = py[i] - py[j], d2 = ddx * ddx + ddy * ddy;
          if (d2 > R2) continue;
          const d = Math.sqrt(d2);
          const w = P.wander > 0 ? d * (1 + P.wander * 0.5 * (nz[i] + nz[j])) : d;
          adj[i].push(j, w); adj[j].push(i, w);
        }
      }
    }

    yield;
    // 根（pick_roots）
    let ymin = Infinity; for (let i = 0; i < n; i++) ymin = Math.min(ymin, py[i]);
    let roots;
    if (forced) {
      let b = 0, bd = Infinity;
      for (let i = 0; i < n; i++) { const d = (px[i] - forced.x) ** 2 + (py[i] - forced.y) ** 2; if (d < bd) { bd = d; b = i; } }
      roots = [b];
    } else {
      const cand = []; for (let i = 0; i < n; i++) if (py[i] <= ymin + Math.max(P.root_band, 1e-3)) cand.push(i);
      const cnt = Math.max(1, Math.min(P.root_count, cand.length));
      const first = cand[Math.floor(rng() * cand.length)];
      const chosen = [first];
      let mind = cand.map((i) => (px[i] - px[first]) ** 2 + (py[i] - py[first]) ** 2);
      for (let k = 1; k < cnt; k++) {                           // できるだけ離して選ぶ
        let jm = 0; for (let j = 1; j < cand.length; j++) if (mind[j] > mind[jm]) jm = j;
        chosen.push(cand[jm]);
        mind = mind.map((m, j) => Math.min(m, (px[cand[j]] - px[cand[jm]]) ** 2 + (py[cand[j]] - py[cand[jm]]) ** 2));
      }
      roots = [...new Set(chosen)].sort((a, b) => a - b);
    }

    yield;
    // 最短経路（dijkstra）：根をすべて始点にする
    const dist = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1);
    const heap = MinHeap();
    for (const r of roots) { dist[r] = 0; heap.push(0, r); }
    while (heap.size) {
      const [d, u] = heap.pop();
      if (d > dist[u]) continue;
      if (d > P.max_reach) break;
      const a = adj[u];
      for (let e = 0; e < a.length; e += 2) {
        const v = a[e], nd = d + a[e + 1];
        if (nd < dist[v]) { dist[v] = nd; prev[v] = u; heap.push(nd, v); }
      }
    }

    yield;
    // ゴール（pick_goals）：生える面積の割合のマスクの中から、パッチごとに選ぶ
    const idx = []; for (let i = 0; i < n; i++) if (isFinite(dist[i]) && dist[i] <= P.max_reach && py[i] <= ymin + P.max_height) idx.push(i);
    const mask = idx.map((i) => ivyNoise(px[i], py[i], 0, 1 / Math.max(P.mask_scale, 1e-3), P.seed + 101));
    const rk = rank01(mask), keep = clamp(P.area_keep, 0.02, 1);
    let el = idx.filter((_, k) => rk[k] >= 1 - keep); if (!el.length) el = idx;
    const goalSet = new Set();
    for (let c = 0; c < P.cluster_count; c++) {
      const ci = el[Math.floor(rng() * el.length)];
      const mem = el.filter((i) => (px[i] - px[ci]) ** 2 + (py[i] - py[ci]) ** 2 <= P.cluster_radius ** 2);
      const k = Math.min(P.goals_per_cluster, mem.length);
      for (let a = 0; a < k; a++) { const b = a + Math.floor(rng() * (mem.length - a)); [mem[a], mem[b]] = [mem[b], mem[a]]; goalSet.add(mem[a]); }
    }
    const goals = [...goalSet].sort((a, b) => a - b);

    yield;
    // 枝分け（build_chains）：ゴールから根へたどった木を、枝分かれ点ごとの 1 本 1 本に分ける
    const children = new Map(), seen = new Set();
    for (const g of goals) {
      let v = g;
      while (v !== -1 && !seen.has(v)) {
        seen.add(v);
        const pv = prev[v];
        if (pv !== -1) { if (!children.has(pv)) children.set(pv, []); children.get(pv).push(v); }
        v = pv;
      }
    }
    const count = new Map(); for (const v of seen) count.set(v, 0);
    for (const g of goals) count.set(g, count.get(g) + 1);
    const rootsSorted = [...roots].sort((a, b) => a - b);
    const ord = [], st = rootsSorted.filter((r) => count.has(r));
    while (st.length) { const v = st.pop(); ord.push(v); for (const c of (children.get(v) || [])) st.push(c); }
    for (let i = ord.length - 1; i >= 0; i--) { const pv = prev[ord[i]]; if (pv !== -1) count.set(pv, count.get(pv) + count.get(ord[i])); }
    const chains = [], stack = [];
    for (const r of rootsSorted) for (const c of (children.get(r) || [])) stack.push([r, c, -1]);
    stack.reverse();
    while (stack.length) {
      const [s, c, pc] = stack.pop();
      const nodes = [s, c]; let cur = c;
      while ((children.get(cur) || []).length === 1) { cur = children.get(cur)[0]; nodes.push(cur); }
      const kids = children.get(cur) || [], at = chains.length;
      chains.push({ nodes, parent: pc, terminal: kids.length === 0, count: count.get(c), kids: [] });
      if (pc >= 0) chains[pc].kids.push(at);
      for (let i = kids.length - 1; i >= 0; i--) stack.push([cur, kids[i], at]);
    }

    yield;
    // 太さ・曲線（finish_chains）
    for (const ch of chains) ch.r0 = clamp(P.thick_base * Math.pow(Math.max(ch.count, 1), P.thick_pow), P.thick_base, P.thick_max);
    for (const ch of chains) {
      ch.r1 = ch.terminal ? P.tip_radius : Math.max(...ch.kids.map((k) => chains[k].r0));
      ch.r1 = Math.min(ch.r1, ch.r0);
    }
    for (const ch of chains) {
      let pts = ch.nodes.map((v) => [px[v], py[v]]);
      for (let it = 0; it < P.smooth && pts.length >= 3; it++) {      // 0.25 : 0.5 : 0.25 の平均
        const q = pts.map((a) => a.slice());
        for (let i = 1; i < pts.length - 1; i++) { q[i][0] = 0.25 * pts[i - 1][0] + 0.5 * pts[i][0] + 0.25 * pts[i + 1][0]; q[i][1] = 0.25 * pts[i - 1][1] + 0.5 * pts[i][1] + 0.25 * pts[i + 1][1]; }
        pts = q;
      }
      const s = [0]; for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      const L = s[s.length - 1], m = Math.max(2, Math.round(L / P.step) + 1), rs = [];
      for (let k = 0; k < m; k++) {
        const t = (L * k) / (m - 1); let j = 1; while (j < s.length - 1 && s[j] < t) j++;
        const f = (t - s[j - 1]) / Math.max(s[j] - s[j - 1], 1e-9);
        rs.push(snap(lerp(pts[j - 1][0], pts[j][0], f), lerp(pts[j - 1][1], pts[j][1], f)));
      }
      ch.pts = rs;
      ch.s = [0]; for (let i = 1; i < rs.length; i++) ch.s.push(ch.s[i - 1] + Math.hypot(rs[i][0] - rs[i - 1][0], rs[i][1] - rs[i - 1][1]));
      const Ls = ch.s[ch.s.length - 1] || 1e-9, pw = ch.terminal ? 1.8 : 1.0;
      ch.rad = ch.s.map((si) => ch.r0 + (ch.r1 - ch.r0) * Math.pow(si / Ls, pw));
      const a0 = ch.parent < 0 ? 0 : chains[ch.parent].age[chains[ch.parent].age.length - 1];
      ch.age = ch.s.map((si) => a0 + si);
    }
    let maxAge = 1e-9; for (const ch of chains) maxAge = Math.max(maxAge, ch.age[ch.age.length - 1]);
    for (const ch of chains) ch.agen = ch.age.map((a) => a / maxAge);

    yield;
    // 描く用の線分（太さごとにまとめて描けるよう、半径を 0.5px 刻みで丸めた値も持つ）
    const segs = [];
    for (const ch of chains) for (let i = 1; i < ch.pts.length; i++) {
      segs.push({ x0: ch.pts[i - 1][0], y0: ch.pts[i - 1][1], x1: ch.pts[i][0], y1: ch.pts[i][1], r: (ch.rad[i - 1] + ch.rad[i]) / 2, a: ch.agen[i] });
    }

    yield;
    // 葉（make_leaves）：曲線に沿って左右交互に置く
    const L = { x: [], y: [], ang: [], size: [], agen: [], rnd: [], phase: [] };
    for (const ch of chains) {
      const total = ch.s[ch.s.length - 1];
      for (let t = P.leaf_spacing, k = 0; t < total; t += P.leaf_spacing, k++) {
        let j = 1; while (j < ch.s.length - 1 && ch.s[j] < t) j++;
        const f = (t - ch.s[j - 1]) / Math.max(ch.s[j] - ch.s[j - 1], 1e-9);
        const x = lerp(ch.pts[j - 1][0], ch.pts[j][0], f), y = lerp(ch.pts[j - 1][1], ch.pts[j][1], f);
        const tang = Math.atan2(ch.pts[j][1] - ch.pts[j - 1][1], ch.pts[j][0] - ch.pts[j - 1][0]);
        const side = k % 2 ? 1 : -1, r = rng();
        const tip = ch.terminal ? total - t : 999;
        const tipf = 0.55 + 0.45 * smooth(tip / 0.5);
        L.x.push(x); L.y.push(y);
        L.ang.push(tang + side * (0.85 + (r - 0.5) * 0.5));
        L.size.push(P.leaf_size * LEAF_VIS * tipf * (1 + (rng() - 0.5) * 2 * P.leaf_size_rand));
        L.agen.push(lerp(ch.agen[j - 1], ch.agen[j], f));
        L.rnd.push(rng()); L.phase.push(rng() * 6.283);
      }
    }
    const nl = L.x.length, u = new Float64Array(nl);
    for (let i = 0; i < nl; i++) u[i] = ivyNoise(L.x[i], L.y[i], 0, 1 / Math.max(P.dead_scale, 1e-3), P.seed + 7);
    const ur = rank01(u), tmp = new Float64Array(nl);
    for (let i = 0; i < nl; i++) tmp[i] = ur[i] - P.dead_age_bias * (L.agen[i] - 0.5);
    L.score = rank01(tmp);               // 順位で切るので、割合は「ちょうどその%」になる
    L.state = new Uint8Array(nl);

    yield;
    // 手順 2 の表示用：最短経路の木（prev でつながる線）と、ゴールへ通る道筋
    const tree = []; let maxD = 1e-9;
    for (let i = 0; i < n; i++) if (prev[i] >= 0 && isFinite(dist[i])) { tree.push(i); maxD = Math.max(maxD, dist[i]); }
    tree.sort((a, b) => dist[a] - dist[b]);
    D = { n, px, py, ptRank, prev, dist, maxD, tree, onPath: seen, goals, chains, segs, L, nl, spacing };
    applyStates();
  }
  function applyStates() {
    const L = D.L, dead = clamp(P.dead_ratio, 0, 1), dying = clamp(P.dying_ratio, 0, 1);
    for (let i = 0; i < D.nl; i++) L.state[i] = L.score[i] < dead ? 2 : L.score[i] < dead + dying ? 1 : 0;
  }

  /* ---- 描く ---- */
  function draw(g, w, h, p, t, api) {
    const C = api.C, pad = 14;
    const sc = Math.min((w - 2 * pad) / WALL.w, (h - 2 * pad) / WALL.h);
    const ox = (w - WALL.w * sc) / 2, oy = (h - WALL.h * sc) / 2;
    view = { ox, oy, sc, w, h };
    const X = (x) => ox + x * sc, Y = (y) => oy + (WALL.h - y) * sc;
    g.fillStyle = C.trench; g.fillRect(ox, oy, WALL.w * sc, WALL.h * sc);
    g.strokeStyle = C.reef; g.lineWidth = 1; g.strokeRect(ox + 0.5, oy + 0.5, WALL.w * sc - 1, WALL.h * sc - 1);
    g.fillStyle = C.abyss; g.fillRect(X(HOLE.x0), Y(HOLE.y1), (HOLE.x1 - HOLE.x0) * sc, (HOLE.y1 - HOLE.y0) * sc);
    g.strokeRect(X(HOLE.x0) + 0.5, Y(HOLE.y1) + 0.5, (HOLE.x1 - HOLE.x0) * sc - 1, (HOLE.y1 - HOLE.y0) * sc - 1);
    const q1 = stepQ(p, 0), q2 = stepQ(p, 1), q3 = stepQ(p, 2), hold = p >= PHASE.hold - 0.0005;
    if (hold) {                                                     // 根を決め直せる帯
      g.save(); g.setLineDash([4, 5]); g.strokeStyle = C.tide; g.globalAlpha = 0.6;
      g.beginPath(); g.moveTo(ox + 4, Y(BAND)); g.lineTo(ox + WALL.w * sc - 4, Y(BAND)); g.stroke(); g.restore();
    }
    if (!D) return;
    const fade = 1 - smooth(q3 / 0.3);                              // 手順 3 の頭で、点と線を消す
    // 手順 1：点
    if (fade > 0.01 && q1 > 0) {
      g.globalAlpha = 0.7 * fade; g.fillStyle = C.tide; g.beginPath();
      for (let i = 0; i < D.n; i++) if (D.ptRank[i] <= q1) { const x = X(D.px[i]), y = Y(D.py[i]); g.moveTo(x + 1.3, y); g.arc(x, y, 1.3, 0, 6.283); }
      g.fill(); g.globalAlpha = 1;
    }
    // 手順 2：根から広がる最短経路の木 → ゴールへの道筋
    if (fade > 0.01 && q2 > 0) {
      const front = q2 * 1.02 * D.maxD, hi = smooth((q2 - 0.7) / 0.3);
      g.lineWidth = 1; g.strokeStyle = C.reef; g.globalAlpha = (1 - 0.55 * hi) * fade; g.beginPath();
      for (const v of D.tree) { if (D.dist[v] > front) break; if (hi > 0 && D.onPath.has(v)) continue; const a = D.prev[v]; g.moveTo(X(D.px[a]), Y(D.py[a])); g.lineTo(X(D.px[v]), Y(D.py[v])); }
      g.stroke();
      if (hi > 0 || q2 > 0) {
        g.strokeStyle = C.shallows; g.lineWidth = 1.5; g.globalAlpha = (0.35 + 0.65 * hi) * fade; g.beginPath();
        for (const v of D.tree) { if (D.dist[v] > front) break; if (!D.onPath.has(v)) continue; const a = D.prev[v]; g.moveTo(X(D.px[a]), Y(D.py[a])); g.lineTo(X(D.px[v]), Y(D.py[v])); }
        g.stroke();
      }
      g.globalAlpha = 1;
    }
    // 手順 3：茎（太さごとにまとめて描く）
    if (q3 > 0) {
      const bucket = new Map();
      for (const s of D.segs) {
        if (s.a > q3) continue;
        const wpx = Math.max(1, s.r * THICK_VIS * sc * 2), key = Math.round(wpx * 2) / 2;
        let path = bucket.get(key); if (!path) { path = new Path2D(); bucket.set(key, path); }
        path.moveTo(X(s.x0), Y(s.y0)); path.lineTo(X(s.x1), Y(s.y1));
      }
      g.strokeStyle = STEM; g.lineCap = "round";
      for (const [wpx, path] of bucket) { g.lineWidth = wpx; g.stroke(path); }
      // 葉：その位置まで茎が届いた瞬間から開く
      const gusts = fx.gusts.map((q) => ({ x: q.x, y: q.y, e: t - q.t0 }));
      const L = D.L, idle = hold && !REDUCED.matches;
      for (const state of [0, 1, 2]) {
        g.fillStyle = COL[state];
        for (let i = 0; i < D.nl; i++) {
          if (L.state[i] !== state || L.agen[i] > q3) continue;
          const open = easeOut3((q3 - L.agen[i]) / 0.06);
          if (open <= 0.01) continue;
          let ang = L.ang[i];
          if (idle) ang += Math.sin(t * 1.3 + L.phase[i]) * 0.06;                               // 小さく揺れ続ける（先端で 2px 以内）
          for (const q of gusts) {                                                               // 風：波が通った葉が揺れる
            const d = Math.hypot(L.x[i] - q.x, L.y[i] - q.y), Rr = q.e * 3.2;
            ang += 0.55 * Math.exp(-(((d - Rr) / 0.7) ** 2)) * Math.exp(-q.e / 0.9) * Math.sin((q.e - d / 3.2) * 18);
          }
          if (fx.hover) {                                                                        // マウスの近くの葉は、離れる向きに傾く
            const dx = L.x[i] - fx.hover.x, dy = L.y[i] - fx.hover.y, d = Math.hypot(dx, dy);
            if (d < 0.6) { const away = Math.atan2(dy, dx), diff = Math.atan2(Math.sin(away - ang), Math.cos(away - ang)); ang += Math.sign(diff) * 0.1 * (1 - d / 0.6); }
          }
          g.save(); g.translate(X(L.x[i]), Y(L.y[i])); g.rotate(-ang);
          const s = L.size[i] * STATE_SHRINK[state] * sc * open; g.scale(s, s); g.fill(leafPath); g.restore();
        }
      }
    }
  }

  function regrow(wx, api) {
    compute({ x: wx, y: 0 });
    api.playOverride(PHASE.steps[1][0], PHASE.hold, 1000);
    return "この位置から生やし直しました。";
  }
  const pairText = (n) => String(n);

  return {
    id: "ivy", kind: "canvas", idle: true,
    label: "壁にツタが生えていく仕組みの図",
    steps: ["点を撒く", "経路を探す", "茎と葉を付ける"],
    prepare(api) { this.ready = runSliced(computeGen(null)).then(() => { api.redraw && api.redraw(); }); },
    draw,
    animating(now) { fx.gusts = fx.gusts.filter((q) => now - q.t0 < 1.4); return fx.gusts.length > 0; },
    status(i) {
      if (!D) return "";
      return [
        `壁の表面に ${pairText(D.n)} 個の点を撒きました。窓の部分には点がありません。`,
        `根から各点までの最短経路を求め、${D.goals.length} か所のゴールまでの道筋を選びました。`,
        "道筋を枝ごとに滑らかにして茎にし、葉を左右交互に付けました。枝は、その先にあるゴールが多いほど太くなります。",
      ][i];
    },
    tap(x, y, w, h, api) {
      const wx = (x - view.ox) / view.sc, wy = WALL.h - (y - view.oy) / view.sc;
      if (wx < 0 || wx > WALL.w || wy < 0 || wy > WALL.h) return;
      if (wy <= BAND) return regrow(wx, api);
      fx.gusts.push({ x: wx, y: wy, t0: api.now() });
    },
    hover(x, y) {
      if (x < 0) { fx.hover = null; return; }
      fx.hover = { x: (x - view.ox) / view.sc, y: WALL.h - (y - view.oy) / view.sc };
    },
    onLeaveHold() { fx.gusts.length = 0; fx.hover = null; },
    controls: [
      { id: "dead_ratio", label: "枯れ葉の割合", min: 0, max: 0.6, step: 0.01, value: P.dead_ratio, fmt: (v) => v.toFixed(2) },
      { id: "dying_ratio", label: "枯れかけの割合", min: 0, max: 0.6, step: 0.01, value: P.dying_ratio, fmt: (v) => v.toFixed(2) },
      { id: "wander", label: "うねり", min: 0, max: 3, step: 0.05, value: P.wander, fmt: (v) => v.toFixed(2) },
    ],
    buttons: [{ id: "seed", label: "別の生え方" }],
    onControl(id, v, api, box) {
      if (id === "dead_ratio" || id === "dying_ratio") {
        P[id] = v;
        const other = id === "dead_ratio" ? "dying_ratio" : "dead_ratio";
        if (P.dead_ratio + P.dying_ratio > 1) { P[other] = 1 - v; const el = box.querySelector(`[data-ctl="${other}"]`); el.value = P[other]; box.querySelector(`[data-out="${other}"]`).textContent = P[other].toFixed(2); }
        applyStates();
      } else if (id === "wander") { P.wander = v; compute(lastForced); }
    },
    onButton(id) { if (id === "seed") { P.seed = (P.seed + 1) % 20; compute(null); } },
  };
}

/* =========================================================
   colormura_tool（色ムラ）
   元の方式：各インスタンスの「ワールド位置」からノイズを取り、明るさ・色味（暖色↔寒色）・枯れスポットのムラを
            掛け算の色にして displayColor に書く（colormura_tool.py の _core を移植）
   実際のツールは 3 つを「適用」1回で同時に付ける。デモでは違いが見えるよう、1 つずつ重ねて見せる
   ========================================================= */
function defColormura() {
  const GR = { w: 24, d: 14 };                                   // 地面 24m × 14m
  const P = { amp: 0.2, freq: 0.5, seed: 0, tint: 0.5, dead: 0.10 };
  const K = { warm: [1.25, 1.05, 0.70], cool: [0.85, 1.0, 1.15], deadc: [1.5, 0.5, 0.7], dfreq: 1.5, dhard: 0.8 };
  const BASE = [0.12, 0.35, 0.08];                               // 草の基準色（ivy_system の「生」と同じ。線形）
  let N = 0, wx, wz, xn, F = null, lay = null;
  let trans = null, noiseOn = false, noiseGrid = null;

  const tuft = new Path2D();                                     // 草の株：細い葉 5 枚（高さ 1、根元が原点）
  [[-0.20, -0.62, 0.04], [-0.10, -0.86, 0.05], [0.0, -1.0, 0.055], [0.10, -0.84, 0.05], [0.21, -0.6, 0.04]].forEach(([tx, ty, bw], k) => {
    const bx = (k - 2) * 0.07;
    tuft.moveTo(bx - bw, 0); tuft.quadraticCurveTo(bx + tx * 0.35 - bw, ty * 0.55, tx, ty); tuft.quadraticCurveTo(bx + tx * 0.35 + bw, ty * 0.55, bx + bw, 0);
  });

  function layoutPlants(mobile) {
    const count = mobile ? 380 : 620, rng = makeRandom(4242);   // 元の指示書は 900 / 500。重なりすぎて色の違いが見えないので減らした
    const cols = Math.round(Math.sqrt((count * GR.w) / GR.d)), rows = Math.ceil(count / cols);
    const cw = GR.w / cols, ch = GR.d / rows, list = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      if (list.length >= count) break;
      list.push([(i + 0.5 + (rng() - 0.5) * 0.9) * cw, (j + 0.5 + (rng() - 0.5) * 0.9) * ch]);
    }
    list.sort((a, b) => a[1] - b[1]);                            // 奥から手前へ
    N = list.length; wx = new Float64Array(N); wz = new Float64Array(N); xn = new Float64Array(N);
    list.forEach((p, i) => { wx[i] = p[0]; wz[i] = p[1]; xn[i] = p[0] / GR.w; });
  }

  /* ---- 3 つの層の「掛ける色」を計算する（colormura_tool.py の LOP_CODE と同じ式） ---- */
  function factors(seed, amp, freq, tint, dead) {
    const f1 = new Float32Array(N), f2 = new Float32Array(N * 3), f3 = new Float32Array(N * 3), nd = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      const qx = wx[i] * freq, qy = 0, qz = wz[i] * freq;
      const n = 0.7 * cmNoise(qx, qy, qz, seed) + 0.3 * cmNoise(qx * 2.7 + 11.3, qy * 2.7 + 11.3, qz * 2.7 + 11.3, seed + 1);
      f1[i] = 1 + clamp((n - 0.5) * 3, -1, 1) * amp;                                     // 明るさ
      if (tint > 0) {                                                                    // 色味：暖色 ↔ 寒色
        const n2 = 0.7 * cmNoise(qx * 0.8 + 37.1, qy * 0.8 + 37.1, qz * 0.8 + 37.1, seed + 101)
                 + 0.3 * cmNoise(qx * 2.1 + 5.7, qy * 2.1 + 5.7, qz * 2.1 + 5.7, seed + 102);
        const t2 = clamp((n2 - 0.5) * 3, -1, 1) * tint;
        for (let c = 0; c < 3; c++) f2[i * 3 + c] = 1 + (K.warm[c] - 1) * Math.max(t2, 0) + (K.cool[c] - 1) * Math.max(-t2, 0);
      } else for (let c = 0; c < 3; c++) f2[i * 3 + c] = 1;
      const dx = qx * K.dfreq, dy = qy * K.dfreq, dz = qz * K.dfreq;                      // 枯れスポット：上位 dead 割合
      nd[i] = 0.65 * cmNoise(dx + 71.7, dy + 71.7, dz + 71.7, seed + 201) + 0.35 * cmNoise(dx * 2.3 + 3.1, dy * 2.3 + 3.1, dz * 2.3 + 3.1, seed + 202);
    }
    const r = rank01(nd);
    let w = Math.max((1 - K.dhard) * 0.3, 0.002);
    w = Math.min(w, Math.max(2 * Math.min(dead, 1 - dead), 0.002));                       // 境目が dead の範囲をはみ出さないように
    for (let i = 0; i < N; i++) {
      let m = 0;
      if (dead >= 1) m = 1; else if (dead > 0) m = smooth((r[i] - (1 - dead)) / w + 0.5);
      for (let c = 0; c < 3; c++) f3[i * 3 + c] = 1 + (K.deadc[c] - 1) * m;
    }
    return { f1, f2, f3 };
  }
  const recompute = () => { F = factors(P.seed, P.amp, P.freq, P.tint, P.dead); noiseGrid = null; };

  /* p のときの各株の色（線形）。左から右へ波のように切り替わる */
  function colorsAt(p, F0) {
    const out = new Float32Array(N * 3);
    const q = [stepQ(p, 0), stepQ(p, 1), stepQ(p, 2)];
    for (let i = 0; i < N; i++) {
      const m = q.map((qq) => smooth(qq * 1.4 - xn[i] * 0.4));
      const b = 1 + (F0.f1[i] - 1) * m[0];
      for (let c = 0; c < 3; c++) {
        const t = 1 + (F0.f2[i * 3 + c] - 1) * m[1], d = 1 + (F0.f3[i * 3 + c] - 1) * m[2];
        out[i * 3 + c] = BASE[c] * b * t * d;
      }
    }
    return out;
  }

  /* ---- 描く ---- */
  function layout(w, h, mobile) {
    const pad = 12, halfNear = w / 2 - pad;
    lay = { w, h, pad, halfNear, sx: new Float32Array(N), sy: new Float32Array(N), ss: new Float32Array(N) };
    const unit = (w / Math.sqrt(N * (w / h))) * 1.7;
    for (let i = 0; i < N; i++) {
      const t = wz[i] / GR.d, p = project(t, wx[i], w, h);
      lay.sx[i] = p[0]; lay.sy[i] = p[1]; lay.ss[i] = unit * (0.42 + 0.78 * t);
    }
  }
  function project(t, x, w, h) {                                  // t: 0 が奥、1 が手前
    const half = (w / 2 - 12) * (0.6 + 0.4 * t);
    return [w / 2 + ((x - GR.w / 2) / (GR.w / 2)) * half, h * (0.1 + 0.84 * Math.pow(t, 1.1))];
  }
  function draw(g, w, h, p, t, api) {
    if (!lay || lay.w !== w || lay.h !== h) layout(w, h);
    const C = api.C;
    const a = project(0, 0, w, h), b = project(0, GR.w, w, h), c = project(1, GR.w, w, h), d = project(1, 0, w, h);
    g.fillStyle = C.trench; g.strokeStyle = C.reef; g.lineWidth = 1;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]); g.closePath(); g.fill(); g.stroke();
    if (noiseOn) {                                                // 明るさのノイズを、地面の上に薄く見せる
      if (!noiseGrid) { noiseGrid = []; for (let iz = 0; iz < 18; iz++) for (let ix = 0; ix < 30; ix++) {
        const x = (ix + 0.5) * GR.w / 30, z = (iz + 0.5) * GR.d / 18;
        noiseGrid.push([ix, iz, 0.7 * cmNoise(x * P.freq, 0, z * P.freq, P.seed) + 0.3 * cmNoise(x * P.freq * 2.7 + 11.3, 11.3, z * P.freq * 2.7 + 11.3, P.seed + 1)]);
      } }
      for (const [ix, iz, n] of noiseGrid) {
        const t0 = iz / 18, t1 = (iz + 1) / 18, x0 = ix * GR.w / 30, x1 = (ix + 1) * GR.w / 30;
        const p0 = project(t0, x0, w, h), p1 = project(t0, x1, w, h), p2 = project(t1, x1, w, h), p3 = project(t1, x0, w, h);
        g.fillStyle = `rgba(242,248,250,${(0.34 * n).toFixed(3)})`;
        g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.lineTo(p3[0], p3[1]); g.closePath(); g.fill();
      }
    }
    let col = colorsAt(p, F);
    if (trans && p >= PHASE.hold - 0.0005) {                      // タップ：その位置から波が広がり、新しい色ムラに切り替わる
      const e = t - trans.t0;
      if (e > 2.1) trans = null; else {
        col = new Float32Array(N * 3);
        for (let i = 0; i < N; i++) {
          const d = Math.hypot(lay.sx[i] - trans.cx, lay.sy[i] - trans.cy) / trans.maxd;
          const wv = smooth((e - d * 1.6) / 0.3);
          for (let c = 0; c < 3; c++) col[i * 3 + c] = lerp(trans.from[i * 3 + c], trans.to[i * 3 + c], wv);
        }
      }
    } else if (trans) trans = null;
    const sway = p >= PHASE.hold - 0.0005 && !REDUCED.matches;
    for (let i = 0; i < N; i++) {
      g.fillStyle = `rgb(${to255(col[i * 3])},${to255(col[i * 3 + 1])},${to255(col[i * 3 + 2])})`;
      const s = lay.ss[i], lean = sway ? Math.sin(t * 1.1 + wx[i] * 0.9 + wz[i] * 0.6) * 0.05 : 0;   // 揺れは先端で 2px 以内
      g.save(); g.translate(lay.sx[i], lay.sy[i]); g.transform(1, 0, lean, 1, 0, 0); g.scale(s, s); g.fill(tuft); g.restore();
    }
  }

  return {
    id: "colormura", kind: "canvas", idle: true,
    label: "草のインスタンスに色ムラが付いていく仕組みの図",
    steps: ["明るさのムラ", "色味のムラ", "枯れスポット"],
    prepare(api) { layoutPlants(api.mobile()); recompute(); },
    draw,
    resize() { lay = null; },
    animating(now) { return !!trans; },
    status(i) {
      return [
        "各インスタンスのワールド位置からノイズを取り、明るさを変えました。実際のツールでは、この3つを「適用」1回でまとめて付けます。",
        "別のノイズで、暖色と寒色の方向に色を寄せました。",
        `さらに別のノイズの上位 ${Math.round(P.dead * 100)}% を、茶色い枯れスポットにしました。`,
      ][i];
    },
    tap(x, y, w, h, api) {
      const from = colorsAt(1, F);
      P.seed += 1; recompute();
      const to = colorsAt(1, F);
      trans = { from, to, cx: x, cy: y, t0: api.now(), maxd: Math.max(w, h) * 0.9 };
      return `シードを ${P.seed} に変えて、色ムラを作り直しました。`;
    },
    onLeaveHold() { trans = null; },
    controls: [
      { id: "amp", label: "明るさ", min: 0, max: 0.5, step: 0.01, value: P.amp, fmt: (v) => v.toFixed(2) },
      { id: "freq", label: "周波数（1/m）", min: 0.1, max: 2.0, step: 0.05, value: P.freq, fmt: (v) => v.toFixed(2) },
      { id: "seed", label: "シード", min: 0, max: 50, step: 1, value: P.seed, fmt: (v) => String(Math.round(v)) },
      { id: "tint", label: "色味", min: 0, max: 1, step: 0.05, value: P.tint, fmt: (v) => v.toFixed(2) },
      { id: "dead", label: "枯れ割合", min: 0, max: 0.5, step: 0.01, value: P.dead, fmt: (v) => v.toFixed(2) },
    ],
    buttons: [{ id: "clear", label: "全部削除" }],
    toggles: [{ id: "noise", label: "ノイズを見る", on: false }],
    onControl(id, v, api) {
      P[id] = id === "seed" ? Math.round(v) : v;
      recompute();
      if (id === "dead") api.setStatus(this.status(2));
    },
    onButton(id, api) {
      if (id !== "clear") return;
      api.goToP(PHASE.steps[0][0], 800, () => api.setStatus("色ムラを外して、元の色に戻しました。"));
    },
    onToggle(id, on) { if (id === "noise") noiseOn = on; },
  };
}

/* =========================================================
   path_manager（パス管理）
   元の方式：シーンのファイル参照を集めて、同じパスごとに 1 行にまとめる → 探す場所（$JOB）の全ファイルを
            「小文字のファイル名 → パス」の索引にして、同じ名前のフォルダを候補にする（連番・UDIM はトークンを数字に置き換えて探す）
            → 選んだ行を書き換える（Ctrl+Z 1回で戻る）。式付きの欄は書き換えず、手で直すよう知らせる
   ========================================================= */
function defPathManager() {
  const ROWS_SRC = [
    { name: "Rock_BaseColor.<UDIM>.exr", node: "/mat/rock/basecolor", folder: "D:/old_project/tex", kind: "テクスチャ", exists: false, cands: ["$JOB/tex/rock"] },
    { name: "Wood_Albedo.png", node: "/mat/wood/albedo", folder: "D:/old_project/tex", kind: "テクスチャ", exists: false, cands: ["$JOB/old/tex", "$JOB/tex/wood"] },
    { name: "tree_A.fbx", node: "/obj/tree_A/file1", folder: "D:/old_project/geo", kind: "オブジェクト", exists: false, cands: ["$JOB/geo"] },
    { name: "smoke.$F4.exr", node: "/obj/smoke/file1", folder: "D:/old_project/fx", kind: "テクスチャ", exists: false, cands: ["$JOB/fx/smoke"] },
    { name: "Metal_Rough.png", node: "/mat/metal/rough", folder: "D:/old_project/tex", kind: "テクスチャ", exists: false, cands: [] },
    { name: "Rock_Normal.png", node: "/mat/rock/normal", folder: "D:/old_project/tex", kind: "テクスチャ", exists: false, cands: ["$JOB/tex/rock"], expr: true },
    { name: "Wood_Albedo.png", node: "/mat/floor/albedo", folder: "$JOB/tex/wood", kind: "テクスチャ", exists: true, cands: [] },
  ];
  // 元の並び：ファイルが無いものが先、種類、名前（小文字）の順
  const ROWS = ROWS_SRC.slice().sort((a, b) => (a.exists - b.exists) || (a.kind < b.kind ? -1 : a.kind > b.kind ? 1 : 0) || (a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1));
  const n = ROWS.length;
  const relinkable = ROWS.map((r) => !r.exists && r.cands.length > 0 && !r.expr);
  const withCands = ROWS.map((r) => !r.exists && r.cands.length > 0);
  const missingCount = ROWS.filter((r) => !r.exists).length;
  const candCount = withCands.filter(Boolean).length;
  const relinkedCount = relinkable.filter(Boolean).length;
  const undone = new Set(), pick = ROWS.map(() => 0);
  let showOk = true, root = null, cache = [], lastStatus = "";

  function buildDom(stage) {
    root = document.createElement("div"); root.className = "pm";
    root.innerHTML = `
      <div class="pm-top"><span>探す場所:</span><code>$JOB</code><span class="pm-skip" data-skip hidden>対象外 3 件</span></div>
      <div class="pm-head"><span>状態</span><span>ファイル名</span><span class="pm-c-node">使っているノード</span><span class="pm-c-place">今の場所</span><span class="pm-c-target">つなぎ直し先</span></div>
      <div class="pm-rows">${ROWS.map((r, i) => `
        <div class="pm-row" data-row="${i}" hidden>
          <span class="pm-st"></span>
          <span class="pm-name"><span class="pm-file">${esc(r.name)}</span><span class="pm-sub">${esc(r.node)}</span></span>
          <span class="pm-c-node pm-node">${esc(r.node)}</span>
          <span class="pm-c-place pm-place"></span>
          <span class="pm-c-target pm-target"></span>
          <span class="pm-m"></span>
          <span class="pm-note" hidden></span>
        </div>`).join("")}</div>`;
    stage.appendChild(root);
    root.addEventListener("click", (e) => {
      if (e.target.closest("select")) return;
      const row = e.target.closest(".pm-row"); if (!row) return;
      row.dispatchEvent(new CustomEvent("pm-tap", { bubbles: true }));
    });
    root.addEventListener("change", (e) => { const s = e.target.closest("select"); if (s) { pick[+s.closest(".pm-row").dataset.row] = s.selectedIndex; cache = []; } });
    cache = [];
  }

  function state(i, p) {
    const r = ROWS[i], q1 = stepQ(p, 0), q2 = stepQ(p, 1), q3 = stepQ(p, 2);
    const o = { vis: q1 >= (i + 1) / (n + 1) && (showOk || !r.exists || false), st: r.exists ? "ok" : "miss", folder: r.folder, target: "", sel: false, note: "" };
    if (r.exists && !showOk) o.vis = false;
    const c = withCands.slice(0, i).filter(Boolean).length;
    if (withCands[i] && q2 >= (c + 1) / (candCount + 1)) { o.st = "cand"; o.target = r.cands[pick[i]] + "/" + r.name; }
    if (!r.cands.length && !r.exists && q2 >= 0.9) o.target = "探す場所に同じ名前のファイルが無い";
    if (q3 > 0) o.sel = !r.exists || true;
    const k = relinkable.slice(0, i).filter(Boolean).length;
    if (relinkable[i] && !undone.has(i) && q3 >= 0.12 + 0.62 * (k / relinkedCount)) { o.st = "ok"; o.folder = r.cands[pick[i]]; o.target = ""; }
    if (r.expr && q3 >= 0.82) o.note = "式が付いているので、手で直してください。";
    return o;
  }
  const LBL = { ok: "OK", cand: "候補あり", miss: "見つからない" };

  function update(p) {
    for (let i = 0; i < n; i++) {
      const s = state(i, p), key = JSON.stringify(s) + pick[i];
      if (cache[i] === key) continue;
      cache[i] = key;
      const el = root.querySelector(`[data-row="${i}"]`), r = ROWS[i];
      el.hidden = !s.vis;
      el.dataset.st = s.st; el.classList.toggle("is-sel", s.sel && s.st !== "ok");
      el.querySelector(".pm-st").textContent = LBL[s.st];
      el.querySelector(".pm-place").textContent = s.folder;
      const tg = el.querySelector(".pm-target");
      if (s.st === "cand" && r.cands.length > 1) {
        tg.innerHTML = `<select aria-label="${esc(r.name)}のつなぎ直し先">${r.cands.map((c2, k) => `<option${k === pick[i] ? " selected" : ""}>${esc(c2 + "/" + r.name)}</option>`).join("")}</select>`;
      } else tg.textContent = s.target;
      el.querySelector(".pm-m").textContent = s.target || s.folder;
      const nt = el.querySelector(".pm-note"); nt.hidden = !s.note; nt.textContent = s.note;
    }
    root.querySelector("[data-skip]").hidden = stepQ(p, 0) < 0.5;
  }

  return {
    id: "pathmanager", kind: "dom", label: "リンク切れのパスを調べてつなぎ直す仕組みの図",
    steps: ["シーンを調べる", "候補を探す", "つなぎ直す"],
    prepare() {},
    buildDom,
    update(p, t, api) {
      update(p);
      if (!root._bound) {
        root._bound = true;
        root.addEventListener("pm-tap", (e) => {
          if (!api.isHold()) return;
          const i = +e.target.closest(".pm-row").dataset.row;
          if (!relinkable[i]) return;
          const back = !undone.has(i);
          if (back) undone.add(i); else undone.delete(i);
          cache = []; update(1);
          api.setStatus(back ? `${ROWS[i].name} を、つなぎ直す前に戻しました。` : `${ROWS[i].name} をつなぎ直しました。`);
        });
      }
    },
    status(i) {
      return [
        `ファイルが見つからない参照が ${missingCount} 件ありました。対象外にした参照が 3 件あります。`,
        `$JOB の中から同じファイル名を探し、${candCount} 件に候補が見つかりました。`,
        `${relinkedCount} か所つなぎ直しました。つなぎ直せなかったもの: Metal_Rough.png: 候補なし / Rock_Normal.png: 式が付いているので、手で直してください`,
      ][i];
    },
    onLeaveHold() { if (undone.size) { undone.clear(); cache = []; } },
    toggles: [{ id: "ok", label: "つながっているものも表示", on: true }],
    buttons: [{ id: "undo", label: "元に戻す" }],
    onToggle(id, on) { if (id === "ok") { showOk = on; cache = []; } },
    onButton(id, api) { if (id === "undo") api.goToP(PHASE.steps[1][1], 500, () => api.setStatus("つなぎ直しを取り消しました。Ctrl+Z 1回と同じです。")); },
    destroy() { root = null; },
  };
}

/* =========================================================
   auto_import（FBX の取り込み）
   元の方式：FBX を入れると SOP（File → Attribute Delete → Transform → Output）と
            LOP（Component Geometry → Material Library → Component Material → Component Output）を組む。
            テクスチャは FBX の近くから探し、ファイル名の単語でマテリアルの入力に振り分ける。
            USD は $HIP/_usd/<名前>/<名前>__v01.usd に書き出し、同じ名前があれば __v02 … と上げる（上書きしない）
   ========================================================= */
function defAutoImport() {
  const FILES = [
    { id: "fbx", name: "Rock_A.fbx", dir: "" },
    { id: "bc", name: "Rock_A_BaseColor.png", dir: "textures/", slot: "base_color", swatch: "#b9a78a" },
    { id: "rg", name: "Rock_A_Roughness.png", dir: "textures/", slot: "specular_roughness", swatch: "#8a8a8a" },
    { id: "nm", name: "Rock_A_Normal.png", dir: "textures/", slot: "normal", swatch: "#8f8ac8" },
    { id: "mt", name: "Rock_A_Metallic.png", dir: "textures/", slot: "metalness", swatch: "#3a3f45" },
    { id: "ht", name: "Rock_A_Height.png", dir: "textures/", skip: "使わない（Displacement は初期設定でオフ）" },
    { id: "tb", name: "Tree_B_BaseColor.png", dir: "textures/", skip: "使わない（別のアセットの画像）" },
    { id: "rd", name: "readme.txt", dir: "textures/", skip: "使わない（画像ではない）" },
  ];
  const SLOTS = ["base_color", "specular_roughness", "metalness", "normal", "displacement"];
  const SOP = ["File", "Attribute Delete", "Transform", "Output"];
  const LOP = ["Component Geometry", "Material Library", "Component Material", "Component Output"];
  let root = null, versions = 1, flights = [], cache = {}, glow = null, geom = null;

  function buildDom(stage) {
    root = document.createElement("div"); root.className = "ai";
    root.innerHTML = `
      <div class="ai-col ai-files"><h4>ファイル</h4>
        <ul><li class="ai-file" data-f="fbx" style="opacity:0"><span class="ai-fn">${esc(FILES[0].name)}</span></li>
        <li class="ai-dir">textures/</li>${FILES.slice(1).map((f) => `<li class="ai-file ai-in" data-f="${f.id}"><span class="ai-fn">${esc(f.name)}</span><span class="ai-why"></span></li>`).join("")}</ul>
        <h4 class="ai-oh" style="opacity:0">書き出し</h4><ul class="ai-out"></ul>
      </div>
      <div class="ai-col ai-graph"><h4>ノード</h4>
        <div class="ai-chains">
          <ol class="ai-chain" data-chain="sop">${SOP.map((s) => `<li class="ai-node" style="opacity:0">${esc(s)}</li>`).join("")}</ol>
          <ol class="ai-chain" data-chain="lop">${LOP.map((s) => `<li class="ai-node" style="opacity:0">${esc(s)}</li>`).join("")}</ol>
        </div>
      </div>
      <div class="ai-col ai-mat"><h4>マテリアル</h4>
        <ul>${SLOTS.map((s) => `<li class="ai-slot" data-slot="${s}"><span class="ai-sw"></span><span class="ai-sn">${s}</span><span class="ai-got"></span></li>`).join("")}</ul>
      </div>
      <div class="ai-fly"></div>`;
    stage.appendChild(root);
    root.addEventListener("click", (e) => {
      const api = root && root._api; if (!api || !api.isHold()) return;
      const out = e.target.closest(".ai-out li"), node = e.target.closest(".ai-node");
      if (out) addVersion(api);
      else if (node) { glow = { chain: node.parentElement.dataset.chain, until: performance.now() + 600 }; api.frame(); }
    });
    cache = {};
  }
  function measureGeom() {                                        // 出発点（ファイル欄）と到着点（マテリアルの入力）。.ai が基準
    if (!root) return;
    geom = {};
    FILES.forEach((f) => {
      if (!f.slot) return;
      const a = root.querySelector(`[data-f="${f.id}"]`), b = root.querySelector(`[data-slot="${f.slot}"] .ai-got`);
      geom[f.id] = { x0: a.offsetLeft, y0: a.offsetTop, x1: b.offsetLeft, y1: b.offsetTop };
    });
  }
  function setStyle(el, o) { const s = JSON.stringify(o); if (el._s === s) return; el._s = s; Object.assign(el.style, o); }

  function update(p) {
    const q1 = stepQ(p, 0), q2 = stepQ(p, 1), q3 = stepQ(p, 2);
    if (!geom) measureGeom();
    // 1：FBX が入り、SOP のノードが順に現れる
    const fbx = root.querySelector('[data-f="fbx"]'); setStyle(fbx, { opacity: String(easeOut3(q1 / 0.15)), transform: `translateX(${(-12 * (1 - easeOut3(q1 / 0.15))).toFixed(1)}px)` });
    fbx.classList.toggle("is-on", q1 > 0.05);
    root.querySelectorAll('[data-chain="sop"] .ai-node').forEach((el, i) => { const a = easeOut3((q1 - (0.15 + i * 0.2)) / 0.2); setStyle(el, { opacity: String(a), transform: `translateY(${(6 * (1 - a)).toFixed(1)}px)` }); });
    // 2：ファイル名の単語から、マテリアルの入力へ
    FILES.forEach((f, i) => {
      const el = root.querySelector(`[data-f="${f.id}"]`); if (f.id === "fbx") return;
      const k = FILES.filter((x) => x.slot).indexOf(f);
      const fl = f.slot ? clamp((q2 - k * 0.17) / 0.28) : 0;
      if (f.slot) {
        setStyle(el, { opacity: String((1 - 0.65 * easeOut3(fl)).toFixed(3)) });   // 行は残して薄くする（一覧が飛び飛びにならないように）
        const g = geom && geom[f.id], gh = root.querySelector(`.ai-fly [data-ghost="${f.id}"]`);
        const slot = root.querySelector(`[data-slot="${f.slot}"]`);
        if (g && fl > 0) {
          let gel = gh; if (!gel) { gel = document.createElement("span"); gel.className = "ai-ghost"; gel.dataset.ghost = f.id; gel.textContent = f.name; root.querySelector(".ai-fly").appendChild(gel); }
          const e = easeOut3(fl), landed = fl >= 0.999;
          setStyle(gel, { opacity: landed ? "0" : "1", transform: `translate(${lerp(g.x0, g.x1, e).toFixed(1)}px, ${lerp(g.y0, g.y1, e).toFixed(1)}px)` });
          const got = slot.querySelector(".ai-got"); got.textContent = landed ? f.name : ""; slot.classList.toggle("is-got", landed);
          slot.querySelector(".ai-sw").style.background = landed ? f.swatch : "";
        } else {
          if (gh) gh.style.opacity = "0";
          slot.classList.remove("is-got"); slot.querySelector(".ai-got").textContent = ""; slot.querySelector(".ai-sw").style.background = "";
        }
      } else {
        const a = q2 > 0.12;
        el.classList.toggle("is-skip", a); el.querySelector(".ai-why").textContent = a ? f.skip : "";
      }
    });
    const disp = root.querySelector('[data-slot="displacement"] .ai-got'); disp.textContent = q2 > 0.8 ? "オフ" : "";
    // 3：LOP のノードが現れ、USD が書き出される
    root.querySelectorAll('[data-chain="lop"] .ai-node').forEach((el, i) => { const a = easeOut3((q3 - (0.05 + i * 0.16)) / 0.2); setStyle(el, { opacity: String(a), transform: `translateY(${(6 * (1 - a)).toFixed(1)}px)` }); });
    const oh = root.querySelector(".ai-oh"), out = root.querySelector(".ai-out");
    setStyle(oh, { opacity: String(easeOut3((q3 - 0.78) / 0.15)) });
    const want = q3 >= 0.9 ? versions : 0;
    if (out.children.length !== want) {
      out.innerHTML = "";
      for (let v = 1; v <= want; v++) { const li = document.createElement("li"); li.innerHTML = `<span class="ai-path">$HIP/_usd/Rock_A/</span><span class="ai-fn">Rock_A__v${String(v).padStart(2, "0")}.usd</span>`; out.appendChild(li); }
    }
    if (glow && performance.now() > glow.until) glow = null;
    root.querySelectorAll(".ai-node").forEach((el) => el.classList.toggle("is-glow", !!glow && el.parentElement.dataset.chain === glow.chain));
  }
  function addVersion(api) {
    if (versions >= 5) return;
    versions += 1; cache = {};
    const n = String(versions).padStart(2, "0");
    api.setStatus(`同じ名前があったので、Rock_A__v${n}.usd として書き出しました。前の版は残っています。`);
    api.redraw();
  }

  return {
    id: "autoimport", kind: "dom", label: "FBX を取り込んで USD アセットにするまでの仕組みの図",
    steps: ["FBX を入れる", "テクスチャを割り当てる", "USD に書き出す"],
    prepare() { versions = 1; },
    buildDom(stage, api) { buildDom(stage); root._api = api; },
    update(p, t, api) { root._api = api; update(p); },
    animating() { return !!glow; },
    resize() { geom = null; },
    status(i) {
      return [
        "Rock_A.fbx を読み込む SOP のノードを組みました。",
        "ファイル名の単語から、4 枚の画像をマテリアルの入力に割り当てました。",
        "USD アセットを組んで、Rock_A__v01.usd に書き出しました。",
      ][i];
    },
    onLeaveHold() { if (versions !== 1) { versions = 1; cache = {}; } },
    buttons: [{ id: "again", label: "もう一度書き出す" }],
    onButton(id, api) { if (id === "again") addVersion(api); },
    destroy() { root = null; geom = null; },
  };
}

/* =========================================================
   Mismatch Bridge（uneven_bridge.py）
   元の方式：両側の辺を面に沿って外側へ（辺ぜんたいで同じ向きに）押し出す（押し出し量 = 2 つの穴の中心の距離 × 隙間比）
            → 押し出した辺を「お互いのエッジ数の中間値」T = int((A + B) / 2 + 0.5) でリサンプル。増減は三角形で吸収（_zipper）
            → 数が揃った辺どうしをブリッジ（始点と向きは _align で合わせる）→ 元メッシュと結合して境界の頂点をマージ
   デモは開いた列だけ（閉じたループの巻き方向の扱いは、図にしていない）
   ========================================================= */
function defBridge() {
  const PAIRS = [[6, 11], [5, 9], [8, 14], [4, 12]];             // A と B のエッジ数
  const P = { pair: 0, off: 0.2, divs: 0 };
  let D = null, kick = 0;

  /* ---- 元のコードと同じ計算（開いた列のぶん） ---- */
  function sample(Qc, u, s) {
    let i = 0; while (i < u.length - 2 && u[i + 1] <= s) i++;
    const du = u[i + 1] - u[i], t = du <= 0 ? 0 : (s - u[i]) / du;
    return [Qc[i][0] * (1 - t) + Qc[i + 1][0] * t, Qc[i][1] * (1 - t) + Qc[i + 1][1] * t];
  }
  function zipper(u, v) {                                          // 位置が揃う所はクワッド、ずれる所は三角形
    let i = 0, j = 0; const n = u.length - 1, m = v.length - 1, faces = [];
    while (i < n || j < m) {
      const c = [];
      if (i < n && j < m) c.push([Math.abs(u[i + 1] - v[j + 1]) - 1e-9, 0]);
      if (i < n) c.push([Math.abs(u[i + 1] - v[j]), 1]);
      if (j < m) c.push([Math.abs(u[i] - v[j + 1]), 2]);
      c.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const mv = c[0][1];
      if (mv === 0) { faces.push([["i", i], ["i", i + 1], ["o", j + 1], ["o", j]]); i++; j++; }
      else if (mv === 1) { faces.push([["i", i], ["i", i + 1], ["o", j]]); i++; }
      else { faces.push([["i", i], ["o", j + 1], ["o", j]]); j++; }
    }
    return faces;
  }
  function loopData(pts, dir) {
    const n = pts.length, segs = n - 1, out = [];
    for (let i = 0; i < n; i++) out.push([dir, 0]);                // 面の外側 = 隙間のほうへ
    // 押し出しの向きは、頂点ごとの法線ではなく、辺ぜんたいで 1 つにそろえる（各点の法線の平均）。
    // 法線のままだと、カーブした辺では押し出し先が中央へすぼまり、ブリッジの両端が凹んで見える。
    // 元のメッシュの格子も、辺を同じ向きに平行移動した形なので、新しい面はその続きとして並ぶ。
    let ax = 0, ay = 0;
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      const tx = b[0] - a[0], ty = b[1] - a[1], l = Math.hypot(tx, ty) || 1;
      let nx = ty / l, ny = -tx / l; if (nx * dir < 0) { nx = -nx; ny = -ny; }
      ax += nx; ay += ny;
    }
    const al = Math.hypot(ax, ay) || 1;
    for (let i = 0; i < n; i++) out[i] = [ax / al, ay / al];
    const acc = [0]; for (let k = 0; k < segs; k++) acc.push(acc[k] + Math.hypot(pts[k + 1][0] - pts[k][0], pts[k + 1][1] - pts[k][1]));
    return { P: pts, out, u: acc.map((a) => a / (acc[acc.length - 1] || 1)), segs };
  }
  function strip(L, T, dist) {
    const Q = L.P.map((p, i) => [p[0] + L.out[i][0] * dist, p[1] + L.out[i][1] * dist]);
    const v = Array.from({ length: T + 1 }, (_, k) => k / T);
    return { Q, outer: v.map((s) => sample(Q, L.u, s)), faces: zipper(L.u, v) };
  }
  function align(oA, oB) {                                         // B の向きを A に合わせる（開いた列）
    const N = oB.length, d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
    const fwd = d(oA[0], oB[0]) + d(oA[oA.length - 1], oB[N - 1]), rev = d(oA[0], oB[N - 1]) + d(oA[oA.length - 1], oB[0]);
    return rev < fwd ? { order: Array.from({ length: N }, (_, i) => N - 1 - i), rev: true } : { order: Array.from({ length: N }, (_, i) => i), rev: false };
  }
  function build() {
    const [sa, sb] = PAIRS[P.pair];
    const mk = (segs, x0, bow) => Array.from({ length: segs + 1 }, (_, i) => { const t = i / segs; return [x0 + Math.sin(Math.PI * t) * bow, 0.14 + 0.72 * t]; });
    const A = loopData(mk(sa, 0.30, -0.04), 1);
    const B = loopData(mk(sb, 0.70, 0.04).reverse(), -1);          // B は上から下の向きで選ばれた、という想定
    const T = Math.max(1, Math.floor((A.segs + B.segs) / 2 + 0.5));
    const cen = (L) => L.P.reduce((s, p) => [s[0] + p[0], s[1] + p[1]], [0, 0]).map((x) => x / L.P.length);
    const cA = cen(A), cB = cen(B), dist = Math.hypot(cB[0] - cA[0], cB[1] - cA[1]) * P.off;
    const sA = strip(A, T, dist), sB = strip(B, T, dist), al = align(sA.outer, sB.outer);
    const outB = al.order.map((k) => sB.outer[k]);
    const rings = [sA.outer];
    for (let r = 1; r <= P.divs; r++) { const t = r / (P.divs + 1); rings.push(sA.outer.map((p, k) => [lerp(p[0], outB[k][0], t), lerp(p[1], outB[k][1], t)])); }
    rings.push(outB);
    D = { A, B, T, sA, sB, rings, sa, sb };
  }

  const FILL_Q = "rgba(127,214,236,.20)", FILL_T = "rgba(201,222,231,.42)";
  function draw(g, w, h, p, t, api) {
    if (!D) return;
    const C = api.C, X = (q) => q[0] * w, Y = (q) => q[1] * h;
    const q1 = stepQ(p, 0), q2 = stepQ(p, 1), q3 = stepQ(p, 2);
    const poly = (pts, close, fill, stroke, lw) => {
      g.beginPath(); pts.forEach((q, i) => (i ? g.lineTo(X(q), Y(q)) : g.moveTo(X(q), Y(q)))); if (close) g.closePath();
      if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1; g.stroke(); }
    };
    // 元のメッシュ（辺の外側に広がる格子）
    g.lineWidth = 1; g.strokeStyle = C.reef;
    for (const L of [D.A, D.B]) {
      const dir = -L.out[0][0] / Math.abs(L.out[0][0] || 1);
      for (let c = 1; c <= 3; c++) {
        poly(L.P.map((q) => [q[0] + dir * 0.07 * c, q[1]]), false, null, C.reef, 1);
      }
      L.P.forEach((q) => { g.beginPath(); g.moveTo(X(q), Y(q)); g.lineTo(X([q[0] + dir * 0.21, q[1]]), Y(q)); g.stroke(); });
    }
    // 1：押し出し
    const e1 = easeOut3(q1);
    const oldFade = 1 - smooth(q2 * 1.4);
    if (q1 > 0 && oldFade > 0.01) {
      g.globalAlpha = oldFade;
      for (const [L, S] of [[D.A, D.sA], [D.B, D.sB]]) {
        const E = L.P.map((q, i) => [lerp(q[0], S.Q[i][0], e1), lerp(q[1], S.Q[i][1], e1)]);
        for (let i = 0; i < L.segs; i++) poly([L.P[i], L.P[i + 1], E[i + 1], E[i]], true, FILL_Q, C.shallows, 1);
        poly(E, false, null, C.shallows, 2);
      }
      g.globalAlpha = 1;
    }
    // 2：中間のエッジ数に揃える。増減は三角形で吸収
    if (q2 > 0) {
      const a = smooth(q2 * 1.2);
      g.globalAlpha = a;
      for (const [L, S] of [[D.A, D.sA], [D.B, D.sB]]) {
        for (const f of S.faces) {
          const pts = f.map(([kind, k]) => (kind === "i" ? L.P[k] : S.outer[k]));
          poly(pts, true, pts.length === 3 ? FILL_T : FILL_Q, C.shallows, 1);
        }
        poly(S.outer, false, null, C.shallows, 2);
        g.fillStyle = C.foam; S.outer.forEach((q) => { g.beginPath(); g.arc(X(q), Y(q), 2.6, 0, 6.283); g.fill(); });
      }
      g.globalAlpha = 1;
    }
    // 3：数が揃った辺どうしをブリッジ
    if (q3 > 0) {
      for (let r = 0; r < D.rings.length - 1; r++) for (let k = 0; k < D.T; k++) {
        const reveal = smooth(q3 * 1.25 - (k / D.T) * 0.25 - 0.0);
        if (reveal <= 0.01) continue;
        const r0 = D.rings[r], r1 = D.rings[r + 1];
        g.globalAlpha = reveal;
        poly([r0[k], r0[k + 1], r1[k + 1], r1[k]], true, "rgba(127,214,236,.30)", C.foam, 1);
      }
      g.globalAlpha = 1;
      if (q3 > 0.9) {                                              // 結合して、境界の頂点をマージ
        g.strokeStyle = C.foam; g.lineWidth = 1.5; g.globalAlpha = smooth((q3 - 0.9) / 0.1);
        for (const ring of [D.rings[0], D.rings[D.rings.length - 1]]) ring.forEach((q) => { g.beginPath(); g.arc(X(q), Y(q), 5, 0, 6.283); g.stroke(); });
        g.globalAlpha = 1;
      }
    }
    // 選んだ境界エッジ
    for (const L of [D.A, D.B]) { poly(L.P, false, null, C.foam, 2); g.fillStyle = C.foam; L.P.forEach((q) => { g.beginPath(); g.arc(X(q), Y(q), 3, 0, 6.283); g.fill(); }); }
  }

  return {
    id: "bridge", kind: "canvas", idle: false,
    label: "エッジ数の違う2つの穴を、ブリッジでつなぐ仕組みの図",
    steps: ["押し出す", "数を揃える", "ブリッジする"],
    prepare() { build(); },
    draw,
    status(i) {
      return [
        "両側の辺を、面に沿って外側へ押し出しました。",
        `押し出した辺を、両側のエッジ数（${D.sa} と ${D.sb}）の中間の ${D.T} に揃えました。増減は三角形で吸収します。`,
        `数が揃った辺どうしをブリッジして、元のメッシュと結合し、境界の頂点をマージしました。`,
      ][i];
    },
    tap(x, y, w, h, api) {
      P.pair = (P.pair + 1) % PAIRS.length; build();
      api.playOverride(PHASE.steps[1][0], PHASE.hold, 1400);
      return `${D.sa} / ${D.sb} エッジ → ${D.T} に揃えてブリッジしました。`;
    },
    controls: [
      { id: "off", label: "押し出し量（隙間比）", min: 0.01, max: 0.45, step: 0.01, value: P.off, fmt: (v) => v.toFixed(2) },
      { id: "divs", label: "ブリッジ分割数", min: 0, max: 6, step: 1, value: P.divs, fmt: (v) => String(Math.round(v)) },
    ],
    buttons: [{ id: "pair", label: "別のエッジ数" }],
    onControl(id, v) { P[id] = id === "divs" ? Math.round(v) : v; build(); },
    onButton(id, api) { if (id === "pair") { P.pair = (P.pair + 1) % PAIRS.length; build(); api.setStatus(`${D.sa} / ${D.sb} エッジ → ${D.T} に揃えてブリッジしました。`); } },
  };
}

/* =========================================================
   arnold_material_tool（Maya / Arnold の aiStandardSurface）
   元の方式：Create（作って選択にアサイン）／ Copy・Paste（数値とテクスチャ接続を別のマテリアルへ）／
            Import（Substance Painter のテクスチャを、ファイル名の末尾の単語で振り分けて自動接続）
   オブジェクト・マテリアル・テクスチャのどれを選んでも、つながっているマテリアルを探して同じ操作で扱う
   ========================================================= */
function defArnold() {
  let root = null, dup = false, flipN = false;
  const SRC = [["base", "1.0"], ["baseColor", { con: "rock_color" }], ["specularRoughness", "0.35"], ["metalness", "0.0"], ["specularIOR", "1.5"], ["coat", "0.2"], ["normalCamera", { con: "aiNormalMap1" }]];
  const TGT0 = ["1.0", "(0.8, 0.8, 0.8)", "0.2", "0.0", "1.52", "0.0", "—"];
  const VALS = SRC.filter(([, v]) => typeof v === "string").length, CONS = SRC.length - VALS;
  const FILES = [
    { n: "Hero_Body_BaseColor.1001.png", key: "baseColor" }, { n: "Hero_Body_Roughness.1001.png", key: "roughness" },
    { n: "Hero_Body_Metallic.1001.png", key: "metalness" }, { n: "Hero_Body_Normal.1001.png", key: "normal" },
    { n: "Hero_Body_AO.1001.png", key: null },
  ];
  const ROWS3 = [
    ["baseColor", "sRGB - Texture", "baseColor"], ["roughness", "Utility - Raw", "specularRoughness"],
    ["metalness", "Utility - Raw", "metalness"], ["normal", "Utility - Raw", "aiNormalMap → normalCamera"],
  ];
  const cache = new WeakMap();
  const setS = (el, o) => { const s = JSON.stringify(o); if (cache.get(el) === s) return; cache.set(el, s); Object.assign(el.style, o); };
  const setT = (el, t) => { if (el.textContent !== t) el.textContent = t; };
  const cls = (el, c, on) => { if (el.classList.contains(c) !== on) el.classList.toggle(c, on); };

  function buildDom(stage) {
    root = document.createElement("div"); root.className = "am";
    root.innerHTML = `
      <div class="am-p" data-p="0">
        <div class="am-two">
          <div><h4>シーン</h4><ul class="am-objs">${["Rock_A", "Rock_B", "Wall_C"].map((o) => `<li data-o="${o}"><span>${o}</span><span class="am-as"></span></li>`).join("")}</ul></div>
          <div><h4>マテリアル</h4><div class="am-cards"><div class="am-card" data-c="mat"><b>aiStandardSurface1</b><span>aiStandardSurface</span></div><div class="am-card" data-c="sg"><b>aiStandardSurface1SG</b><span>shadingEngine</span></div></div></div>
        </div>
        <div class="am-btn" data-btn>Create &amp; Assign</div>
      </div>
      <div class="am-p" data-p="1">
        <div class="am-clip"></div>
        <div class="am-grid"><span></span><b>rock_MTL（コピー元）</b><b>moss_MTL（コピー先）</b>
          ${SRC.map(([a, v], i) => `<span class="am-a">${a}</span><span class="am-s" data-s="${i}">${typeof v === "string" ? v : "← " + v.con}</span><span class="am-t" data-t="${i}">${TGT0[i]}</span>`).join("")}</div>
      </div>
      <div class="am-p" data-p="2">
        <div class="am-two">
          <div><h4>フォルダ</h4><ul class="am-files">${FILES.map((f, i) => `<li data-f="${i}"><span>${f.n}</span><span class="am-tag"></span></li>`).join("")}</ul>
            <div class="am-set" style="opacity:0">Hero_Body  (4 maps, UDIM)</div></div>
          <div><h4>つなぎ方</h4><ul class="am-rows">${ROWS3.map((r, i) => `<li data-r="${i}" style="opacity:0"><b>${r[0]}</b><span>file（${r[1]}）</span><span class="am-to">${r[2]}</span></li>`).join("")}</ul></div>
        </div>
      </div>`;
    stage.appendChild(root);
  }

  function update(p) {
    // 各場面の動きは、手順の前半 62% で終える（残りは、できあがった状態を見せる時間にする）
    const done = (q) => clamp(q / 0.62), q1 = done(stepQ(p, 0)), q2 = done(stepQ(p, 1)), q3 = done(stepQ(p, 2));
    // 場面の切り替え：次の手順が始まってから、前の場面が消え、次の場面が現れる（手順が終わった状態では、何も消えない）
    const W = 0.008, out = (b) => 1 - smooth((p - b) / W), inn = (b) => smooth((p - b) / W);    // 手順が終わった位置（p = b）では、まだ前の場面を見せる
    const vis = [out(PHASE.steps[1][0]), inn(PHASE.steps[1][0]) * out(PHASE.steps[2][0]), inn(PHASE.steps[2][0])];
    root.querySelectorAll(".am-p").forEach((el, i) => setS(el, { opacity: vis[i].toFixed(3), visibility: vis[i] < 0.01 ? "hidden" : "visible" }));
    // 1：作って、選択にアサイン
    const rows = root.querySelectorAll(".am-objs li");
    cls(rows[0], "is-sel", q1 > 0.05);
    cls(root.querySelector("[data-btn]"), "is-on", q1 > 0.3 && q1 < 0.62);
    root.querySelectorAll(".am-card").forEach((el, i) => { const a = easeOut3((q1 - (0.5 + i * 0.12)) / 0.2); setS(el, { opacity: a.toFixed(3), transform: `translateY(${(8 * (1 - a)).toFixed(1)}px)` }); });
    setT(rows[0].querySelector(".am-as"), q1 > 0.85 ? "aiStandardSurface1" : "");
    // 2：コピー → 貼り付け
    setT(root.querySelector(".am-clip"), q2 > 0.08 ? `コピー中: rock_MTL（値 ${VALS} / 接続 ${CONS}）` : "コピー中: なし");
    SRC.forEach((r, i) => {
      const s = root.querySelector(`[data-s="${i}"]`), t = root.querySelector(`[data-t="${i}"]`);
      cls(s, "is-hot", q2 > 0.05 + (0.4 * i) / SRC.length && q2 < 0.5);
